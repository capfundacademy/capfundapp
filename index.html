        </div>
      </main>
    );
  }

  // ─── Admin Dashboard ─────────────────────────────────────────────────────
  function AdminDashboard({ user, profile, onSignOut }) {
    const [tab, setTab] = useState('autopilot');
    const [certs, setCerts] = useState([]);
    const [students, setStudents] = useState([]);
    const [draftLessons, setDraftLessons] = useState([]);
    const [loading, setLoading] = useState(true);
    const [approving, setApproving] = useState({});

    useEffect(() => {
      (async () => {
        const sb = await getSupabase();
        if (!sb) { setLoading(false); return; }
        const [{ data: c }, { data: s }, { data: dl }] = await Promise.all([
          sb.from('certifications').select('*').order('cert_number'),
          sb.from('profiles').select('id,full_name,email,role,created_at').in('role', ['student','organization_owner','organization_manager']).order('created_at', { ascending: false }),
          sb.from('lessons').select('*, modules(title, certifications(title))').in('status', ['draft','review']).order('created_at', { ascending: false })
        ]);
        setCerts(c || []);
        setStudents(s || []);
        setDraftLessons(dl || []);
        setLoading(false);
      })();
    }, []);

    const approveCert = async (cert) => {
      setApproving(a => ({ ...a, [cert.id]: true }));
      const sb = await getSupabase();
      if (sb) {
        await sb.from('certifications').update({ status: 'approved' }).eq('id', cert.id);
        setCerts(prev => prev.map(c => c.id === cert.id ? { ...c, status: 'approved' } : c));
      }
      setApproving(a => ({ ...a, [cert.id]: false }));
    };

    const approveLesson = async (lesson) => {
      setApproving(a => ({ ...a, [lesson.id]: true }));
      const sb = await getSupabase();
      if (sb) {
        await sb.from('lessons').update({ status: 'approved', reviewed_at: new Date().toISOString() }).eq('id', lesson.id);
        setDraftLessons(prev => prev.filter(l => l.id !== lesson.id));
      }
      setApproving(a => ({ ...a, [lesson.id]: false }));
    };

    const draftCount = certs.filter(c => c.status !== 'approved').length;

    return (
      <main className="max-w-6xl mx-auto px-4 py-10 fade-in">
        <div className="flex items-start justify-between mb-8">
          <div>
            <h1 className="text-3xl font-bold text-[#0F1631] mb-1">Admin Dashboard</h1>
            <p className="text-gray-500 text-sm">{user?.email} · {profile?.role?.replace('_',' ')}</p>
          </div>
          <button onClick={onSignOut} className="px-4 py-2 border border-gray-200 text-gray-500 text-sm rounded-lg hover:bg-gray-50 transition-colors">Sign Out</button>
        </div>
        <div className="flex gap-1 border-b border-gray-200 mb-8">
          {[['autopilot','🤖 Autopilot'],['curriculum','📚 Curriculum'],['capstone','🎓 Capstones'],['certifications','Certifications'],['students','Students'],['analytics','📊 Analytics'],['team','👥 Team'],['review','Content Review'],['commerce','Offers & Orders'],['crm','CRM'],['content','Content Engine'],['blog','Blog'],['affiliates','Affiliates'],['settings','⚙️ Settings']].map(([id,label]) => (
            <button key={id} onClick={() => setTab(id)}
              className={`px-5 py-3 text-sm font-semibold border-b-2 transition-colors ${tab===id ? 'border-[#2D1FB1] text-[#2D1FB1]' : 'border-transparent text-gray-500 hover:text-[#0F1631]'}`}>
              {label}
              {id==='certifications' && draftCount > 0 && <span className="ml-2 bg-amber-100 text-amber-700 text-xs px-1.5 py-0.5 rounded-full">{draftCount}</span>}
              {id==='review' && draftLessons.length > 0 && <span className="ml-2 bg-amber-100 text-amber-700 text-xs px-1.5 py-0.5 rounded-full">{draftLessons.length}</span>}
            </button>
          ))}
        </div>
        {loading ? <div className="text-center py-20 text-gray-400">Loading…</div> : (<>
          {tab === 'certifications' && (
            <div className="space-y-2">
              {certs.map(cert => (
                <div key={cert.id} className="bg-white border border-gray-200 rounded-xl p-5 flex items-center gap-4">
                  <span className="font-black text-gray-300 text-lg w-8">{String(cert.cert_number).padStart(2,'0')}</span>
                  <div className="flex-1">
                    <div className="font-semibold text-[#0F1631] text-sm">{cert.title}</div>
                    <div className="text-xs text-gray-400">{cert.hours_min}–{cert.hours_max}h</div>
                  </div>
                  {cert.status === 'approved'
                    ? <span className="text-xs px-3 py-1 rounded-full bg-green-50 text-green-700 font-semibold">Approved</span>
                    : <div className="flex items-center gap-2">
                        <span className="text-xs px-3 py-1 rounded-full bg-amber-50 text-amber-700 font-semibold">Draft</span>
                        <button onClick={() => approveCert(cert)} disabled={approving[cert.id]}
                          className="text-xs px-3 py-1.5 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700 disabled:opacity-50 transition-colors">
                          {approving[cert.id] ? 'Approving…' : 'Approve'}
                        </button>
                      </div>
                  }
                </div>
              ))}
            </div>
          )}
          {tab === 'students' && (
            <div className="space-y-2">
              {students.length === 0 && <div className="text-center py-12 text-gray-400">No students enrolled yet.</div>}
              {students.map(s => (
                <div key={s.id} className="bg-white border border-gray-200 rounded-xl p-5 flex items-center gap-4">
                  <div className="w-9 h-9 rounded-full bg-[#2D1FB1] text-white flex items-center justify-center font-bold text-sm flex-shrink-0">
                    {(s.full_name || s.email || '?')[0].toUpperCase()}
                  </div>
                  <div className="flex-1">
                    <div className="font-semibold text-[#0F1631] text-sm">{s.full_name || s.email}</div>
                    <div className="text-xs text-gray-400">{s.email} · {s.role}</div>
                  </div>
                  <div className="text-xs text-gray-400">{new Date(s.created_at).toLocaleDateString()}</div>
                </div>
              ))}
            </div>
          )}
          {tab === 'review' && (
            <div className="space-y-3">
              {draftLessons.length === 0 && <div className="text-center py-12 text-gray-400">No lessons pending review.</div>}
              {draftLessons.map(lesson => (
                <div key={lesson.id} className="bg-white border border-amber-200 rounded-xl p-5 flex items-center gap-4">
                  <div className="flex-1">
                    <div className="font-semibold text-[#0F1631] text-sm">{lesson.title}</div>
                    <div className="text-xs text-gray-400 mt-0.5">
                      {lesson.modules?.certifications?.title} › {lesson.modules?.title}
                    </div>
                  </div>
                  <span className="text-xs px-2.5 py-1 rounded-full bg-amber-50 text-amber-700 font-semibold capitalize">{lesson.status}</span>
                  <button onClick={() => approveLesson(lesson)} disabled={approving[lesson.id]}
                    className="text-xs px-3 py-1.5 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700 disabled:opacity-50 transition-colors">
                    {approving[lesson.id] ? 'Approving…' : 'Approve'}
                  </button>
                </div>
              ))}
            </div>
          )}
          {tab === 'autopilot'  && <AutopilotDashboard />}
          {tab === 'curriculum' && <CurriculumEditor />}
          {tab === 'capstone'   && <AdminCapstoneReview />}
          {tab === 'settings'   && <AdminPlatformSettings />}
          {tab === 'analytics'  && <AdminAnalytics students={students} certs={certs} />}
          {tab === 'team'       && <AdminTeam students={students} setStudents={setStudents} />}
          {tab === 'commerce'   && <AdminOffersManager />}
          {tab === 'crm'        && <CRMDashboard />}
          {tab === 'content'    && <ContentEngine />}
          {tab === 'blog'       && <AdminBlogManager />}
          {tab === 'affiliates' && <AdminAffiliates />}
        </>)}
      </main>
    );
  }

  // ─── Admin Platform Settings ─────────────────────────────────────────────
  function AdminPlatformSettings() {
    const [directorName, setDirectorName]     = useState('');
    const [directorTitle, setDirectorTitle]   = useState('Program Director');
    const [signatureDataUrl, setSignatureDataUrl] = useState(null);
    const [loading, setLoading]               = useState(true);
    const [saving, setSaving]                 = useState(false);
    const [msg, setMsg]                       = useState(null);
    const [drawing, setDrawing]               = useState(false);
    const [hasDrawn, setHasDrawn]             = useState(false);
    const sigCanvasRef = useRef(null);
    const lastPosRef   = useRef(null);

    useEffect(() => {
      (async () => {
        const sb = await getSupabase();
        if (!sb) { setLoading(false); return; }
        const { data } = await sb.from('admin_settings').select('*').eq('key', 'program_director').maybeSingle();
        if (data?.value) {
          setDirectorName(data.value.name || '');
          setDirectorTitle(data.value.title || 'Program Director');
          setSignatureDataUrl(data.value.signature_data_url || null);
        }
        setLoading(false);
      })();
    }, []);

    // Signature pad helpers
    const getPos = (e, canvas) => {
      const rect = canvas.getBoundingClientRect();
      const src  = e.touches ? e.touches[0] : e;
      return { x: src.clientX - rect.left, y: src.clientY - rect.top };
    };

    const startDraw = (e) => {
      e.preventDefault();
      const canvas = sigCanvasRef.current;
      if (!canvas) return;
      setDrawing(true);
      lastPosRef.current = getPos(e, canvas);
    };

    const draw = (e) => {
      e.preventDefault();
      if (!drawing) return;
      const canvas = sigCanvasRef.current;
      const ctx = canvas.getContext('2d');
      const pos = getPos(e, canvas);
      ctx.beginPath();
      ctx.moveTo(lastPosRef.current.x, lastPosRef.current.y);
      ctx.lineTo(pos.x, pos.y);
      ctx.strokeStyle = '#0F1631';
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
      lastPosRef.current = pos;
      setHasDrawn(true); // track that user actually drew
    };

    const endDraw = (e) => {
      e.preventDefault();
      setDrawing(false);
      lastPosRef.current = null;
    };

    const clearSignature = () => {
      const canvas = sigCanvasRef.current;
      if (!canvas) return;
      canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
      setSignatureDataUrl(null);
      setHasDrawn(false);
    };

    // Only capture if user actually drew — otherwise keep existing saved signature
    const captureSignature = () => {
      if (!hasDrawn) return null;
      const canvas = sigCanvasRef.current;
      if (!canvas) return null;
      return canvas.toDataURL('image/png');
    };

    const save = async () => {
      if (!directorName.trim()) return;
      setSaving(true);
      try {
        const sb = await getSupabase();
        const { data: { user } } = await sb.auth.getUser();
        // Only use newly drawn sig; otherwise preserve the existing saved one
        const newlyDrawn = captureSignature(); // null if nothing drawn
        const finalSig = newlyDrawn || signatureDataUrl;
        await sb.from('admin_settings').upsert({
          key: 'program_director',
          value: {
            name: directorName.trim(),
            title: directorTitle.trim(),
            signature_data_url: finalSig || null,
          },
          description: 'Program director name, title, and drawn signature for certificates',
          updated_by: user.id,
          updated_at: new Date().toISOString(),
        }, { onConflict: 'key' });
        if (finalSig) setSignatureDataUrl(finalSig);
        setMsg({ text: '✓ Saved! All certificates now show the updated signature.', type: 'success' });
        setTimeout(() => setMsg(null), 6000);
      } catch (e) {
        setMsg({ text: 'Save failed: ' + e.message, type: 'error' });
      }
      setSaving(false);
    };

    if (loading) return <div className="text-center py-16 text-gray-400">Loading settings…</div>;

    return (
      <div className="max-w-2xl">
        <h2 className="text-xl font-bold text-[#0F1631] mb-2">Platform Settings</h2>
        <p className="text-sm text-gray-500 mb-8">Configure settings that appear on all issued certificates.</p>

        <div className="bg-white border border-gray-200 rounded-2xl p-6 mb-6">
          <div className="flex items-center gap-3 mb-6">
            <div className="w-10 h-10 rounded-xl bg-[#2D1FB1]/10 flex items-center justify-center text-lg">✍️</div>
            <div>
              <div className="font-bold text-[#0F1631]">Program Director Signature</div>
              <div className="text-xs text-gray-500">Updates on every certificate automatically once saved</div>
            </div>
          </div>

          <div className="grid grid-cols-2 gap-4 mb-5">
            <div>
              <label className="block text-xs font-semibold text-gray-500 mb-1">Full Name</label>
              <input value={directorName} onChange={e => setDirectorName(e.target.value)}
                className="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#2D1FB1]"
                placeholder="e.g. Robert Nore" />
            </div>
            <div>
              <label className="block text-xs font-semibold text-gray-500 mb-1">Title</label>
              <input value={directorTitle} onChange={e => setDirectorTitle(e.target.value)}
                className="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#2D1FB1]"
                placeholder="e.g. Program Director" />
            </div>
          </div>

          {/* Signature pad */}
          <label className="block text-xs font-semibold text-gray-500 mb-2">
            Draw Signature Below <span className="text-gray-400 font-normal">(use mouse or trackpad)</span>
          </label>
          <div className="border-2 border-dashed border-gray-200 rounded-xl overflow-hidden mb-2 bg-gray-50 relative"
            style={{ touchAction:'none' }}>
            <canvas ref={sigCanvasRef} width={560} height={120}
              className="w-full block cursor-crosshair"
              style={{ touchAction:'none' }}
              onMouseDown={startDraw} onMouseMove={draw} onMouseUp={endDraw} onMouseLeave={endDraw}
              onTouchStart={startDraw} onTouchMove={draw} onTouchEnd={endDraw} />
            {!signatureDataUrl && !drawing && (
              <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                <span className="text-gray-300 text-sm select-none">Sign here with your mouse or trackpad →</span>
              </div>
            )}
          </div>
          <div className="flex items-center gap-3 mb-5">
            <button onClick={clearSignature} className="text-xs text-gray-500 hover:text-red-500 border border-gray-200 px-3 py-1.5 rounded-lg hover:border-red-200 transition">
              Clear &amp; Redo
            </button>
            <span className="text-xs text-gray-400">Your signature is saved as an image and will appear on all certificates</span>
          </div>

          {/* Live certificate preview */}
          <div className="bg-gray-50 border border-gray-200 rounded-xl p-5 mb-5">
            <div className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Certificate Preview</div>
            <div className="text-center inline-block">
              {signatureDataUrl ? (
                <img src={signatureDataUrl} alt="Signature" style={{ height:40, width:'auto', display:'block', marginBottom:4 }} />
              ) : (
                <span style={{ fontFamily:"'Dancing Script','Brush Script MT',cursive", fontSize:20, color:'#0F1631', fontWeight:700, display:'block', marginBottom:4 }}>
                  {directorName || 'Your Signature'}
                </span>
              )}
              <div className="border-t-2 border-[#0F1631] pt-1.5 w-40">
                <div className="text-xs font-bold text-[#0F1631]">{directorName || 'Director Name'}</div>
                <div className="text-xs text-gray-500">{directorTitle || 'Program Director'}</div>
              </div>
            </div>
          </div>

          {msg && (
            <div className={`text-sm px-4 py-2.5 rounded-lg mb-4 ${msg.type === 'error' ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-green-50 text-green-700 border border-green-200'}`}>
              {msg.text}
            </div>
          )}

          <button onClick={save} disabled={saving || !directorName.trim()}
            className="px-6 py-2.5 bg-[#2D1FB1] text-white text-sm font-bold rounded-xl hover:bg-indigo-700 disabled:opacity-50 transition-colors">
            {saving ? 'Saving…' : 'Save & Apply to All Certificates'}
          </button>
        </div>

        <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 text-sm text-amber-800">
          <strong>How it works:</strong> When a student views or prints their certificate, the app fetches the current program director signature from settings. Updating here immediately updates all certificates — no action needed from students.
        </div>
      </div>
    );
  }

  // ─── Admin Capstone Review ────────────────────────────────────────────────
  function AdminCapstoneReview() {
    const [submissions, setSubmissions] = useState([]);
    const [selected, setSelected]      = useState(null);
    const [loading, setLoading]        = useState(true);
    const [notes, setNotes]            = useState('');
    const [saving, setSaving]          = useState(false);

    useEffect(() => { loadSubmissions(); }, []);

    const loadSubmissions = async () => {
      setLoading(true);
      const sb = await getSupabase();
      if (!sb) { setLoading(false); return; }
      const { data } = await sb.from('capstone_submissions')
        .select('*, capstone_deliverables(*), profiles(full_name, email)')
        .order('submitted_at', { ascending: false });
      setSubmissions(data || []);
      setLoading(false);
    };

    const updateStatus = async (submissionId, status) => {
      setSaving(true);
      const sb = await getSupabase();
      const { data: { user } } = await sb.auth.getUser();
      await sb.from('capstone_submissions').update({
        status,
        reviewed_at: new Date().toISOString(),
        reviewed_by: user.id,
        reviewer_notes: notes,
        final_approved: status === 'approved',
      }).eq('id', submissionId);
      await loadSubmissions();
      setSelected(prev => prev ? { ...prev, status, reviewer_notes: notes } : null);
      setSaving(false);
    };

    const STATUS_COLORS = {
      draft:              'bg-gray-100 text-gray-600',
      submitted:          'bg-yellow-100 text-yellow-700',
      under_review:       'bg-blue-100 text-blue-700',
      revision_requested: 'bg-orange-100 text-orange-700',
      approved:           'bg-green-100 text-green-700',
      rejected:           'bg-red-100 text-red-700',
    };

    if (loading) return <div className="text-center py-16 text-gray-400">Loading capstone submissions…</div>;

    const pending = submissions.filter(s => s.status === 'submitted' || s.status === 'under_review');
    const others  = submissions.filter(s => s.status !== 'submitted' && s.status !== 'under_review');

    return (
      <div>
        <div className="flex items-center justify-between mb-6">
          <h2 className="text-xl font-bold text-[#0F1631]">Capstone Reviews</h2>
          <div className="flex items-center gap-3">
            {pending.length > 0 && <span className="bg-yellow-100 text-yellow-700 text-xs font-bold px-2 py-1 rounded-full">{pending.length} pending</span>}
            <button onClick={loadSubmissions} className="text-sm text-gray-500 hover:text-[#2D1FB1]">↻ Refresh</button>
          </div>
        </div>

        {selected && (
          <div className="fixed inset-0 z-50 bg-black/60 flex items-start justify-center p-4 overflow-y-auto">
            <div className="bg-white rounded-2xl w-full max-w-2xl my-8 shadow-2xl">
              <div className="flex items-center justify-between px-6 py-4 border-b border-gray-100">
                <div>
                  <div className="font-bold text-[#0F1631]">{selected.profiles?.full_name || selected.profiles?.email}</div>
                  <span className={`text-xs px-2 py-0.5 rounded-full font-semibold ${STATUS_COLORS[selected.status] || 'bg-gray-100 text-gray-600'}`}>{selected.status}</span>
                </div>
                <button onClick={() => setSelected(null)} className="text-gray-400 hover:text-gray-600 text-xl">✕</button>
              </div>
              <div className="px-6 py-4">
                <div className="text-sm font-semibold text-gray-500 mb-3">Deliverables ({selected.capstone_deliverables?.length || 0}/15 uploaded)</div>
                <div className="space-y-2 max-h-60 overflow-y-auto mb-4">
                  {CAPSTONE_DELIVERABLES.map((title, idx) => {
                    const del = (selected.capstone_deliverables || []).find(d => d.deliverable_number === idx + 1);
                    return (
                      <div key={idx} className="flex items-center gap-3 py-2 border-b border-gray-50 last:border-0">
                        <span className={`text-xs font-bold w-5 ${del ? 'text-green-600' : 'text-gray-300'}`}>{del ? '✓' : String(idx+1).padStart(2,'0')}</span>
                        <span className="flex-1 text-sm text-gray-700">{title}</span>
                        {del?.file_url ? (
                          <a href={del.file_url} target="_blank" rel="noopener noreferrer"
                            className="text-xs text-[#2D1FB1] hover:underline px-2">View ↗</a>
                        ) : (
                          <span className="text-xs text-gray-300">Not uploaded</span>
                        )}
                      </div>
                    );
                  })}
                </div>

                {selected.reviewer_notes && (
                  <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 mb-4 text-sm text-amber-800">
                    <strong>Previous notes:</strong> {selected.reviewer_notes}
                  </div>
                )}

                <label className="block text-xs font-semibold text-gray-500 mb-1">Review Notes (visible to student)</label>
                <textarea value={notes} onChange={e => setNotes(e.target.value)} rows={3}
                  className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#2D1FB1] mb-4"
                  placeholder="Feedback for the student (required for revision requests)…" />

                <div className="flex gap-2 flex-wrap">
                  <button onClick={() => updateStatus(selected.id, 'under_review')} disabled={saving}
                    className="px-4 py-2 bg-blue-600 text-white text-sm font-bold rounded-lg hover:bg-blue-700 disabled:opacity-50">
                    Mark Under Review
                  </button>
                  <button onClick={() => updateStatus(selected.id, 'revision_requested')} disabled={saving || !notes}
                    className="px-4 py-2 bg-orange-500 text-white text-sm font-bold rounded-lg hover:bg-orange-600 disabled:opacity-50">
                    Request Revision
                  </button>
                  <button onClick={() => updateStatus(selected.id, 'approved')} disabled={saving}
                    className="px-4 py-2 bg-green-600 text-white text-sm font-bold rounded-lg hover:bg-green-700 disabled:opacity-50">
                    ✓ Approve & Award Credential
                  </button>
                  <button onClick={() => updateStatus(selected.id, 'rejected')} disabled={saving}
                    className="px-4 py-2 bg-red-500 text-white text-sm font-bold rounded-lg hover:bg-red-600 disabled:opacity-50">
                    Reject
                  </button>
                </div>
              </div>
            </div>
          </div>
        )}

        {submissions.length === 0 ? (
          <div className="text-center py-16 text-gray-400">No capstone submissions yet.</div>
        ) : (
          <div className="space-y-3">
            {[...pending, ...others].map(sub => {
              const uploaded = (sub.capstone_deliverables || []).filter(d => d.file_url).length;
              return (
                <div key={sub.id} className="bg-white border border-gray-200 rounded-xl p-5 flex items-center gap-4 cursor-pointer hover:shadow-md transition"
                  onClick={() => { setSelected(sub); setNotes(sub.reviewer_notes || ''); }}>
                  <div className="w-10 h-10 rounded-full bg-[#2D1FB1] text-white flex items-center justify-center font-bold text-sm flex-shrink-0">
                    {(sub.profiles?.full_name || sub.profiles?.email || '?')[0].toUpperCase()}
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="font-semibold text-[#0F1631] text-sm truncate">{sub.profiles?.full_name || sub.profiles?.email}</div>
                    <div className="text-xs text-gray-400">{uploaded}/15 deliverables · {sub.submitted_at ? `Submitted ${new Date(sub.submitted_at).toLocaleDateString()}` : 'In progress'}</div>
                  </div>
                  <span className={`text-xs px-2 py-1 rounded-full font-semibold flex-shrink-0 ${STATUS_COLORS[sub.status] || 'bg-gray-100 text-gray-600'}`}>{sub.status}</span>
                  <span className="text-gray-400 text-sm">→</span>
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  }

  // ─── Admin Curriculum Editor ──────────────────────────────────────────────
  function CurriculumEditor() {
    const [certs, setCerts] = useState([]);
    const [expanded, setExpanded] = useState({});
    const [modules, setModules] = useState({});  // certId -> modules[]
    const [lessons, setLessons] = useState({});  // moduleId -> lessons[]
    const [loading, setLoading] = useState(true);
    const [editingLesson, setEditingLesson] = useState(null);
    const [editingModule, setEditingModule] = useState(null);
    const [showAddLesson, setShowAddLesson] = useState(null); // moduleId
    const [showAddModule, setShowAddModule] = useState(null); // certId
    const [saving, setSaving] = useState(false);

    useEffect(() => {
      (async () => {
        const sb = await getSupabase();
        if (!sb) { setLoading(false); return; }
        const { data } = await sb.from('certifications').select('*').order('cert_number');
        setCerts(data || []);
        setLoading(false);
      })();
    }, []);

    const loadModules = async (certId) => {
      if (modules[certId]) return;
      const sb = await getSupabase();
      const { data } = await sb.from('modules').select('*').eq('certification_id', certId).order('sort_order');
      setModules(m => ({ ...m, [certId]: data || [] }));
    };

    const loadLessons = async (moduleId) => {
      if (lessons[moduleId]) return;
      const sb = await getSupabase();
      const { data } = await sb.from('lessons').select('*').eq('module_id', moduleId).order('sort_order');
      setLessons(l => ({ ...l, [moduleId]: data || [] }));
    };

    const toggleCert = async (certId) => {
      const next = !expanded[certId];
      setExpanded(e => ({ ...e, [certId]: next }));
      if (next) await loadModules(certId);
    };

    const toggleModule = async (certId, moduleId) => {
      const key = `${certId}-${moduleId}`;
      const next = !expanded[key];
      setExpanded(e => ({ ...e, [key]: next }));
      if (next) await loadLessons(moduleId);
    };

    const saveLesson = async (lessonData) => {
      setSaving(true);
      const sb = await getSupabase();
      const { id, ...rest } = lessonData;
      if (id) {
        await sb.from('lessons').update(rest).eq('id', id);
        setLessons(prev => {
          const updated = { ...prev };
          for (const mid in updated) {
            updated[mid] = updated[mid].map(l => l.id === id ? { ...l, ...rest } : l);
          }
          return updated;
        });
      } else {
        const { data } = await sb.from('lessons').insert(rest).select().single();
        if (data) {
          setLessons(prev => ({ ...prev, [rest.module_id]: [...(prev[rest.module_id]||[]), data] }));
        }
      }
      setSaving(false);
      setEditingLesson(null);
      setShowAddLesson(null);
    };

    const saveModule = async (modData) => {
      setSaving(true);
      const sb = await getSupabase();
      const { id, ...rest } = modData;
      if (id) {
        await sb.from('modules').update(rest).eq('id', id);
        setModules(prev => {
          const updated = { ...prev };
          for (const cid in updated) {
            updated[cid] = updated[cid].map(m => m.id === id ? { ...m, ...rest } : m);
          }
          return updated;
        });
      } else {
        const { data } = await sb.from('modules').insert(rest).select().single();
        if (data) {
          setModules(prev => ({ ...prev, [rest.certification_id]: [...(prev[rest.certification_id]||[]), data] }));
        }
      }
      setSaving(false);
      setEditingModule(null);
      setShowAddModule(null);
    };

    const deleteLesson = async (lesson) => {
      if (!confirm(`Delete lesson "${lesson.title}"?`)) return;
      const sb = await getSupabase();
      await sb.from('lessons').delete().eq('id', lesson.id);
      setLessons(prev => ({ ...prev, [lesson.module_id]: prev[lesson.module_id].filter(l => l.id !== lesson.id) }));
    };

    if (loading) return <div className="text-center py-20 text-gray-400">Loading curriculum…</div>;

    return (
      <div>
        <div className="flex items-center justify-between mb-6">
          <h2 className="text-xl font-bold text-[#0F1631]">Curriculum Editor</h2>
          <span className="text-sm text-gray-500">{certs.length} certifications</span>
        </div>

        {(editingLesson !== null || showAddLesson) && (
          <LessonEditorModal
            lesson={editingLesson}
            moduleId={showAddLesson}
            onSave={saveLesson}
            onClose={() => { setEditingLesson(null); setShowAddLesson(null); }}
            saving={saving}
          />
        )}

        {(editingModule || showAddModule) && (
          <ModuleEditorModal
            module={editingModule}
            certId={showAddModule}
            onSave={saveModule}
            onClose={() => { setEditingModule(null); setShowAddModule(null); }}
            saving={saving}
          />
        )}

        <div className="space-y-2">
          {certs.map(cert => (
            <div key={cert.id} className="bg-white border border-gray-200 rounded-xl overflow-hidden">
              {/* Cert header */}
              <div className="flex items-center gap-3 px-5 py-4 cursor-pointer hover:bg-gray-50 transition"
                onClick={() => toggleCert(cert.id)}>
                <span className="font-black text-gray-300 w-8 text-sm">{String(cert.cert_number).padStart(2,'0')}</span>
                <div className="flex-1">
                  <div className="font-semibold text-[#0F1631] text-sm">{cert.title}</div>
                  <div className="text-xs text-gray-400">{cert.status}</div>
                </div>
                <span className="text-gray-400 text-xs">{expanded[cert.id] ? '▲' : '▼'}</span>
              </div>

              {expanded[cert.id] && (
                <div className="border-t border-gray-100 px-5 py-4 bg-gray-50">
                  {/* Modules */}
                  {(modules[cert.id] || []).map(mod => (
                    <div key={mod.id} className="mb-3 bg-white border border-gray-200 rounded-lg overflow-hidden">
                      <div className="flex items-center gap-3 px-4 py-3 cursor-pointer hover:bg-gray-50"
                        onClick={() => toggleModule(cert.id, mod.id)}>
                        <div className="w-5 h-5 rounded bg-[#2D1FB1]/10 text-[#2D1FB1] flex items-center justify-center text-xs font-bold flex-shrink-0">M</div>
                        <div className="flex-1 font-medium text-sm text-[#0F1631]">{mod.title}</div>
                        <button onClick={e => { e.stopPropagation(); setEditingModule(mod); }}

                        <span className="text-gray-400 text-xs">{expanded[`${cert.id}-${mod.id}`] ? '▲' : '▼'}</span>
                      </div>

                      {expanded[`${cert.id}-${mod.id}`] && (
                        <div className="border-t border-gray-100 px-4 py-3">
                          {(lessons[mod.id] || []).map(lesson => (
                            <div key={lesson.id} className="flex items-center gap-3 py-2 border-b border-gray-50 last:border-0">

                              <div className="flex-1 text-sm text-[#0F1631]">{lesson.title}</div>
                              <span className={`text-xs px-2 py-0.5 rounded-full ${lesson.status==='approved' ? 'bg-green-50 text-green-700' : 'bg-amber-50 text-amber-700'}`}>{lesson.status}</span>
                              {lesson.blocks?.length > 0 && <span className="text-xs bg-blue-50 text-blue-600 px-2 py-0.5 rounded-full">{lesson.blocks.length} blocks</span>}
                              <button onClick={() => setEditingLesson(lesson)}
                                className="text-xs text-[#2D1FB1] hover:underline px-2 py-1">Edit</button>
                              <button onClick={() => deleteLesson(lesson)}
                                className="text-xs text-red-400 hover:text-red-600 px-1">✕</button>
                            </div>
                          ))}
                          <button onClick={() => setShowAddLesson(mod.id)}
                            className="mt-3 w-full py-2 border-2 border-dashed border-gray-200 rounded-lg text-xs text-gray-400 hover:border-[#2D1FB1] hover:text-[#2D1FB1] transition">
                            + Add Lesson
                          </button>
                        </div>
                      )}
                    </div>
                  ))}
                  <button onClick={() => setShowAddModule(cert.id)}
                    className="w-full py-2 border-2 border-dashed border-gray-200 rounded-lg text-xs text-gray-400 hover:border-[#2D1FB1] hover:text-[#2D1FB1] transition mt-1">
                    + Add Module
                  </button>
                </div>
              )}
            </div>
          ))}
        </div>
      </div>
    );

  function LessonEditorModal({ lesson, moduleId, onSave, onClose, saving }) {
    const [title, setTitle] = useState(lesson?.title || '');
    const [status, setStatus] = useState(lesson?.status || 'draft');
    const [readTime, setReadTime] = useState(lesson?.read_time_minutes || 8);
    const [blocks, setBlocks] = useState(lesson?.blocks?.length ? lesson.blocks : lesson?.content ? markdownToBlocks(lesson.content) : []);
    const [showAddMenu, setShowAddMenu] = useState(false);
    const [jsonMode, setJsonMode] = useState(false);
    const [jsonText, setJsonText] = useState(JSON.stringify(blocks, null, 2));
    const [jsonError, setJsonError] = useState('');

    const addBlock = (type) => {
      setBlocks(b => [...b, { ...BLOCK_DEFAULTS[type] }]);
      setShowAddMenu(false);
    };

    const updateBlock = (idx, update) => {
      setBlocks(b => b.map((bl, i) => i === idx ? { ...bl, ...update } : bl));
    };

    const deleteBlock = (idx) => {
      setBlocks(b => b.filter((_,i) => i !== idx));
    };

    const moveBlock = (idx, dir) => {
      const b = [...blocks];
      const to = idx + dir;
      if (to < 0 || to >= b.length) return;
      [b[idx], b[to]] = [b[to], b[idx]];
      setBlocks(b);
    };

    const handleSave = () => {
      let finalBlocks = blocks;
      if (jsonMode) {
        try { finalBlocks = JSON.parse(jsonText); setJsonError(''); }
        catch(e) { setJsonError('Invalid JSON: ' + e.message); return; }
      }
      onSave({
        id: lesson?.id,
        module_id: lesson?.module_id || moduleId,
        title, status,
        read_time_minutes: parseInt(readTime)||8,
        blocks: finalBlocks,
        content: lesson?.content || '',
        slug: lesson?.slug || title.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,80),
        sort_order: lesson?.sort_order || 99,
      });
    };

    return (
      <div className="fixed inset-0 z-50 bg-black/60 flex items-start justify-center p-4 overflow-y-auto">
        <div className="bg-white rounded-2xl w-full max-w-4xl my-8 shadow-2xl">
          <div className="flex items-center justify-between px-6 py-4 border-b border-gray-100">
            <h3 className="font-bold text-[#0F1631]">{lesson?.id ? 'Edit Lesson' : 'New Lesson'}</h3>
            <div className="flex items-center gap-3">
              <button onClick={() => setJsonMode(j => !j)}
                className={`text-xs px-3 py-1.5 rounded-lg font-medium transition ${jsonMode ? 'bg-[#2D1FB1] text-white' : 'bg-gray-100 text-gray-600'}`}>
                {jsonMode ? 'Visual Editor' : '{ } JSON'}
              </button>
              <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-xl">✕</button>
            </div>
          </div>

          <div className="px-6 py-4">
            {/* Meta fields */}
            <div className="grid grid-cols-3 gap-4 mb-6">
              <div className="col-span-2">
                <label className="block text-xs font-semibold text-gray-500 mb-1">Lesson Title</label>
                <input value={title} onChange={e => setTitle(e.target.value)}
                  className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#2D1FB1]"
                  placeholder="Lesson title" />
              </div>
              <div>
                <label className="block text-xs font-semibold text-gray-500 mb-1">Status</label>
                <select value={status} onChange={e => setStatus(e.target.value)}
                  className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#2D1FB1]">
                  <option value="draft">Draft</option>
                  <option value="review">Ready for Review</option>
                  <option value="approved">Approved</option>
                </select>
              </div>
            </div>

            {jsonMode ? (
              <div>
                <textarea value={jsonText} onChange={e => setJsonText(e.target.value)} rows={20}
                  className="w-full border border-gray-200 rounded-lg px-3 py-2 text-xs font-mono focus:outline-none focus:border-[#2D1FB1]" />
                {jsonError && <p className="text-red-500 text-xs mt-1">{jsonError}</p>}
              </div>
            ) : (
              <div>
                <div className="text-xs font-semibold text-gray-500 mb-3">Content Blocks ({blocks.length})</div>
                <div className="space-y-3 mb-4 max-h-[50vh] overflow-y-auto pr-1">
                  {blocks.map((block, i) => (
                    <AdminBlockEditor key={i} block={block} idx={i}
                      onUpdate={upd => updateBlock(i, upd)}
                      onDelete={() => deleteBlock(i)}
                      onMoveUp={() => moveBlock(i, -1)}
                      onMoveDown={() => moveBlock(i, 1)}
                      isFirst={i===0} isLast={i===blocks.length-1} />
                  ))}
                </div>

                {/* Add block */}
                <div className="relative">
                  <button onClick={() => setShowAddMenu(m => !m)}
                    className="w-full py-2.5 border-2 border-dashed border-gray-200 rounded-xl text-sm text-gray-400 hover:border-[#2D1FB1] hover:text-[#2D1FB1] transition flex items-center justify-center gap-2">
                    + Add Block
                  </button>
                  {showAddMenu && (
                    <div className="absolute bottom-12 left-0 right-0 bg-white border border-gray-200 rounded-xl shadow-xl p-3 z-10">
                      <div className="grid grid-cols-4 gap-2">
                        {BLOCK_TYPES.map(bt => (
                          <button key={bt.type} onClick={() => addBlock(bt.type)}
                            className="flex flex-col items-center gap-1 p-2 rounded-lg hover:bg-gray-50 transition text-center">
                            <span className="w-3 h-3 rounded-full" style={{ background: bt.color }} />
                            <span className="text-xs text-gray-600 leading-tight">{bt.label}</span>
                          </button>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>

          <div className="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-100">
            <button onClick={onClose} className="px-4 py-2 border border-gray-200 text-gray-500 text-sm rounded-lg hover:bg-gray-50">Cancel</button>
            <button onClick={handleSave} disabled={saving || !title}
              className="px-6 py-2 bg-[#2D1FB1] text-white text-sm font-bold rounded-lg hover:bg-indigo-700 disabled:opacity-50 transition">
              {saving ? 'Saving…' : 'Save Lesson'}
            </button>
          </div>
        </div>
      </div>
    );
  }

  function AdminBlockEditor({ block, idx, onUpdate, onDelete, onMoveUp, onMoveDown, isFirst, isLast }) {
    const bt = BLOCK_TYPES.find(t => t.type === block.type);
    const [collapsed, setCollapsed] = useState(false);

    return (
      <div className="border border-gray-200 rounded-xl overflow-hidden">
        <div className="flex items-center gap-2 px-3 py-2 bg-gray-50">
          <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ background: bt?.color || '#9ca3af' }} />
          <span className="text-xs font-medium text-gray-600 flex-1">{bt?.label || block.type}</span>
          <div className="flex items-center gap-1">
            <button onClick={() => setCollapsed(c => !c)} className="text-xs text-gray-400 px-2">{collapsed ? '▼' : '▲'}</button>
            <button onClick={onMoveUp} disabled={isFirst} className="text-gray-300 hover:text-gray-600 disabled:opacity-20 px-1 text-xs">↑</button>
            <button onClick={onMoveDown} disabled={isLast} className="text-gray-300 hover:text-gray-600 disabled:opacity-20 px-1 text-xs">↓</button>
            <button onClick={onDelete} className="text-red-300 hover:text-red-500 px-1 text-xs">✕</button>
          </div>
        </div>
        {!collapsed && (
          <div className="p-3">
            <BlockFieldEditor block={block} onUpdate={onUpdate} />
          </div>
        )}
      </div>
    );
  }

  function BlockFieldEditor({ block, onUpdate }) {
    const ta = (field, placeholder, rows=3) => (
      <textarea value={block[field]||''} onChange={e => onUpdate({ [field]: e.target.value })} rows={rows}
        placeholder={placeholder}
        className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#2D1FB1] resize-y" />
    );
    const inp = (field, placeholder) => (
      <input value={block[field]||''} onChange={e => onUpdate({ [field]: e.target.value })}
        placeholder={placeholder}
        className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#2D1FB1]" />
    );

    switch (block.type) {
      case 'paragraph': return ta('text', 'Paragraph text… (HTML allowed)', 4);
      case 'heading': return inp('text', 'Heading text');
      case 'subheading': return inp('text', 'Subheading text');
      case 'list': case 'numbered':
        return (
          <div className="space-y-2">
            {(block.items||['']).map((item,i) => (
              <div key={i} className="flex gap-2">
                <input value={item} onChange={e => { const it=[...block.items]; it[i]=e.target.value; onUpdate({items:it}); }}
                  placeholder={`Item ${i+1}`}
                  className="flex-1 border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-[#2D1FB1]" />
                <button onClick={() => { const it=block.items.filter((_,j)=>j!==i); onUpdate({items:it.length?it:['']}); }}
                  className="text-red-300 hover:text-red-500 px-2 text-xs">✕</button>
              </div>
            ))}
            <button onClick={() => onUpdate({ items:[...(block.items||['']), ''] })}
              className="text-xs text-[#2D1FB1] hover:underline">+ Add item</button>
          </div>
        );
      case 'callout':
        return (
          <div className="space-y-2">
            <div className="flex gap-2">
              <select value={block.kind||'key'} onChange={e => onUpdate({kind:e.target.value})}
                className="border border-gray-200 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:border-[#2D1FB1]">
                <option value="key">Key Concept</option>
                <option value="warn">Important</option>
                <option value="do">Checklist</option>
                <option value="note">Note</option>
              </select>
              {inp('title','Title (optional)')}
            </div>
            {ta('text','Callout content (HTML allowed)', 3)}
          </div>
        );
      case 'glossary':
        return (
          <div className="space-y-2">
            {(block.terms||[]).map((t,i) => (
              <div key={i} className="flex gap-2">
                <input value={t.term} onChange={e => { const ts=[...block.terms]; ts[i]={...ts[i],term:e.target.value}; onUpdate({terms:ts}); }}
                  placeholder="Term"
                  className="w-1/3 border border-gray-200 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:border-[#2D1FB1]" />
                <input value={t.definition} onChange={e => { const ts=[...block.terms]; ts[i]={...ts[i],definition:e.target.value}; onUpdate({terms:ts}); }}
                  placeholder="Definition"
                  className="flex-1 border border-gray-200 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:border-[#2D1FB1]" />
                <button onClick={() => { const ts=block.terms.filter((_,j)=>j!==i); onUpdate({terms:ts.length?ts:[{term:'',definition:''}]}); }}
                  className="text-red-300 hover:text-red-500 text-xs px-1">✕</button>
              </div>
            ))}
            <button onClick={() => onUpdate({terms:[...(block.terms||[]),{term:'',definition:''}]})}
              className="text-xs text-[#2D1FB1] hover:underline">+ Add term</button>
          </div>
        );
      case 'activity':
        return (
          <div className="space-y-2">
            {inp('title','Activity title')}
            {ta('prompt','Prompt / instructions (HTML allowed)', 3)}
            <div className="text-xs text-gray-500 mb-1">Steps:</div>
            {(block.steps||['']).map((s,i) => (
              <div key={i} className="flex gap-2">
                <input value={s} onChange={e => { const st=[...block.steps]; st[i]=e.target.value; onUpdate({steps:st}); }}
                  placeholder={`Step ${i+1}`}
                  className="flex-1 border border-gray-200 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:border-[#2D1FB1]" />
                <button onClick={() => { const st=block.steps.filter((_,j)=>j!==i); onUpdate({steps:st.length?st:['']}); }}
                  className="text-red-300 hover:text-red-500 text-xs px-1">✕</button>
              </div>
            ))}
            <button onClick={() => onUpdate({steps:[...(block.steps||['']),'']})}
              className="text-xs text-[#2D1FB1] hover:underline">+ Add step</button>
          </div>
        );
      case 'case_study':
        return (
          <div className="space-y-2">
            {inp('title','Case study title')}
            {ta('scenario','Scenario / context (HTML allowed)', 3)}
            {ta('discussion','Discussion / analysis (HTML allowed)', 3)}
          </div>
        );
      case 'video': case 'image':
        return (
          <div className="space-y-2">
            {inp('url', block.type==='video' ? 'Video embed URL (YouTube embed, Vimeo, etc.)' : 'Image URL')}
            {block.type==='video' && inp('title','Video title (optional)')}
            {inp('caption','Caption (optional)')}
          </div>
        );
      case 'divider':
        return <div className="text-xs text-gray-400 italic text-center py-2">— Section divider —</div>;
      default:
        return <div className="text-xs text-gray-400">No editor for block type: {block.type}</div>;
    }
  }

  // ─── Admin Analytics ──────────────────────────────────────────────────────
  function AdminAnalytics({ students, certs }) {
    const [completions, setCompletions] = useState([]);
    const [attempts, setAttempts] = useState([]);
    const [loading, setLoading] = useState(true);

    useEffect(() => {
      (async () => {
        const sb = await getSupabase();
        if (!sb) { setLoading(false); return; }
        const [{ data: c }, { data: a }] = await Promise.all([
          sb.from('certification_completions').select('*, profiles(full_name,email), certifications(title,cert_number)').order('completed_at', { ascending: false }),
          sb.from('quiz_attempts').select('*, profiles(full_name), certifications(title,cert_number)').order('created_at', { ascending: false }).limit(100),
        ]);
        setCompletions(c || []);
        setAttempts(a || []);
        setLoading(false);
      })();
    }, []);

    if (loading) return <div className="text-center py-20 text-gray-400">Loading analytics…</div>;

    const passRate = attempts.length ? Math.round((attempts.filter(a=>a.passed).length / attempts.length) * 100) : 0;
    const avgScore = attempts.filter(a=>a.score).length ? Math.round(attempts.filter(a=>a.score).reduce((s,a)=>s+a.score,0) / attempts.filter(a=>a.score).length) : 0;

    return (
      <div>
        <h2 className="text-xl font-bold text-[#0F1631] mb-6">Analytics</h2>

        {/* KPI cards */}
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
          {[
            { label:'Total Students', value: students.length, color:'text-[#2D1FB1]' },
            { label:'Completions', value: completions.length, color:'text-green-600' },
            { label:'Quiz Pass Rate', value: `${passRate}%`, color:'text-[#F97316]' },
            { label:'Avg Quiz Score', value: `${avgScore}%`, color:'text-purple-600' },
          ].map(kpi => (
            <div key={kpi.label} className="bg-white border border-gray-200 rounded-xl p-5 text-center">
              <div className={`text-3xl font-black mb-1 ${kpi.color}`}>{kpi.value}</div>
              <div className="text-xs text-gray-500">{kpi.label}</div>
            </div>
          ))}
        </div>

        {/* Recent completions */}
        <div className="bg-white border border-gray-200 rounded-xl p-5 mb-6">
          <div className="font-semibold text-[#0F1631] mb-4 text-sm">Recent Completions</div>
          <div className="space-y-2">
            {completions.slice(0,10).map(c => (
              <div key={c.id} className="flex items-center gap-3 py-2 border-b border-gray-50 last:border-0">
                <div className="w-7 h-7 rounded-full bg-green-100 text-green-600 flex items-center justify-center text-xs flex-shrink-0">✓</div>
                <div className="flex-1 min-w-0">
                  <div className="text-sm font-medium text-[#0F1631] truncate">{c.profiles?.full_name || c.profiles?.email}</div>
                  <div className="text-xs text-gray-400">Cert {c.certifications?.cert_number}: {c.certifications?.title?.slice(0,40)}</div>
                </div>
                <div className="text-xs text-gray-400 flex-shrink-0">{c.score}%</div>
                <div className="text-xs text-gray-400 flex-shrink-0">{new Date(c.completed_at).toLocaleDateString()}</div>
              </div>
            ))}
            {completions.length === 0 && <div className="text-sm text-gray-400 text-center py-4">No completions yet</div>}
          </div>
        </div>

        {/* Quiz attempts */}
        <div className="bg-white border border-gray-200 rounded-xl p-5">
          <div className="font-semibold text-[#0F1631] mb-4 text-sm">Recent Quiz Attempts</div>
          <div className="space-y-2">
            {attempts.slice(0,10).map(a => (
              <div key={a.id} className="flex items-center gap-3 py-2 border-b border-gray-50 last:border-0">
                <div className={`w-7 h-7 rounded-full flex items-center justify-center text-xs flex-shrink-0 ${a.passed ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-500'}`}>{a.passed ? '✓' : '✗'}</div>
                <div className="flex-1 min-w-0">
                  <div className="text-sm font-medium text-[#0F1631] truncate">{a.profiles?.full_name}</div>
                  <div className="text-xs text-gray-400">Cert {a.certifications?.cert_number}</div>
                </div>
                <div className={`text-sm font-bold ${a.passed ? 'text-green-600' : 'text-red-500'}`}>{a.score}%</div>
                <div className="text-xs text-gray-400 flex-shrink-0">{new Date(a.created_at||a.started_at).toLocaleDateString()}</div>
              </div>
            ))}
            {attempts.length === 0 && <div className="text-sm text-gray-400 text-center py-4">No quiz attempts yet</div>}
          </div>
        </div>
      </div>
    );
  }

  // ─── Admin Team ───────────────────────────────────────────────────────────
  function AdminTeam({ students, setStudents }) {
    const [updatingRole, setUpdatingRole] = useState({});

    const updateRole = async (userId, role) => {
      setUpdatingRole(r => ({ ...r, [userId]: true }));
      const sb = await getSupabase();
      if (sb) {
        await sb.from('profiles').update({ role }).eq('id', userId);

  }

  // ─── Application Workspace ───────────────────────────────────────────────
  const PROGRAM_LABELS = {
    rmap:         'USDA RMAP — Rural Microentrepreneur Assistance',
    rbdg:         'USDA RBDG — Rural Business Development Grant',
    irp:          'IRP — Intermediary Relending Program',
    rlf_ops:      'RLF Operational Readiness Review',
    full_binder:  'Full Application Binder Gap Analysis',
    eda_rlf:      'EDA Revolving Loan Fund Readiness',
    cdfi:         'CDFI Certification Readiness',
    sba_micro:    'SBA Microloan Intermediary Readiness',
    ssbci:        'SSBCI Lender Readiness',
    usda_onerd:   'USDA OneRD Guaranteed Lending Readiness',
    tribal:       'Tribal Capital Access Readiness',
    general:      'General Capital Access Platform Readiness',
  };

  const READINESS_COLORS = {
    not_ready:        { bg: 'bg-red-50',    text: 'text-red-700',    border: 'border-red-200',    label: 'Not Ready' },
    emerging:         { bg: 'bg-orange-50', text: 'text-orange-700', border: 'border-orange-200', label: 'Emerging' },
    competitive:      { bg: 'bg-yellow-50', text: 'text-yellow-700', border: 'border-yellow-200', label: 'Competitive' },
    strong:           { bg: 'bg-blue-50',   text: 'text-blue-700',   border: 'border-blue-200',   label: 'Strong' },
    submission_ready: { bg: 'bg-green-50',  text: 'text-green-700',  border: 'border-green-200',  label: 'Submission Ready' },
  };

  function ApplicationWorkspace({ user, profile, onBack }) {
    const [step, setStep] = useState('list'); // list | create | workspace | scoring | results
    const [workspaces, setWorkspaces] = useState([]);
    const [activeWS, setActiveWS]     = useState(null);
    const [criteria, setCriteria]     = useState([]);
    const [answers, setAnswers]       = useState({});
    const [evidence, setEvidence]     = useState([]);
    const [scoringResult, setScoringResult] = useState(null);
    const [priorResults, setPriorResults]   = useState([]);
    const [loading, setLoading]   = useState(true);
    const [scoring, setScoring]   = useState(false);
    const [scoreError, setScoreError] = useState('');
    const [context, setContext]   = useState('');
    const [uploading, setUploading] = useState(false);
    const [newWS, setNewWS] = useState({ program_type: 'rmap', title: '', applicant_name: '', fiscal_year: new Date().getFullYear() });

    useEffect(() => {
      loadWorkspaces();
    }, []);

    const loadWorkspaces = async () => {
      setLoading(true);
      const sb = await getSupabase();
      if (!sb) { setLoading(false); return; }
      const { data } = await sb.from('application_workspaces').select('*').order('updated_at', { ascending: false });
      setWorkspaces(data || []);
      setLoading(false);
    };

    const createWorkspace = async () => {
      if (!newWS.title.trim()) return;
      const sb = await getSupabase();
      if (!sb) return;
      const { data } = await sb.from('application_workspaces').insert({
        user_id: user.id, ...newWS, title: newWS.title.trim()
      }).select().single();
      if (data) { await openWorkspace(data); }
    };

    const openWorkspace = async (ws) => {
      setActiveWS(ws);
      setLoading(true);
      const sb = await getSupabase();
      if (!sb) { setLoading(false); return; }
      const [{ data: rubric }, { data: ans }, { data: ev }, { data: results }] = await Promise.all([
        sb.from('scoring_rubrics').select('id').eq('program_type', ws.program_type).eq('is_active', true).order('version', { ascending: false }).limit(1).maybeSingle(),
        sb.from('application_answers').select('*').eq('workspace_id', ws.id),
        sb.from('evidence_files').select('*').eq('workspace_id', ws.id),
        sb.from('scoring_results').select('*, scoring_runs(started_at, model_used)').eq('workspace_id', ws.id).order('created_at', { ascending: false }).limit(5)
      ]);
      if (rubric) {
        const { data: crit } = await sb.from('scoring_criteria').select('*').eq('rubric_id', rubric.id).order('sort_order');
        setCriteria(crit || []);
      }
      const amap = {}; (ans || []).forEach(a => { amap[a.criterion_id] = a.answer_text || ''; });
      setAnswers(amap);
      setEvidence(ev || []);
      setPriorResults(results || []);
      setScoringResult(results?.[0] || null);
      setLoading(false);
      setStep('workspace');
    };

    const saveAnswer = async (criterionId, text) => {
      setAnswers(a => ({ ...a, [criterionId]: text }));
      const sb = await getSupabase();
      if (!sb) return;
      await sb.from('application_answers').upsert({
        workspace_id: activeWS.id, criterion_id: criterionId, answer_text: text, updated_at: new Date().toISOString()
      }, { onConflict: 'workspace_id,criterion_id' });
    };

    const uploadEvidence = async (file, criterionId) => {
      setUploading(true);
      const sb = await getSupabase();
      if (!sb) { setUploading(false); return; }
      try {
        const { data: { session } } = await sb.auth.getSession();
        const res = await fetch('/.netlify/functions/sign-upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
          body: JSON.stringify({ workspace_id: activeWS.id, file_name: file.name, mime_type: file.type, file_size: file.size })
        });
        const { signed_url, path } = await res.json();
        await fetch(signed_url, { method: 'PUT', body: file, headers: { 'Content-Type': file.type } });
        const { data: ef } = await sb.from('evidence_files').insert({
          workspace_id: activeWS.id, user_id: user.id, file_name: file.name,
          file_path: path, file_size: file.size, mime_type: file.type,
          label: file.name, criterion_id: criterionId || null
        }).select().single();
        if (ef) setEvidence(prev => [...prev, ef]);
      } catch (e) { alert('Upload failed: ' + e.message); }
      setUploading(false);
    };

    const runScoring = async () => {
      setScoring(true); setScoreError('');
      const sb = await getSupabase();
      if (!sb) { setScoring(false); return; }
      try {
        const { data: { session } } = await sb.auth.getSession();
        const res = await fetch('/.netlify/functions/ai-scoring', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
          body: JSON.stringify({ workspace_id: activeWS.id, context })
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
        setScoringResult({ ...json.result, created_at: new Date().toISOString() });
        setPriorResults(prev => [{ ...json.result, created_at: new Date().toISOString() }, ...prev]);
        setStep('results');
      } catch (e) { setScoreError(e.message); }
      setScoring(false);
    };

    // Group criteria by section
    const sections = criteria.reduce((acc, c) => {
      if (!acc[c.section_code]) acc[c.section_code] = { label: c.section_label, items: [] };
      acc[c.section_code].items.push(c);
      return acc;
    }, {});

    if (loading && step !== 'list') return <div className="text-center py-20 text-gray-400">Loading workspace…</div>;

    // LIST view
    if (step === 'list') return (
      <main className="max-w-4xl mx-auto px-4 py-10 fade-in">
        <button onClick={onBack} className="text-sm text-gray-500 hover:text-[#2D1FB1] mb-6 flex items-center gap-1">← Dashboard</button>
        <div className="flex items-center justify-between mb-6">
          <div>
            <h1 className="text-3xl font-bold text-[#0F1631] mb-1">AI Scoring Engine</h1>
            <p className="text-gray-500 text-sm">Score your RMAP, RBDG, or IRP application readiness against the exact federal criteria.</p>
          </div>
          <button onClick={() => setStep('create')} className="px-5 py-2.5 bg-[#F97316] text-white font-bold rounded-xl hover:bg-orange-600 transition-colors text-sm">+ New Workspace</button>
        </div>
        <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 mb-6 text-xs text-amber-800 leading-relaxed">
          <strong>Advisory tool only.</strong> AI scoring estimates are based on publicly available federal criteria. Results do not represent USDA's review or determination and do not guarantee funding, eligibility, or approval.
        </div>
        {loading ? <div className="text-center py-12 text-gray-400">Loading…</div> : workspaces.length === 0 ? (
          <div className="bg-white border border-gray-200 rounded-2xl p-12 text-center">
            <div className="text-4xl mb-4">📋</div>
            <div className="font-bold text-[#0F1631] mb-2">No workspaces yet</div>
            <p className="text-gray-500 text-sm mb-5">Create a workspace for each application you're preparing.</p>
            <button onClick={() => setStep('create')} className="px-6 py-2.5 bg-[#2D1FB1] text-white font-bold rounded-xl hover:bg-indigo-700 transition-colors text-sm">Create First Workspace</button>
          </div>
        ) : (
          <div className="space-y-3">
            {workspaces.map(ws => (
              <div key={ws.id} className="bg-white border border-gray-200 rounded-xl p-5 hover:shadow-md transition-shadow cursor-pointer flex items-center gap-4" onClick={() => openWorkspace(ws)}>
                <div className="w-10 h-10 rounded-lg bg-[#2D1FB1] text-white flex items-center justify-center text-xs font-black flex-shrink-0">{ws.program_type.toUpperCase().slice(0,4)}</div>
                <div className="flex-1">
                  <div className="font-bold text-[#0F1631]">{ws.title}</div>
                  <div className="text-xs text-gray-400 mt-0.5">{PROGRAM_LABELS[ws.program_type]} · FY {ws.fiscal_year}</div>
                </div>
                <span className="text-[#2D1FB1] text-sm font-semibold">Open →</span>
              </div>
            ))}
          </div>
        )}
      </main>
    );

    // CREATE view
    if (step === 'create') return (
      <main className="max-w-2xl mx-auto px-4 py-10 fade-in">
        <button onClick={() => setStep('list')} className="text-sm text-gray-500 hover:text-[#2D1FB1] mb-6 flex items-center gap-1">← Back</button>
        <h2 className="text-2xl font-bold text-[#0F1631] mb-6">New Application Workspace</h2>
        <div className="bg-white border border-gray-200 rounded-2xl p-6 space-y-4">
          <div>
            <label className="block text-xs font-semibold text-gray-600 mb-1">Program Type</label>
            <select value={newWS.program_type} onChange={e => setNewWS(w => ({ ...w, program_type: e.target.value }))}
              className="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#2D1FB1]">
              {Object.entries(PROGRAM_LABELS).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
            </select>
          </div>
          <div>
            <label className="block text-xs font-semibold text-gray-600 mb-1">Workspace Title</label>
            <input value={newWS.title} onChange={e => setNewWS(w => ({ ...w, title: e.target.value }))}
              className="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#2D1FB1]"
              placeholder="e.g. Our Organization RMAP 2026 Application" />
          </div>
          <div>
            <label className="block text-xs font-semibold text-gray-600 mb-1">Applicant Organization Name</label>
            <input value={newWS.applicant_name} onChange={e => setNewWS(w => ({ ...w, applicant_name: e.target.value }))}
              className="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#2D1FB1]"
              placeholder="Legal name of your organization" />
          </div>
          <div>
            <label className="block text-xs font-semibold text-gray-600 mb-1">Federal Fiscal Year</label>
            <input type="number" value={newWS.fiscal_year} onChange={e => setNewWS(w => ({ ...w, fiscal_year: parseInt(e.target.value) }))}
              className="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#2D1FB1]" />
          </div>
          <div className="flex gap-3 pt-2">
            <button onClick={() => setStep('list')} className="flex-1 py-2.5 border border-gray-200 text-gray-600 rounded-xl text-sm hover:bg-gray-50 transition-colors">Cancel</button>
            <button onClick={createWorkspace} disabled={!newWS.title.trim()}
              className="flex-1 py-2.5 bg-[#2D1FB1] text-white font-bold rounded-xl text-sm hover:bg-indigo-700 disabled:opacity-40 transition-colors">Create Workspace</button>
          </div>
        </div>
      </main>
    );

    // WORKSPACE view
    if (step === 'workspace' || step === 'scoring') return (
      <main className="max-w-5xl mx-auto px-4 py-10 fade-in">
        <button onClick={() => { setStep('list'); setActiveWS(null); }} className="text-sm text-gray-500 hover:text-[#2D1FB1] mb-4 flex items-center gap-1">← All Workspaces</button>
        <div className="flex items-start justify-between gap-4 mb-6">
          <div>
            <h1 className="text-2xl font-bold text-[#0F1631]">{activeWS?.title}</h1>
            <p className="text-sm text-gray-500">{PROGRAM_LABELS[activeWS?.program_type]} · FY {activeWS?.fiscal_year}</p>
          </div>
          <div className="flex gap-2">
            {scoringResult && <button onClick={() => setStep('results')} className="px-4 py-2 border border-[#2D1FB1] text-[#2D1FB1] text-sm font-semibold rounded-lg hover:bg-blue-50 transition-colors">View Last Score</button>}
            <button onClick={runScoring} disabled={scoring}
              className="px-5 py-2 bg-[#F97316] text-white text-sm font-bold rounded-lg hover:bg-orange-600 disabled:opacity-50 transition-colors flex items-center gap-2">
              {scoring ? '⏳ Scoring…' : '🤖 Run AI Score'}
            </button>
          </div>
        </div>
        {scoreError && <div className="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700">{scoreError}</div>}
        <div className="mb-4 bg-amber-50 border border-amber-100 rounded-xl p-3 text-xs text-amber-700">
          Answer each question as completely as possible. Upload supporting documents below each section. Then click "Run AI Score."
        </div>

        {/* Evidence upload (global) */}
        <div className="bg-white border border-gray-200 rounded-xl p-5 mb-6">
          <div className="font-semibold text-[#0F1631] mb-3 text-sm">📎 Evidence Files ({evidence.length} uploaded)</div>
          <label className="flex items-center gap-2 cursor-pointer text-sm text-[#2D1FB1] font-semibold hover:underline">
            {uploading ? '⏳ Uploading…' : '+ Upload document'}
            <input type="file" className="sr-only" disabled={uploading} accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.txt,.csv"

          )}

        {/* Criteria by section */}
        {Object.entries(sections).map(([sectionCode, section]) => (
          <div key={sectionCode} className="mb-6">

          <div className={`rounded-2xl p-8 mb-6 text-center border ${rl.bg} ${rl.border}`}>

          {/* Section scores */}

            <div className="bg-white border border-gray-200 rounded-xl p-5 mb-5">
              <div className="font-bold text-[#0F1631] mb-3">Section Scores</div>
              <div className="space-y-3">
                {Object.entries(r.section_scores).map(([code, s]) => (
                  <div key={code}>
                    <div className="flex justify-between text-sm mb-1">
                      <span className="font-medium text-gray-700">{s.label || code}</span>

          {r.missing_evidence?.length > 0 && (

          {r.risk_flags?.length > 0 && (
            <div className="bg-amber-50 border border-amber-200 rounded-xl p-5 mb-5">
              <div className="font-bold text-amber-800 mb-2">🚩 Risk Flags</div>

                    <span className="text-gray-600">{new Date(pr.created_at).toLocaleDateString()}</span>

  // ─── RLF Readiness Quiz Funnel ───────────────────────────────────────────
  const RESULT_CONFIG = {

      description: 'Your organization is in the early stages of building the capacity needed for USDA rural capital programs. The right training can accelerate your readiness significantly.',

    developing: { label: 'Developing Capacity', color: '#FFD23F', bg: 'bg-yellow-50', border: 'border-yellow-200', pctRange: '35–59%',
