  // ─── Supabase client (lazy-initialized) ───────────────────────────────────
  let _supabase = null;
  async function getSupabase() {
    if (_supabase) return _supabase;
    const url = window.ENV?.SUPABASE_URL;
    const key = window.ENV?.SUPABASE_ANON_KEY;
    if (!url || url === 'YOUR_SUPABASE_URL' || !key || key === 'YOUR_SUPABASE_ANON_KEY') {
      return null;
    }
    try {
      const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2.58.0');
      _supabase = createClient(url, key);
      return _supabase;
    } catch {
      return null;
    }
  }

  // ─── Lead Capture Form ────────────────────────────────────────────────────
  function LeadCaptureForm() {
    const [form, setForm] = useState({ name: '', email: '', organization: '' });
    const [status, setStatus] = useState('idle'); // idle | loading | success | error

    const handleChange = e => setForm(f => ({ ...f, [e.target.name]: e.target.value }));

    const handleSubmit = async e => {
      e.preventDefault();
      setStatus('loading');
      try {
        const sb = await getSupabase();
        if (sb) {
          const { error } = await sb.from('leads').insert([{
            name: form.name,
            email: form.email,
            organization: form.organization,
            source: 'checklist',
          }]);
          if (error) {
            // Silent — still show success to user
          }
        }
        setStatus('success');
        setForm({ name: '', email: '', organization: '' });
      } catch {
        setStatus('success'); // Show success regardless of backend state
      }
    };

    if (status === 'success') {
      return (
        <div className="text-center py-8 fade-in">
          <div className="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg className="w-8 h-8 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7"/>
            </svg>
          </div>
          <h3 className="text-xl font-bold text-[#0F1631] mb-2">You're on the list!</h3>
          <p className="text-gray-600 text-sm">Check your inbox at <strong>{form.email || 'your email'}</strong> for the RMAP Evidence Checklist.</p>
        </div>
      );
    }

    return (
      <form onSubmit={handleSubmit} className="space-y-4" noValidate>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label htmlFor="lead-name" className="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
            <input
              id="lead-name"
              name="name"
              type="text"
              required
              value={form.name}
              onChange={handleChange}
              placeholder="Jane Smith"
              className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#2D1FB1] focus:border-transparent"
            />
          </div>
          <div>
            <label htmlFor="lead-email" className="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
            <input
              id="lead-email"
              name="email"
              type="email"
              required
              value={form.email}
              onChange={handleChange}
              placeholder="jane@yourorg.org"
              className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#2D1FB1] focus:border-transparent"
            />
          </div>
        </div>
        <div>
          <label htmlFor="lead-org" className="block text-sm font-medium text-gray-700 mb-1">Organization</label>
          <input
            id="lead-org"
            name="organization"
            type="text"
            value={form.organization}
            onChange={handleChange}
            placeholder="Rural Development Org, County Office, CDFI, etc."
            className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#2D1FB1] focus:border-transparent"
          />
        </div>
        <button
          type="submit"
          disabled={status === 'loading'}
          className="w-full sm:w-auto px-8 py-3 bg-[#F97316] text-white font-semibold rounded-lg hover:bg-orange-600 transition-colors disabled:opacity-60 focus:outline-none focus-visible:ring-2 focus-visible:ring-[#F97316]"
        >
          {status === 'loading' ? 'Sending…' : 'Get Free Checklist'}
        </button>
      </form>
    );
  }

  // ─── Login Modal ──────────────────────────────────────────────────────────
  function LoginModal({ open, onClose, onLoginSuccess }) {
    const [form, setForm] = useState({ email: '', password: '' });
    const [error, setError] = useState('');
    const [loading, setLoading] = useState(false);

    const handleChange = e => setForm(f => ({ ...f, [e.target.name]: e.target.value }));

    const handleSubmit = async e => {
      e.preventDefault();
      setError('');
      setLoading(true);
      try {
        const sb = await getSupabase();
        if (!sb) {
          setError('Authentication is not configured yet. Please check back later.');
          setLoading(false);
          return;
        }
        const { data, error: authError } = await sb.auth.signInWithPassword({
          email: form.email,
          password: form.password,
        });
        if (authError) {
          setError(authError.message);
          setLoading(false);
          return;
        }
        onLoginSuccess(data.user);
        onClose();
      } catch {
        setError('An unexpected error occurred. Please try again.');
        setLoading(false);
      }
    };

    if (!open) return null;

    return (
      <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 px-4" role="dialog" aria-modal="true" aria-label="Login">
        <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 fade-in">
          <div className="flex items-center justify-between mb-6">
            <Logo size="sm" />
            <button onClick={onClose} className="text-gray-400 hover:text-gray-600 focus:outline-none" aria-label="Close login">

                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12"/>
              </svg>
            </button>
          </div>
          <h2 className="text-2xl font-bold text-[#0F1631] mb-2">Sign in</h2>
          <p className="text-sm text-gray-500 mb-6">Access your Cap Fund Academy dashboard.</p>
          <form onSubmit={handleSubmit} className="space-y-4" noValidate>
            <div>
              <label htmlFor="login-email" className="block text-sm font-medium text-gray-700 mb-1">Email</label>
              <input
                id="login-email"
                name="email"
                type="email"
                required
                autoComplete="email"
                value={form.email}
                onChange={handleChange}
                className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#2D1FB1]"
              />
            </div>
            <div>
              <label htmlFor="login-password" className="block text-sm font-medium text-gray-700 mb-1">Password</label>
              <input
                id="login-password"
                name="password"
                type="password"
                required
                autoComplete="current-password"
                value={form.password}
                onChange={handleChange}
                className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#2D1FB1]"
              />
            </div>
            {error && (
              <div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-3 py-2">{error}</div>
            )}
            <button
              type="submit"
              disabled={loading}
              className="w-full py-3 bg-[#F97316] text-white font-semibold rounded-lg hover:bg-orange-600 transition-colors disabled:opacity-60"
            >
              {loading ? 'Signing in…' : 'Sign In'}

  // ─── Root App ─────────────────────────────────────────────────────────────
  function App() {
    const [loading, setLoading] = useState(true);
    const [view, setView] = useState('home'); // 'home' | 'trust' | 'app'
    const [loginOpen, setLoginOpen] = useState(false);
    const [user, setUser] = useState(null);

    useEffect(() => {
      // Initialize auth state
      (async () => {
        try {
          const sb = await getSupabase();
          if (sb) {
            const { data: { session } } = await sb.auth.getSession();
            if (session?.user) {
              setUser(session.user);
              setView('app');
            }
            sb.auth.onAuthStateChange((_event, session) => {
              if (session?.user) {
                setUser(session.user);
                setView('app');
              } else {
                setUser(null);
                if (view === 'app') setView('home');
              }
            });
          }
        } catch {
          // Supabase not configured — continue as public
        } finally {
          setLoading(false);
        }
      })();
    }, []);

    const handleSignOut = async () => {
      try {
        const sb = await getSupabase();
        if (sb) await sb.auth.signOut();
      } catch {}
      setUser(null);
      setView('home');
    };

    const handleLoginSuccess = (u) => {
      setUser(u);
      setView('app');
    };

    if (loading) return <LoadingScreen />;

    return (
      <div className="min-h-screen flex flex-col">
        {view !== 'app' && (
          <Header view={view} setView={setView} onLoginClick={() => setLoginOpen(true)} />
        )}

        {view === 'home' && <Homepage setView={setView} />}
        {view === 'trust' && <TrustCenter setView={setView} />}
        {view === 'app' && user && <Dashboard user={user} onSignOut={handleSignOut} />}

        {view !== 'app' && <Footer setView={setView} />}

        <LoginModal
          open={loginOpen}
          onClose={() => setLoginOpen(false)}
          onLoginSuccess={handleLoginSuccess}
        />
      </div>
    );
  }

  // ─── Mount ────────────────────────────────────────────────────────────────
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
