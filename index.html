      a.href = url; a.download = `capfund-content-${new Date().toISOString().slice(0,10)}.csv`; a.click();
      URL.revokeObjectURL(url);
      setCsvExporting(false);
    };

    const STATUS_COLORS = {
      draft: 'bg-gray-100 text-gray-600', review: 'bg-amber-50 text-amber-700',
      approved: 'bg-green-50 text-green-700', rejected: 'bg-red-50 text-red-600',
      published: 'bg-blue-50 text-blue-700'
    };
    const PLATFORM_ICON = Object.fromEntries(PLATFORMS.map(p => [p.id, p.icon]));
    const reviewPosts = posts.filter(p => p.status === 'review');

    return (
      <div className="fade-in">
        <div className="flex items-center gap-1 border-b border-gray-200 mb-6">
          {[['generate','✨ Generate'],['queue','Approval Queue'],['calendar','Content Calendar'],['settings','Settings']].map(([id,label]) => (
            <button key={id} onClick={() => setTab(id)}
              className={`px-4 py-2.5 text-sm font-semibold border-b-2 transition-colors whitespace-nowrap ${tab===id ? 'border-[#2D1FB1] text-[#2D1FB1]' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>
              {label}
              {id === 'queue' && reviewPosts.length > 0 && <span className="ml-1.5 bg-amber-100 text-amber-700 text-xs px-1.5 py-0.5 rounded-full">{reviewPosts.length}</span>}
            </button>
          ))}
        </div>

        {/* GENERATE tab */}
        {tab === 'generate' && (
          <div className="grid md:grid-cols-2 gap-6">
            <div className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-gray-600 mb-2">Platform</label>
                <div className="grid grid-cols-4 gap-2">
                  {PLATFORMS.map(p => (
                    <button key={p.id} onClick={() => setPlatform(p.id)}
                      className={`py-2 px-1 rounded-xl border text-center transition-all ${platform === p.id ? 'bg-[#2D1FB1] border-[#2D1FB1] text-white' : 'border-gray-200 hover:border-[#2D1FB1] bg-white'}`}>
                      <div className="text-lg">{p.icon}</div>
                      <div className="text-[10px] font-semibold mt-0.5">{p.label}</div>
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-gray-600 mb-2">Topic / Angle</label>
                <textarea value={topic} onChange={e => setTopic(e.target.value)} rows={3}
                  className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#2D1FB1] resize-none"
                  placeholder="What should this content be about?" />
                <div className="mt-2">
                  <div className="text-xs text-gray-400 mb-1">Suggestions:</div>
                  <div className="flex flex-wrap gap-1">
                    {TOPIC_SUGGESTIONS.slice(0,4).map((s, i) => (
                      <button key={i} onClick={() => setTopic(s)} className="text-xs px-2.5 py-1 bg-gray-100 text-gray-600 rounded-full hover:bg-blue-50 hover:text-[#2D1FB1] transition-colors text-left">{s.slice(0,45)}…</button>
                    ))}
                  </div>
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-gray-600 mb-2">Additional Context (optional)</label>
                <textarea value={context} onChange={e => setContext(e.target.value)} rows={2}
                  className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#2D1FB1] resize-none"
                  placeholder="Specific cert to promote, current offer, seasonal angle…" />
              </div>

              <button onClick={generate} disabled={!topic.trim() || generating}
                className="w-full py-3.5 bg-[#2D1FB1] text-white font-black rounded-xl hover:bg-indigo-700 disabled:opacity-40 transition-colors flex items-center justify-center gap-2">
                {generating ? <>⏳ Generating…</> : <>✨ Generate {PLATFORMS.find(p=>p.id===platform)?.label} Content</>}
              </button>

              {error && <div className="p-3 bg-red-50 border border-red-200 rounded-xl text-sm text-red-700">{error}</div>}
            </div>

            {/* Result panel */}
            <div>
              {result ? (
                <div className="space-y-4">
                  {/* Compliance badge */}
                  <div className={`flex items-center gap-2 px-4 py-2.5 rounded-xl ${result.compliance.passed ? 'bg-green-50 border border-green-200' : 'bg-red-50 border border-red-200'}`}>
                    <span>{result.compliance.passed ? '✅' : '🚫'}</span>
                    <span className={`text-sm font-semibold ${result.compliance.passed ? 'text-green-700' : 'text-red-700'}`}>
                      {result.compliance.passed ? 'Compliance check passed' : `Blocked: ${result.compliance.flags.length} forbidden claim(s)`}
                    </span>
                    {result.status && <span className={`ml-auto text-xs px-2 py-0.5 rounded-full font-semibold ${STATUS_COLORS[result.status] || 'bg-gray-100 text-gray-600'}`}>{result.status}</span>}
                  </div>

                  {result.compliance.flags.length > 0 && (
                    <div className="bg-amber-50 border border-amber-200 rounded-xl p-3">
                      {result.compliance.flags.map((f, i) => (
                        <div key={i} className="text-xs text-amber-700"><span className="font-semibold">"{f.phrase}"</span> — {f.reason}</div>
                      ))}
                    </div>
                  )}

                  <div className="bg-white border border-gray-200 rounded-xl p-5">
                    <div className="flex items-center justify-between mb-3">
                      <div className="flex items-center gap-2">
                        <span>{PLATFORM_ICON[platform]}</span>
                        <span className="font-bold text-sm text-[#0F1631]">{PLATFORMS.find(p=>p.id===platform)?.label}</span>
                      </div>
                      <button onClick={() => navigator.clipboard.writeText(result.content)} className="text-xs text-[#2D1FB1] hover:underline font-semibold">Copy</button>
                    </div>
                    <div className="text-sm text-gray-700 leading-relaxed whitespace-pre-wrap">{result.content}</div>
                  </div>

                  {result.needs_review && (
                    <div className="text-xs text-amber-700 bg-amber-50 border border-amber-100 rounded-lg p-3">
                      📋 Queued for review in the Approval Queue tab.
                    </div>
                  )}
                </div>
              ) : (
                <div className="bg-gray-50 border border-gray-200 rounded-2xl h-full min-h-[300px] flex flex-col items-center justify-center text-center p-8">
                  <div className="text-4xl mb-3">✨</div>
                  <div className="font-bold text-gray-500 mb-1">Your content will appear here</div>
                  <div className="text-sm text-gray-400">Select a platform, enter a topic, and click Generate</div>
                </div>
              )}
            </div>
          </div>
        )}

        {/* APPROVAL QUEUE tab */}
        {tab === 'queue' && (
          <div>
            <div className="flex items-center justify-between mb-4">
              <div className="text-sm text-gray-500">{reviewPosts.length} post{reviewPosts.length !== 1 ? 's' : ''} awaiting approval</div>
              <button onClick={exportCSV} disabled={csvExporting} className="px-4 py-2 border border-gray-200 text-sm font-semibold rounded-lg hover:bg-gray-50 transition-colors flex items-center gap-1.5">
                📥 {csvExporting ? 'Exporting…' : 'Export Approved CSV'}
              </button>
            </div>
            {loadingPosts ? <div className="text-center py-12 text-gray-400">Loading…</div> : (
              <div className="space-y-4">
                {posts.filter(p => ['review','draft','approved','rejected'].includes(p.status)).map(post => (
                  <div key={post.id} className={`bg-white border rounded-xl p-5 ${post.status === 'review' ? 'border-amber-300' : 'border-gray-200'}`}>
                    <div className="flex items-start justify-between gap-4 mb-3">
                      <div className="flex items-center gap-2">
                        <span>{PLATFORM_ICON[post.platform] || '📄'}</span>
                        <span className="font-semibold text-sm text-[#0F1631] capitalize">{post.platform?.replace('_',' ')}</span>
                        <span className={`text-xs px-2 py-0.5 rounded-full font-semibold ${STATUS_COLORS[post.status] || 'bg-gray-100 text-gray-600'}`}>{post.status}</span>
                        {post.ai_generated && <span className="text-xs text-gray-400">AI</span>}
                      </div>
                      <span className="text-xs text-gray-400 flex-shrink-0">{new Date(post.created_at).toLocaleDateString()}</span>
                    </div>
                    <div className="text-sm text-gray-700 leading-relaxed mb-3 line-clamp-4 whitespace-pre-wrap">{post.body}</div>
                    {post.compliance_flags?.length > 0 && (
                      <div className="text-xs text-red-600 mb-2">⚠️ Flags: {post.compliance_flags.map(f => f.phrase).join(', ')}</div>
                    )}
                    {post.status === 'review' && (
                      <div className="flex gap-2 pt-2 border-t border-gray-100">
                        <button onClick={() => approvePost(post)} disabled={!!approving[post.id]}
                          className="px-4 py-1.5 bg-green-600 text-white text-xs font-bold rounded-lg hover:bg-green-700 disabled:opacity-50 transition-colors">
                          {approving[post.id] ? '…' : '✓ Approve'}
                        </button>
                        <button onClick={() => rejectPost(post)} className="px-4 py-1.5 bg-red-50 text-red-600 border border-red-200 text-xs font-bold rounded-lg hover:bg-red-100 transition-colors">
                          ✗ Reject
                        </button>
                        <button onClick={() => navigator.clipboard.writeText(post.body)} className="px-4 py-1.5 border border-gray-200 text-xs rounded-lg hover:bg-gray-50 transition-colors">
                          Copy
                        </button>
                      </div>
                    )}
                    {post.status === 'approved' && (
                      <div className="flex gap-2 pt-2 border-t border-gray-100">
                        <button onClick={() => navigator.clipboard.writeText(post.body)} className="px-4 py-1.5 border border-gray-200 text-xs rounded-lg hover:bg-gray-50 transition-colors">Copy for Buffer/Metricool</button>
                      </div>
                    )}
                  </div>
                ))}
                {posts.filter(p => ['review','draft','approved','rejected'].includes(p.status)).length === 0 && (
                  <div className="text-center py-12 text-gray-400">No posts yet. Generate some content first.</div>
                )}
              </div>
            )}
          </div>
        )}

        {/* CALENDAR tab */}
        {tab === 'calendar' && (
          <div>
            <div className="flex items-center justify-between mb-4">
              <div className="text-sm text-gray-500">Content calendar — approved posts ready to schedule</div>
              <button onClick={exportCSV} disabled={csvExporting} className="px-4 py-2 bg-[#F97316] text-white text-sm font-bold rounded-lg hover:bg-orange-600 transition-colors">
                📥 Export to CSV (Buffer/Metricool)
              </button>
            </div>
            <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 mb-4 text-sm text-amber-800">
              💡 Export approved content as CSV to import into Buffer, Metricool, or any social scheduler. Each row = one post.
            </div>
            {loadingPosts ? <div className="text-center py-12 text-gray-400">Loading…</div> : (
              <div className="space-y-2">
                {posts.filter(p => p.status === 'approved').map(post => (
                  <div key={post.id} className="bg-white border border-green-200 rounded-xl p-4 flex items-center gap-4">
                    <span className="text-xl">{PLATFORM_ICON[post.platform] || '📄'}</span>
                    <div className="flex-1 min-w-0">
                      <div className="text-sm font-medium text-[#0F1631] truncate">{post.body.slice(0,80)}…</div>
                      <div className="text-xs text-gray-400 capitalize">{post.platform?.replace('_',' ')} · {new Date(post.created_at).toLocaleDateString()}</div>
                    </div>
                    <button onClick={() => navigator.clipboard.writeText(post.body)} className="text-xs text-[#2D1FB1] font-semibold hover:underline flex-shrink-0">Copy</button>
                  </div>
                ))}
                {posts.filter(p => p.status === 'approved').length === 0 && (
                  <div className="text-center py-12 text-gray-400">No approved posts yet. Generate and approve content first.</div>
                )}
              </div>
            )}
          </div>
        )}

        {/* SETTINGS tab */}
        {tab === 'settings' && bvs && (
          <div className="max-w-2xl space-y-5">
            <div>
              <label className="block text-xs font-bold text-gray-600 mb-1">Autopilot Level</label>
              <select value={bvs.autopilot_level} onChange={e => setBvs(b => ({ ...b, autopilot_level: e.target.value }))}
                className="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#2D1FB1]">
                <option value="draft_only">Draft Only — all content stays draft, manual publish</option>
                <option value="approval_required">Approval Required — queued for human review before publish</option>
                <option value="preapproved">Preapproved Autopilot — approved instantly after compliance check</option>
                <option value="paused">Emergency Pause — all generation disabled</option>
              </select>
            </div>
            <div>
              <label className="block text-xs font-bold text-gray-600 mb-1">Brand Tone</label>
              <input value={bvs.tone} onChange={e => setBvs(b => ({ ...b, tone: e.target.value }))}
                className="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#2D1FB1]"
                placeholder="e.g. professional, trustworthy, accessible, institutional" />
            </div>
            <div>
              <label className="block text-xs font-bold text-gray-600 mb-1">Target Audience</label>
              <textarea value={bvs.audience} onChange={e => setBvs(b => ({ ...b, audience: e.target.value }))} rows={2}
                className="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#2D1FB1] resize-none" />
            </div>
            <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 text-xs text-amber-800">
              ⚠️ Forbidden claims are managed in the database (table: forbidden_claims). Any content containing those phrases will be blocked before saving.
            </div>
            <button onClick={saveBVS} disabled={savingBvs}
              className="px-6 py-2.5 bg-[#2D1FB1] text-white font-bold rounded-xl hover:bg-indigo-700 disabled:opacity-50 transition-colors text-sm">
              {savingBvs ? 'Saving…' : 'Save Settings'}
            </button>
          </div>
        )}
        {tab === 'settings' && !bvs && <div className="text-center py-12 text-gray-400">Loading settings… Run sql/12_content_schema.sql if this persists.</div>}
      </div>
    );
  }

  // ─── CRM Dashboard ───────────────────────────────────────────────────────
  function CRMDashboard() {
    const [leads, setLeads]           = useState([]);
    const [stages, setStages]         = useState([]);
    const [tasks, setTasks]           = useState([]);
    const [loading, setLoading]       = useState(true);
    const [view, setView]             = useState('pipeline'); // pipeline | list | lead | sequences | templates
    const [selectedLead, setSelectedLead] = useState(null);
    const [filter, setFilter]         = useState({ stage: '', source: '', tag: '' });
    const [search, setSearch]         = useState('');
    const [events, setEvents]         = useState([]);
    const [leadTasks, setLeadTasks]   = useState([]);
    const [newNote, setNewNote]       = useState('');
    const [newTask, setNewTask]       = useState('');
    const [savingNote, setSavingNote] = useState(false);
    const [sequences, setSequences]   = useState([]);
    const [templates, setTemplates]   = useState([]);

    useEffect(() => {
      loadCRM();
    }, []);

    const loadCRM = async () => {
      setLoading(true);
      const sb = await getSupabase();
      if (!sb) { setLoading(false); return; }
      const [{ data: l }, { data: s }, { data: t }] = await Promise.all([
        sb.from('leads').select('*, funnel_stages(name,color)').order('last_activity', { ascending: false }).limit(200),
        sb.from('funnel_stages').select('*').eq('is_active', true).order('sort_order'),
        sb.from('crm_tasks').select('*, leads(name,email)').eq('completed', false).order('due_at').limit(50)
      ]);
      setLeads(l || []);
      setStages(s || []);
      setTasks(t || []);
      setLoading(false);
    };

    const openLead = async (lead) => {
      setSelectedLead(lead);
      setView('lead');
      const sb = await getSupabase();
      if (!sb) return;
      const [{ data: ev }, { data: tk }] = await Promise.all([
        sb.from('crm_events').select('*').eq('lead_id', lead.id).order('created_at', { ascending: false }).limit(50),
        sb.from('crm_tasks').select('*').eq('lead_id', lead.id).order('created_at', { ascending: false })
      ]);
      setEvents(ev || []);
      setLeadTasks(tk || []);
    };

    const addNote = async () => {
      if (!newNote.trim() || !selectedLead) return;
      setSavingNote(true);
      const sb = await getSupabase();
      if (!sb) { setSavingNote(false); return; }
      const { data: ev } = await sb.from('crm_events').insert({
        lead_id: selectedLead.id, event_type: 'note', title: 'Note added', body: newNote.trim()
      }).select().single();
      if (ev) setEvents(prev => [ev, ...prev]);
      await sb.from('leads').update({ notes: newNote.trim(), last_activity: new Date().toISOString() }).eq('id', selectedLead.id);
      setNewNote('');
      setSavingNote(false);
    };

    const addTask = async () => {
      if (!newTask.trim() || !selectedLead) return;
      const sb = await getSupabase();
      if (!sb) return;
      const { data: task } = await sb.from('crm_tasks').insert({
        lead_id: selectedLead.id, title: newTask.trim(),
        due_at: new Date(Date.now() + 24*60*60*1000).toISOString()
      }).select().single();
      if (task) setLeadTasks(prev => [task, ...prev]);
      setNewTask('');
    };

    const completeTask = async (task) => {
      const sb = await getSupabase();
      if (!sb) return;
      await sb.from('crm_tasks').update({ completed: true, completed_at: new Date().toISOString() }).eq('id', task.id);
      setLeadTasks(prev => prev.map(t => t.id === task.id ? { ...t, completed: true } : t));
      setTasks(prev => prev.filter(t => t.id !== task.id));
    };

    const changeStage = async (leadId, stageId) => {
      const sb = await getSupabase();
      if (!sb) return;
      await sb.from('leads').update({ stage_id: stageId, last_activity: new Date().toISOString() }).eq('id', leadId);
      setLeads(prev => prev.map(l => l.id === leadId ? { ...l, stage_id: stageId } : l));
      if (selectedLead?.id === leadId) setSelectedLead(l => ({ ...l, stage_id: stageId }));
    };

    const loadSequences = async () => {
      const sb = await getSupabase();
      if (!sb) return;
      const { data } = await sb.from('email_sequences').select('*, email_sequence_steps(*)').order('name');
      setSequences(data || []);
    };

    const loadTemplates = async () => {
      const sb = await getSupabase();
      if (!sb) return;
      const { data } = await sb.from('email_templates').select('*').order('name');
      setTemplates(data || []);
    };

    useEffect(() => {
      if (view === 'sequences') loadSequences();
      if (view === 'templates') loadTemplates();
    }, [view]);

    const filteredLeads = leads.filter(l => {
      if (search && !`${l.name||''} ${l.email||''} ${l.organization||''}`.toLowerCase().includes(search.toLowerCase())) return false;
      if (filter.stage && l.stage_id !== filter.stage) return false;
      if (filter.source && l.source !== filter.source) return false;
      if (filter.tag && l.result_tag !== filter.tag) return false;
      return true;
    });

    const RESULT_COLORS = { beginner: '#F97316', developing: '#FFD23F', ready: '#2D1FB1', advanced: '#16A34A' };
    const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }) : '—';
    const fmtRelative = (d) => {
      if (!d) return '—';
      const diff = Date.now() - new Date(d).getTime();
      if (diff < 60000) return 'just now';
      if (diff < 3600000) return Math.floor(diff/60000) + 'm ago';
      if (diff < 86400000) return Math.floor(diff/3600000) + 'h ago';
      return Math.floor(diff/86400000) + 'd ago';
    };

    if (loading) return <div className="text-center py-12 text-gray-400">Loading CRM…</div>;

    return (
      <div className="fade-in">
        {/* CRM sub-nav */}
        <div className="flex items-center gap-1 border-b border-gray-200 mb-6 overflow-x-auto">
          {[['pipeline','Pipeline'],['list','All Leads'],['lead','Lead Detail'],['sequences','Email Sequences'],['templates','Templates']].map(([id,label]) => (
            (id !== 'lead' || selectedLead) && (
              <button key={id} onClick={() => setView(id)}
                className={`px-4 py-2.5 text-sm font-semibold whitespace-nowrap border-b-2 transition-colors ${view===id ? 'border-[#2D1FB1] text-[#2D1FB1]' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>
                {label}
                {id==='list' && <span className="ml-1.5 text-xs text-gray-400">({filteredLeads.length})</span>}
                {id==='pipeline' && tasks.length > 0 && <span className="ml-1.5 bg-orange-100 text-orange-700 text-xs px-1.5 py-0.5 rounded-full">{tasks.length}</span>}
              </button>
            )
          ))}
          <div className="flex-1"/>
          <input value={search} onChange={e => setSearch(e.target.value)}
            className="border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-[#2D1FB1] w-48 mr-2"
            placeholder="Search leads…" />
        </div>

        {/* PIPELINE view — stage columns */}
        {view === 'pipeline' && (
          <div>
            {/* Task strip */}
            {tasks.length > 0 && (
              <div className="mb-6 bg-amber-50 border border-amber-200 rounded-xl p-4">
                <div className="text-xs font-bold text-amber-800 mb-2 uppercase tracking-wider">Due Tasks ({tasks.length})</div>
                <div className="space-y-1">
                  {tasks.slice(0,5).map(task => (
                    <div key={task.id} className="flex items-center gap-3">
                      <button onClick={() => completeTask(task)} className="w-4 h-4 rounded border border-amber-400 flex-shrink-0 hover:bg-amber-200 transition-colors"/>
                      <span className="text-sm text-gray-700 flex-1">{task.title}</span>
                      <span className="text-xs text-gray-400">{task.leads?.name || task.leads?.email}</span>
                      <span className="text-xs text-amber-600">{task.due_at ? fmtDate(task.due_at) : 'No date'}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
            <div className="overflow-x-auto">
              <div className="flex gap-4 pb-4" style={{ minWidth: stages.length * 220 }}>
                {stages.map(stage => {
                  const stageLeads = filteredLeads.filter(l => l.stage_id === stage.id || (!l.stage_id && stage.slug === 'new_lead'));
                  return (
                    <div key={stage.id} className="flex-shrink-0 w-52">
                      <div className="flex items-center justify-between mb-3">
                        <div className="flex items-center gap-2">
                          <div className="w-2.5 h-2.5 rounded-full" style={{ background: stage.color }}/>
                          <span className="text-xs font-bold text-gray-700">{stage.name}</span>
                        </div>
                        <span className="text-xs text-gray-400 bg-gray-100 px-1.5 rounded-full">{stageLeads.length}</span>
                      </div>
                      <div className="space-y-2">
                        {stageLeads.slice(0,10).map(lead => (
                          <div key={lead.id} onClick={() => openLead(lead)}
                            className="bg-white border border-gray-200 rounded-xl p-3 cursor-pointer hover:shadow-md hover:border-[#2D1FB1] transition-all">
                            <div className="font-semibold text-xs text-[#0F1631] truncate mb-0.5">{lead.name || lead.email}</div>
                            {lead.organization && <div className="text-xs text-gray-400 truncate mb-1">{lead.organization}</div>}
                            <div className="flex items-center justify-between">
                              {lead.result_tag && <span className="text-xs px-1.5 py-0.5 rounded-full font-semibold" style={{ background: `${RESULT_COLORS[lead.result_tag]}20`, color: RESULT_COLORS[lead.result_tag] }}>{lead.result_tag}</span>}
                              <span className="text-xs text-gray-400 ml-auto">{fmtRelative(lead.last_activity)}</span>
                            </div>
                          </div>
                        ))}
                        {stageLeads.length > 10 && <div className="text-xs text-center text-gray-400 py-1">+{stageLeads.length-10} more</div>}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        )}

        {/* LIST view */}
        {view === 'list' && (
          <div>
            <div className="flex gap-2 mb-4 flex-wrap">
              <select value={filter.stage} onChange={e => setFilter(f => ({ ...f, stage: e.target.value }))}
                className="border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none">
                <option value="">All Stages</option>
                {stages.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
              </select>
              <select value={filter.tag} onChange={e => setFilter(f => ({ ...f, tag: e.target.value }))}
                className="border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none">
                <option value="">All Results</option>
                {['beginner','developing','ready','advanced'].map(t => <option key={t} value={t}>{t}</option>)}
              </select>
              <select value={filter.source} onChange={e => setFilter(f => ({ ...f, source: e.target.value }))}
                className="border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none">
                <option value="">All Sources</option>
                {['quiz','checklist','webinar','website','purchase'].map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            </div>
            <div className="bg-white border border-gray-200 rounded-xl overflow-hidden">
              <div className="grid grid-cols-12 px-5 py-2.5 bg-gray-50 text-xs font-semibold text-gray-500 border-b border-gray-100">
                <div className="col-span-3">Lead</div>
                <div className="col-span-2">Stage</div>
                <div className="col-span-2">Source</div>
                <div className="col-span-2">Score</div>
                <div className="col-span-2">Last Active</div>
                <div className="col-span-1"/>
              </div>
              {filteredLeads.length === 0 && <div className="text-center py-12 text-gray-400 text-sm">No leads found.</div>}
              {filteredLeads.map(lead => (
                <div key={lead.id} className="grid grid-cols-12 px-5 py-3.5 border-b border-gray-100 hover:bg-blue-50 transition-colors items-center">
                  <div className="col-span-3">
                    <div className="font-semibold text-sm text-[#0F1631] truncate">{lead.name || '—'}</div>
                    <div className="text-xs text-gray-400 truncate">{lead.email}</div>
                  </div>
                  <div className="col-span-2">
                    <select value={lead.stage_id || ''} onChange={e => changeStage(lead.id, e.target.value || null)}
                      className="border border-gray-200 rounded px-2 py-1 text-xs focus:outline-none w-full">
                      <option value="">Unset</option>
                      {stages.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                    </select>
                  </div>
                  <div className="col-span-2 text-xs text-gray-500 capitalize">{lead.source || '—'}</div>
                  <div className="col-span-2">
                    {lead.result_tag && <span className="text-xs px-2 py-0.5 rounded-full font-semibold capitalize" style={{ background: `${RESULT_COLORS[lead.result_tag]}20`, color: RESULT_COLORS[lead.result_tag] }}>{lead.result_tag}</span>}
                    {lead.quiz_score != null && <span className="text-xs text-gray-400 ml-1">{lead.quiz_score}%</span>}
                  </div>
                  <div className="col-span-2 text-xs text-gray-400">{fmtRelative(lead.last_activity)}</div>
                  <div className="col-span-1 text-right">
                    <button onClick={() => openLead(lead)} className="text-xs text-[#2D1FB1] font-semibold hover:underline">View</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* LEAD DETAIL view */}
        {view === 'lead' && selectedLead && (
          <div className="grid md:grid-cols-3 gap-6">
            {/* Left: lead info */}
            <div className="md:col-span-1 space-y-4">
              <div className="bg-white border border-gray-200 rounded-xl p-5">
                <div className="w-12 h-12 rounded-full bg-[#2D1FB1] text-white flex items-center justify-center font-black text-lg mb-3">
                  {(selectedLead.name || selectedLead.email || '?')[0].toUpperCase()}
                </div>
                <div className="font-bold text-[#0F1631]">{selectedLead.name || '—'}</div>
                <div className="text-sm text-gray-500 mb-3">{selectedLead.email}</div>
                {selectedLead.organization && <div className="text-xs text-gray-400 mb-1">🏢 {selectedLead.organization}</div>}
                {selectedLead.source && <div className="text-xs text-gray-400 mb-1">📥 Source: {selectedLead.source}</div>}
                {selectedLead.result_tag && <div className="text-xs font-semibold capitalize mt-2 px-2 py-0.5 rounded-full inline-block" style={{ background: `${RESULT_COLORS[selectedLead.result_tag]}20`, color: RESULT_COLORS[selectedLead.result_tag] }}>{selectedLead.result_tag}</div>}
                {selectedLead.quiz_score != null && <div className="text-xs text-gray-500 mt-1">Quiz score: {selectedLead.quiz_score}%</div>}
              </div>
              <div className="bg-white border border-gray-200 rounded-xl p-4">
                <div className="text-xs font-bold text-gray-600 mb-2">Stage</div>
                <select value={selectedLead.stage_id || ''} onChange={e => changeStage(selectedLead.id, e.target.value || null)}
                  className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#2D1FB1]">
                  <option value="">Unset</option>
                  {stages.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                </select>
              </div>
              {/* Tasks */}
              <div className="bg-white border border-gray-200 rounded-xl p-4">
                <div className="text-xs font-bold text-gray-600 mb-3">Tasks</div>
                <div className="flex gap-2 mb-3">
                  <input value={newTask} onChange={e => setNewTask(e.target.value)}
                    className="flex-1 border border-gray-200 rounded-lg px-2 py-1.5 text-xs focus:outline-none"
                    placeholder="Add a task…" onKeyDown={e => e.key === 'Enter' && addTask()} />
                  <button onClick={addTask} disabled={!newTask.trim()} className="px-3 py-1.5 bg-[#2D1FB1] text-white text-xs font-bold rounded-lg disabled:opacity-40">Add</button>
                </div>
                <div className="space-y-1.5">
                  {leadTasks.map(task => (
                    <div key={task.id} className={`flex items-center gap-2 text-xs ${task.completed ? 'opacity-40' : ''}`}>
                      <button onClick={() => !task.completed && completeTask(task)}
                        className={`w-4 h-4 rounded border flex-shrink-0 flex items-center justify-center transition-colors ${task.completed ? 'bg-green-100 border-green-300' : 'border-gray-300 hover:bg-gray-100'}`}>
                        {task.completed && <span className="text-green-600 text-xs">✓</span>}
                      </button>
                      <span className={task.completed ? 'line-through text-gray-400' : 'text-gray-700'}>{task.title}</span>
                    </div>
                  ))}
                  {leadTasks.length === 0 && <div className="text-xs text-gray-400 italic">No tasks</div>}
                </div>
              </div>
            </div>

            {/* Right: activity feed + note */}
            <div className="md:col-span-2 space-y-4">
              <div className="bg-white border border-gray-200 rounded-xl p-5">
                <div className="text-xs font-bold text-gray-600 mb-3">Add Note</div>
                <div className="flex gap-2">
                  <textarea value={newNote} onChange={e => setNewNote(e.target.value)} rows={2}
                    className="flex-1 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#2D1FB1] resize-none"
                    placeholder="Write a note about this lead…" />
                  <button onClick={addNote} disabled={!newNote.trim() || savingNote} className="px-4 bg-[#2D1FB1] text-white text-sm font-bold rounded-lg disabled:opacity-40 hover:bg-indigo-700 transition-colors self-start py-2">
                    {savingNote ? '…' : 'Save'}
                  </button>
                </div>
              </div>
              <div className="bg-white border border-gray-200 rounded-xl p-5">
                <div className="text-xs font-bold text-gray-600 mb-4">Activity Feed</div>
                {events.length === 0 && <div className="text-sm text-gray-400 italic">No activity yet.</div>}
                <div className="space-y-3">
                  {events.map(ev => (
                    <div key={ev.id} className="flex items-start gap-3">
                      <div className="w-7 h-7 rounded-full bg-gray-100 flex items-center justify-center text-xs flex-shrink-0">
                        {ev.event_type === 'note' ? '📝' : ev.event_type === 'email_sent' ? '📧' : ev.event_type === 'stage_change' ? '🔄' : '📋'}
                      </div>
                      <div className="flex-1">
                        <div className="text-sm font-medium text-[#0F1631]">{ev.title}</div>
                        {ev.body && <div className="text-xs text-gray-500 mt-0.5 leading-relaxed">{ev.body}</div>}
                        <div className="text-xs text-gray-400 mt-0.5">{fmtDate(ev.created_at)}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        )}

        {/* SEQUENCES view */}
        {view === 'sequences' && (
          <div>
            <div className="flex justify-between items-center mb-4">
              <div className="text-sm text-gray-500">{sequences.length} email sequences configured</div>
            </div>
            <div className="space-y-3">
              {sequences.map(seq => (
                <div key={seq.id} className="bg-white border border-gray-200 rounded-xl p-5">
                  <div className="flex items-center justify-between mb-2">
                    <div>
                      <div className="font-bold text-[#0F1631] text-sm">{seq.name}</div>
                      <div className="text-xs text-gray-400">Trigger: {seq.trigger_event}{seq.result_tag ? ` · Tag: ${seq.result_tag}` : ''}</div>
                    </div>
                    <span className={`text-xs px-2.5 py-1 rounded-full font-semibold ${seq.is_active ? 'bg-green-50 text-green-700' : 'bg-gray-100 text-gray-400'}`}>
                      {seq.is_active ? 'Active' : 'Paused'}
                    </span>
                  </div>
                  {seq.email_sequence_steps?.length > 0 && (
                    <div className="text-xs text-gray-400 mt-1">{seq.email_sequence_steps.length} email{seq.email_sequence_steps.length !== 1 ? 's' : ''} · steps: {seq.email_sequence_steps.map(s => `+${s.delay_hours}h`).join(', ')}</div>
                  )}
                </div>
              ))}
              {sequences.length === 0 && <div className="text-center py-12 text-gray-400">No sequences found. Run sql/11_crm_schema.sql to seed defaults.</div>}
            </div>
          </div>
        )}

        {/* TEMPLATES view */}
        {view === 'templates' && (
          <div className="space-y-3">
            {templates.map(tmpl => (
              <div key={tmpl.id} className="bg-white border border-gray-200 rounded-xl p-5">
                <div className="flex items-center justify-between mb-1">
                  <div className="font-bold text-[#0F1631] text-sm">{tmpl.name}</div>
                  <span className="text-xs text-gray-400 font-mono">{tmpl.slug}</span>
                </div>
                <div className="text-xs text-gray-500 mb-2">Subject: {tmpl.subject}</div>
                {tmpl.variables?.length > 0 && (
                  <div className="text-xs text-gray-400">Variables: {tmpl.variables.map(v => `{{${v}}}`).join(', ')}</div>
                )}
              </div>
            ))}
            {templates.length === 0 && <div className="text-center py-12 text-gray-400">No templates found. Run sql/11_crm_schema.sql to seed defaults.</div>}
          </div>
        )}
      </div>
    );
  }

  // ─── Admin Offers Manager ─────────────────────────────────────────────────
  function AdminOffersManager() {
    const [offers, setOffers] = useState([]);
    const [coupons, setCoupons] = useState([]);
    const [orders, setOrders] = useState([]);
    const [tab, setTab] = useState('offers');
    const [loading, setLoading] = useState(true);
    const [editing, setEditing] = useState(null);
    const [saving, setSaving] = useState(false);

    useEffect(() => {
      (async () => {
        const sb = await getSupabase();
        if (!sb) { setLoading(false); return; }
        const [{ data: o }, { data: c }, { data: ord }] = await Promise.all([
          sb.from('offers').select('*').order('sort_order'),
          sb.from('coupons').select('*').order('created_at', { ascending: false }),
          sb.from('orders').select('*, offers(title), profiles(full_name,email)').order('created_at', { ascending: false }).limit(50)
        ]);
        setOffers(o || []);
        setCoupons(c || []);
        setOrders(ord || []);
        setLoading(false);
      })();
    }, []);

    const saveOffer = async (offer) => {
      setSaving(true);
      const sb = await getSupabase();
      if (!sb) { setSaving(false); return; }
      if (offer.id) {
        const { data } = await sb.from('offers').update({ ...offer, updated_at: new Date().toISOString() }).eq('id', offer.id).select().single();
        setOffers(prev => prev.map(o => o.id === data.id ? data : o));
      } else {
        const { data } = await sb.from('offers').insert({ ...offer }).select().single();
        setOffers(prev => [...prev, data]);
      }
      setSaving(false);
      setEditing(null);
    };

    const toggleActive = async (offer) => {
      const sb = await getSupabase();
      if (!sb) return;
      await sb.from('offers').update({ is_active: !offer.is_active }).eq('id', offer.id);
      setOffers(prev => prev.map(o => o.id === offer.id ? { ...o, is_active: !o.is_active } : o));
    };

    const fmt = (cents) => '$' + (cents / 100).toLocaleString();

    if (loading) return <div className="text-center py-12 text-gray-400">Loading…</div>;

    return (
      <div className="mt-6">
        <div className="flex gap-1 border-b border-gray-200 mb-6">
          {[['offers','Offers'],['coupons','Coupons'],['orders','Orders']].map(([id,label]) => (
            <button key={id} onClick={() => setTab(id)}
              className={`px-5 py-2.5 text-sm font-semibold border-b-2 transition-colors ${tab===id ? 'border-[#F97316] text-[#F97316]' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>
              {label}
            </button>
          ))}
        </div>

        {tab === 'offers' && (
          <div>
            <div className="flex justify-end mb-4">
              <button onClick={() => setEditing({})} className="px-4 py-2 bg-[#F97316] text-white text-sm font-bold rounded-lg hover:bg-orange-600 transition-colors">+ New Offer</button>
            </div>
            <div className="space-y-2">
              {offers.map(offer => (
                <div key={offer.id} className="bg-white border border-gray-200 rounded-xl p-4 flex items-center gap-4">
                  <div className="flex-1">
                    <div className="font-semibold text-[#0F1631] text-sm">{offer.title}</div>
                    <div className="text-xs text-gray-400">{offer.offer_type} · {fmt(offer.price_cents)} · {offer.seat_limit} seat(s)</div>
                  </div>
                  <span className={`text-xs px-2.5 py-1 rounded-full font-semibold ${offer.is_active ? 'bg-green-50 text-green-700' : 'bg-gray-100 text-gray-400'}`}>
                    {offer.is_active ? 'Active' : 'Hidden'}
                  </span>
                  <button onClick={() => setEditing(offer)} className="text-xs px-3 py-1.5 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors">Edit</button>
                  <button onClick={() => toggleActive(offer)} className="text-xs px-3 py-1.5 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors">
                    {offer.is_active ? 'Hide' : 'Show'}
                  </button>
                </div>
              ))}
            </div>
          </div>
        )}

        {tab === 'orders' && (
          <div className="space-y-2">
            {orders.length === 0 && <div className="text-center py-12 text-gray-400">No orders yet.</div>}
            {orders.map(order => (
              <div key={order.id} className="bg-white border border-gray-200 rounded-xl p-4 flex items-center gap-4">
                <div className="flex-1">
                  <div className="font-semibold text-sm text-[#0F1631]">{order.profiles?.full_name || order.profiles?.email || 'Unknown'}</div>
                  <div className="text-xs text-gray-400">{order.offers?.title} · {fmt(order.amount_cents)} · {new Date(order.created_at).toLocaleDateString()}</div>
                </div>
                <span className={`text-xs px-2.5 py-1 rounded-full font-semibold ${
                  order.status === 'paid' ? 'bg-green-50 text-green-700' :
                  order.status === 'refunded' ? 'bg-gray-100 text-gray-500' :
                  order.status === 'failed' ? 'bg-red-50 text-red-600' : 'bg-amber-50 text-amber-700'}`}>
                  {order.status}
                </span>
              </div>
            ))}
          </div>
        )}

        {tab === 'coupons' && (
          <div className="text-center py-12 text-gray-400">Coupon management — connect to Stripe dashboard for coupon creation.</div>
        )}

        {/* Edit modal */}
        {editing !== null && (
          <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
            <div className="bg-white rounded-2xl p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto">
              <h3 className="font-bold text-lg text-[#0F1631] mb-4">{editing.id ? 'Edit Offer' : 'New Offer'}</h3>
              <div className="space-y-3">
                {[['title','Title','text'],['slug','Slug (URL)','text'],['description','Description','text'],['price_cents','Price (cents)','number'],['seat_limit','Seat Limit','number'],['stripe_price_id','Stripe Price ID','text']].map(([key,label,type]) => (
                  <div key={key}>
                    <label className="block text-xs font-semibold text-gray-600 mb-1">{label}</label>
                    <input type={type} value={editing[key] || ''} onChange={e => setEditing(ed => ({ ...ed, [key]: type === 'number' ? parseInt(e.target.value)||0 : e.target.value }))}
                      className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#2D1FB1]" />
                  </div>
                ))}
                <div>
                  <label className="block text-xs font-semibold text-gray-600 mb-1">Type</label>
                  <select value={editing.offer_type || 'bundle'} onChange={e => setEditing(ed => ({ ...ed, offer_type: e.target.value }))}
                    className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#2D1FB1]">
                    {['single_cert','bundle','org_license','subscription','dwu'].map(t => <option key={t} value={t}>{t}</option>)}
                  </select>
                </div>
                <label className="flex items-center gap-2 text-sm">
                  <input type="checkbox" checked={editing.is_featured || false} onChange={e => setEditing(ed => ({ ...ed, is_featured: e.target.checked }))} />
                  Featured offer
                </label>
              </div>
              <div className="flex gap-3 mt-5">
                <button onClick={() => setEditing(null)} className="flex-1 py-2 border border-gray-200 text-gray-600 rounded-lg text-sm hover:bg-gray-50">Cancel</button>
                <button onClick={() => saveOffer(editing)} disabled={saving} className="flex-1 py-2 bg-[#2D1FB1] text-white font-bold rounded-lg text-sm hover:bg-indigo-700 disabled:opacity-50 transition-colors">
                  {saving ? 'Saving…' : 'Save'}
                </button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  // ─── Org Owner Dashboard ──────────────────────────────────────────────────
  function OrgDashboard({ user, profile, onSignOut }) {
    const [seats, setSeats] = useState(null);
    const [members, setMembers] = useState([]);
    const [inviteEmail, setInviteEmail] = useState('');
    const [inviting, setInviting] = useState(false);
    const [invitations, setInvitations] = useState([]);
    const [loading, setLoading] = useState(true);
    const [error, setError] = useState('');

    useEffect(() => {
      (async () => {
        const sb = await getSupabase();
        if (!sb || !profile?.organization_id) { setLoading(false); return; }
        const [{ data: s }, { data: m }, { data: inv }] = await Promise.all([
          sb.from('organization_seats').select('*, offers(title)').eq('organization_id', profile.organization_id).maybeSingle(),
          sb.from('organization_members').select('*, profiles(full_name,email,role)').eq('organization_id', profile.organization_id),
          sb.from('seat_invitations').select('*').eq('organization_id', profile.organization_id).eq('status','pending')
        ]);
        setSeats(s);
        setMembers(m || []);
        setInvitations(inv || []);
        setLoading(false);
      })();
    }, [profile?.organization_id]);

    const sendInvite = async () => {
      if (!inviteEmail.trim()) return;
      const available = (seats?.total_seats || 0) - (seats?.used_seats || 0);
      if (available <= 0) { setError('No seats available. Purchase additional seats to invite more members.'); return; }
      setInviting(true); setError('');
      const sb = await getSupabase();
      if (!sb) { setInviting(false); return; }
      const { error: invErr } = await sb.from('seat_invitations').upsert({
        organization_id: profile.organization_id,
        invited_by: user.id, email: inviteEmail.trim().toLowerCase(),
        status: 'pending', expires_at: new Date(Date.now() + 7*24*60*60*1000).toISOString()
      }, { onConflict: 'organization_id,email' });
      if (invErr) { setError(invErr.message); } else {
        setInvitations(prev => [...prev, { email: inviteEmail.trim(), status: 'pending', created_at: new Date().toISOString() }]);
        setInviteEmail('');
      }
      setInviting(false);
    };

    if (loading) return <div className="text-center py-12 text-gray-400">Loading organization…</div>;

    return (
      <main className="max-w-4xl mx-auto px-4 py-10 fade-in">
        <div className="flex items-start justify-between mb-8">
          <div>
            <h1 className="text-3xl font-bold text-[#0F1631] mb-1">Organization Dashboard</h1>
            <p className="text-sm text-gray-500">{user?.email}</p>
          </div>
          <button onClick={onSignOut} className="px-4 py-2 border border-gray-200 text-gray-500 text-sm rounded-lg hover:bg-gray-50 transition-colors">Sign Out</button>
        </div>

        {seats && (
          <div className="grid grid-cols-3 gap-4 mb-8">
            <div className="bg-white border border-gray-200 rounded-xl p-5 text-center">
              <div className="text-3xl font-black text-[#2D1FB1]">{seats.total_seats}</div>
              <div className="text-xs text-gray-500 mt-1">Total Seats</div>
            </div>
            <div className="bg-white border border-gray-200 rounded-xl p-5 text-center">
              <div className="text-3xl font-black text-green-600">{seats.used_seats}</div>
              <div className="text-xs text-gray-500 mt-1">Active Members</div>
            </div>
            <div className="bg-white border border-gray-200 rounded-xl p-5 text-center">
              <div className="text-3xl font-black text-[#F97316]">{seats.total_seats - seats.used_seats}</div>
              <div className="text-xs text-gray-500 mt-1">Available Seats</div>
            </div>
          </div>
        )}

        {/* Invite */}
        <div className="bg-white border border-gray-200 rounded-xl p-5 mb-6">
          <div className="font-bold text-[#0F1631] mb-3">Invite a Team Member</div>
          {error && <div className="text-sm text-red-600 mb-3">{error}</div>}
          <div className="flex gap-2">
            <input value={inviteEmail} onChange={e => setInviteEmail(e.target.value)}
              className="flex-1 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#2D1FB1]"
              placeholder="colleague@organization.org" type="email" />
            <button onClick={sendInvite} disabled={inviting || !inviteEmail.trim()}
              className="px-5 py-2 bg-[#2D1FB1] text-white text-sm font-bold rounded-lg hover:bg-indigo-700 disabled:opacity-50 transition-colors">
              {inviting ? 'Sending…' : 'Invite'}
            </button>
          </div>
          <p className="text-xs text-gray-400 mt-2">An invitation link will be sent to this address. Expires in 7 days.</p>
        </div>

        {/* Members */}
        {members.length > 0 && (
          <div className="bg-white border border-gray-200 rounded-xl p-5 mb-4">
            <div className="font-bold text-[#0F1631] mb-3">Active Members ({members.length})</div>
            <div className="space-y-2">
              {members.map(m => (
                <div key={m.id} className="flex items-center gap-3 py-2 border-b border-gray-100 last:border-0">
                  <div className="w-8 h-8 rounded-full bg-[#2D1FB1] text-white flex items-center justify-center text-xs font-bold flex-shrink-0">
                    {(m.profiles?.full_name || m.profiles?.email || '?')[0].toUpperCase()}
                  </div>
                  <div className="flex-1">
                    <div className="text-sm font-medium text-[#0F1631]">{m.profiles?.full_name || m.profiles?.email}</div>
                    <div className="text-xs text-gray-400">{m.profiles?.email} · {m.role}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Pending invitations */}
        {invitations.length > 0 && (
          <div className="bg-amber-50 border border-amber-100 rounded-xl p-5">
            <div className="font-bold text-amber-800 mb-3">Pending Invitations</div>
            <div className="space-y-1">
              {invitations.map((inv, i) => (
                <div key={i} className="flex items-center justify-between text-sm">
                  <span className="text-gray-700">{inv.email}</span>
                  <span className="text-xs text-amber-600">Pending</span>
                </div>
              ))}
            </div>
          </div>
        )}
      </main>
    );
  }

  // ─── Root App ─────────────────────────────────────────────────────────────
  function App() {
    const [loading, setLoading]         = useState(true);
    const [pubView, setPubView]         = useState('home'); // public views
    const [user, setUser]               = useState(null);
    const [profile, setProfile]         = useState(null);
    const [loginOpen, setLoginOpen]     = useState(false);
    // LMS navigation state
    const [lmsView, setLmsView]         = useState('dashboard'); // dashboard | admin | catalog | cert | lesson | quiz | scoring | pricing | org
    const [selectedCert, setSelectedCert]     = useState(null);
    const [selectedLesson, setSelectedLesson] = useState(null);
    const [selectedMod, setSelectedMod]       = useState(null);
    const [selectedQuiz, setSelectedQuiz]     = useState(null);
    const [allLessons, setAllLessons]         = useState([]);

    const isStaff = ['super_admin','admin','instructor','reviewer'].includes(profile?.role);
    const loggedIn = !!user;

    useEffect(() => {
      (async () => {
        try {
          const sb = await getSupabase();
          if (sb) {
            const { data: { session } } = await sb.auth.getSession();
            if (session?.user) await loadUser(session.user);
            sb.auth.onAuthStateChange(async (_event, session) => {
              if (session?.user) await loadUser(session.user);
              else { setUser(null); setProfile(null); }
            });
          }
        } catch {}
        finally { setLoading(false); }
      })();
    }, []);

    const loadUser = async (u) => {
      setUser(u);
      const sb = await getSupabase();
      if (sb) {
        const { data: prof } = await sb.from('profiles').select('*').eq('id', u.id).maybeSingle();
        setProfile(prof);
        const staffRoles = ['super_admin','admin','instructor','reviewer'];
        setLmsView(staffRoles.includes(prof?.role) ? 'admin' : 'dashboard');
      }
    };

    const handleSignOut = async () => {
      try { const sb = await getSupabase(); if (sb) await sb.auth.signOut(); } catch {}
      setUser(null); setProfile(null);
    };

    const openCert = (cert) => { setSelectedCert(cert); setLmsView('cert'); };
    const openLesson = async (lesson, mod, cert, quiz) => {
      if (quiz) { setSelectedQuiz(quiz); setSelectedCert(cert); setLmsView('quiz'); return; }
      setSelectedLesson(lesson); setSelectedMod(mod); setSelectedCert(cert);
      // Build flat lesson list for prev/next
      const sb = await getSupabase();
      if (sb) {
        const isStaffRole = ['super_admin','admin','instructor','reviewer'].includes(profile?.role);
        let q = sb.from('lessons').select('*, modules!inner(sort_order, certification_id)')
          .eq('modules.certification_id', cert.id).order('sort_order');
        if (!isStaffRole) q = q.eq('status','approved');
        const { data } = await q;
        setAllLessons(data || []);
      }
      setLmsView('lesson');
    };
    const onLessonComplete = (lesson, next, goBack) => {
      if (goBack) { openLesson(next, selectedMod, selectedCert); return; }
      if (next) openLesson(next, selectedMod, selectedCert);
      else setLmsView('cert');
    };

    if (loading) return <LoadingScreen />;

    if (loggedIn) {
      return (
        <div className="min-h-screen bg-[#F8FAFC]">
          {/* Inner nav for logged-in users */}
          <nav className="bg-white border-b border-gray-200 sticky top-0 z-20">
            <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-6">
                <button onClick={() => setLmsView(isStaff ? 'admin' : 'dashboard')} className="flex items-center">
                  <img src="/assets/logo.png" alt="Cap Fund Academy" style={{ height: 80, width: 'auto' }} />
                </button>
                <button onClick={() => setLmsView('catalog')} className="text-sm text-gray-500 hover:text-[#2D1FB1] transition-colors">Catalog</button>
                <button onClick={() => setLmsView('scoring')} className="text-sm font-semibold text-[#F97316] hover:text-orange-600 transition-colors">🤖 Score My App</button>
                <button onClick={() => setLmsView('pricing')} className="text-sm text-gray-500 hover:text-[#2D1FB1] transition-colors">Pricing</button>
                {isStaff && <button onClick={() => setLmsView('admin')} className="text-sm text-gray-500 hover:text-[#2D1FB1] transition-colors">Admin</button>}
                {!isStaff && <button onClick={() => setLmsView('dashboard')} className="text-sm text-gray-500 hover:text-[#2D1FB1] transition-colors">Dashboard</button>}
                {['organization_owner','organization_manager'].includes(profile?.role) && (
                  <button onClick={() => setLmsView('org')} className="text-sm text-gray-500 hover:text-[#2D1FB1] transition-colors">My Org</button>
                )}
              </div>
              <div className="text-xs text-gray-400">{user?.email}</div>
            </div>
          </nav>

          {lmsView === 'dashboard' && !isStaff && (
            <StudentDashboard user={user} profile={profile} onSignOut={handleSignOut}
              onOpenCatalog={() => setLmsView('catalog')} onSelectCert={openCert} />
          )}
          {lmsView === 'admin' && isStaff && (
            <AdminDashboard user={user} profile={profile} onSignOut={handleSignOut} />
          )}
          {lmsView === 'catalog' && (
            <CertCatalog onSelectCert={openCert} profile={profile} />
          )}
          {lmsView === 'scoring' && (
            <ApplicationWorkspace user={user} profile={profile} onBack={() => setLmsView(isStaff ? 'admin' : 'dashboard')} />
          )}
          {lmsView === 'pricing' && (
            <PricingPage user={user} />
          )}
          {lmsView === 'org' && (
            <OrgDashboard user={user} profile={profile} onSignOut={handleSignOut} />
          )}
          {lmsView === 'cert' && selectedCert && (
            <CertDetail cert={selectedCert} onBack={() => setLmsView('catalog')}
              onStartLesson={openLesson} profile={profile} />
          )}
          {lmsView === 'lesson' && selectedLesson && (
            <LessonPlayer lesson={selectedLesson} mod={selectedMod} cert={selectedCert}
              allLessons={allLessons} onComplete={onLessonComplete}
              onBack={() => setLmsView('cert')} profile={profile} />
          )}
          {lmsView === 'quiz' && selectedQuiz && (
            <QuizPlayer cert={selectedCert} quiz={selectedQuiz}
              onBack={() => setLmsView('cert')}
              onPassed={() => setLmsView('dashboard')}
              profile={profile} />
          )}
        </div>
      );
    }

    return (
      <div className="min-h-screen flex flex-col">
        <Header view={pubView} setView={setPubView} onLoginClick={() => setLoginOpen(true)} />
        {pubView === 'home'      && <Homepage setView={setPubView} />}
        {pubView === 'trust'     && <TrustCenter setView={setPubView} />}
        {pubView === 'quiz'      && <RLFReadinessQuiz onComplete={() => setPubView('home')} />}
        {pubView === 'checklist' && <RMAPChecklist onCapture={() => setPubView('home')} />}
        {pubView === 'webinar'   && <VSLPage onCTA={() => setPubView('home')} />}
        {pubView === 'pricing'   && <PricingPage user={null} />}
        <Footer setView={setPubView} />
        <LoginModal open={loginOpen} onClose={() => setLoginOpen(false)}
          onLoginSuccess={loadUser} />
      </div>
    );
  }

  // ─── Mount ────────────────────────────────────────────────────────────────
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
</body>
</html>
