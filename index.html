  // ─── Supabase client (lazy-initialized) ───────────────────────────────────
  let _supabase = null;
  async function getSupabase() {
    if (_supabase) return _supabase;
    const url = window.ENV?.SUPABASE_URL;
    const key = window.ENV?.SUPABASE_ANON_KEY;
    if (!url || url === 'YOUR_SUPABASE_URL' || !key || key === 'YOUR_SUPABASE_ANON_KEY') {
      return null;
    }
    try {
      const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2.58.0');
      _supabase = createClient(url, key);
      return _supabase;
    } catch {
      return null;
    }
  }

  // ─── Lead Capture Form ────────────────────────────────────────────────────
  function LeadCaptureForm() {
    const [form, setForm] = useState({ name: '', email: '', organization: '' });
    const [status, setStatus] = useState('idle'); // idle | loading | success | error

    const handleChange = e => setForm(f => ({ ...f, [e.target.name]: e.target.value }));

    const handleSubmit = async e => {
      e.preventDefault();
      setStatus('loading');
      try {
        const sb = await getSupabase();
        if (sb) {
          const { error } = await sb.from('leads').insert([{
            name: form.name,
            email: form.email,
            organization: form.organization,
            source: 'checklist',
          }]);
          if (error) {
            // Silent — still show success to user
          }
        }
        setStatus('success');
        setForm({ name: '', email: '', organization: '' });
      } catch {
        setStatus('success'); // Show success regardless of backend state
      }
    };

          </div>

            <label htmlFor="lead-email" className="block text-sm font-medium text-gray-700 mb-1">Email Address</label>

              id="lead-email"
              name="email"
              type="email"
              required
              value={form.email}
              onChange={handleChange}
              placeholder="jane@yourorg.org"
              className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#2D1FB1] focus:border-transparent"
            />
          </div>
        </div>
        <div>
          <label htmlFor="lead-org" className="block text-sm font-medium text-gray-700 mb-1">Organization</label>

            id="lead-org"

  // ─── Login Modal ──────────────────────────────────────────────────────────
  function LoginModal({ open, onClose, onLoginSuccess }) {
    const [form, setForm] = useState({ email: '', password: '' });
    const [error, setError] = useState('');
    const [loading, setLoading] = useState(false);

    const handleChange = e => setForm(f => ({ ...f, [e.target.name]: e.target.value }));

    const handleSubmit = async e => {
      e.preventDefault();
      setError('');
      setLoading(true);
      try {
        const sb = await getSupabase();
        if (!sb) {
          setError('Authentication is not configured yet. Please check back later.');
          setLoading(false);
          return;
        }
        const { data, error: authError } = await sb.auth.signInWithPassword({
          email: form.email,
          password: form.password,
        });
        if (authError) {
          setError(authError.message);
          setLoading(false);
          return;
        }
        onLoginSuccess(data.user);
        onClose();
      } catch {
        setError('An unexpected error occurred. Please try again.');
        setLoading(false);
      }
    };

    if (!open) return null;

    return (
      <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 px-4" role="dialog" aria-modal="true" aria-label="Login">
        <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 fade-in">

            </div>
            {error && (
              <div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-3 py-2">{error}</div>
            )}
            <button
              type="submit"
              disabled={loading}

              {loading ? 'Signing in…' : 'Sign In'}

  // ─── Dashboard (Phase 2 placeholder) ─────────────────────────────────────
  // ─── Markdown renderer ───────────────────────────────────────────────────
  function renderMarkdown(text) {
    if (!text) return '';
    let html = text
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/^#{3} (.+)$/gm, '<h3 class="text-lg font-bold text-[#0F1631] mt-6 mb-2">$1</h3>')
      .replace(/^#{2} (.+)$/gm, '<h2 class="text-xl font-bold text-[#0F1631] mt-8 mb-3">$1</h2>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/`(.+?)`/g, '<code class="bg-gray-100 px-1.5 py-0.5 rounded text-sm font-mono">$1</code>')
      .replace(/^---$/gm, '<hr class="my-6 border-gray-200"/>')
      .replace(/^\| (.+) \|$/gm, (row) => {
        const cells = row.split('|').filter(c => c.trim() && !c.trim().match(/^[-\s]+$/));
        if (!cells.length) return '';
        return '<tr>' + cells.map(c => `<td class="border border-gray-200 px-3 py-2 text-sm">${c.trim()}</td>`).join('') + '</tr>';
      })
      .replace(/(<tr>.*<\/tr>\n?)+/gs, m => `<div class="overflow-x-auto my-4"><table class="min-w-full border-collapse border border-gray-200 rounded-lg">${m}</table></div>`)
      .replace(/^☐ (.+)$/gm, '<div class="flex items-start gap-2 my-1"><span class="text-gray-400 mt-0.5">☐</span><span>$1</span></div>')
      .replace(/^\d+\. (.+)$/gm, '<li class="ml-5 list-decimal my-0.5">$1</li>')
      .replace(/^- (.+)$/gm, '<li class="ml-5 list-disc my-0.5">$1</li>')
      .replace(/(<li.*<\/li>\n?)+/gs, m => `<ul class="my-3 space-y-1">${m}</ul>`)
      .replace(/^(.+)$/gm, (line) => {
        if (line.match(/^<[a-zA-Z]/) || !line.trim()) return line;
        return `<p class="my-3 leading-relaxed text-gray-700">${line}</p>`;
      });
    return html;
  }

  // ─── Cert Catalog ────────────────────────────────────────────────────────
  function CertCatalog({ onSelectCert, profile }) {
    const [certs, setCerts] = useState([]);
    const [loading, setLoading] = useState(true);
    const [filter, setFilter] = useState('all');

    useEffect(() => {
      (async () => {
        const sb = await getSupabase();
        if (!sb) { setLoading(false); return; }
        const isStaff = ['super_admin','admin','instructor','reviewer'].includes(profile?.role);
        let q = sb.from('certifications').select('*').order('cert_number');
        if (!isStaff) q = q.eq('status','approved');
        const { data } = await q;
        setCerts(data || []);
        setLoading(false);
      })();
    }, [profile?.role]);

    const tracks = {
      foundation: [1,2,3,4],
      practitioner: [5,6,7,8,9],
      compliance: [10,11,12],
      growth: [13,14,15,16],
      master: [17]
    };
    const filtered = filter === 'all' ? certs : certs.filter(c => tracks[filter]?.includes(c.cert_number));

    const trackColor = (n) => {
      if (n <= 4) return 'bg-blue-100 text-blue-800';
      if (n <= 9) return 'bg-indigo-100 text-indigo-800';
      if (n <= 12) return 'bg-purple-100 text-purple-800';
      if (n <= 16) return 'bg-orange-100 text-orange-800';
      return 'bg-yellow-100 text-yellow-800';
    };
    const trackLabel = (n) => {
      if (n <= 4) return 'Foundation';
      if (n <= 9) return 'Practitioner';
      if (n <= 12) return 'Compliance';
      if (n <= 16) return 'Growth';
      return 'Master';
    };

    return (
      <main className="max-w-6xl mx-auto px-4 py-12 fade-in">
        <div className="mb-8">
          <h1 className="text-3xl font-bold text-[#0F1631] mb-2">Certification Catalog</h1>
          <p className="text-gray-500">17 stackable certifications in rural capital access, microfinance, and USDA program readiness.</p>
        </div>
        <div className="flex gap-2 flex-wrap mb-8">
          {[['all','All (17)'],['foundation','Foundation'],['practitioner','Practitioner'],['compliance','Compliance'],['growth','Growth'],['master','Master']].map(([id,label]) => (
            <button key={id} onClick={() => setFilter(id)}
              className={`px-4 py-2 rounded-full text-sm font-medium border transition-colors ${filter===id ? 'bg-[#2D1FB1] text-white border-[#2D1FB1]' : 'bg-white text-gray-600 border-gray-200 hover:border-[#2D1FB1]'}`}>
              {label}
            </button>
          ))}
        </div>
        {loading ? (
          <div className="text-center py-20 text-gray-400">Loading certifications…</div>
        ) : (
          <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-5">
            {filtered.map(cert => (
              <div key={cert.id} className="bg-white rounded-2xl border border-gray-200 p-6 hover:shadow-md transition-shadow flex flex-col">
                <div className="flex items-start justify-between mb-3">
                  <span className="text-2xl font-black text-gray-200">0{cert.cert_number > 9 ? '' : '0'}{cert.cert_number}</span>
                  <span className={`text-xs font-semibold px-2.5 py-1 rounded-full ${trackColor(cert.cert_number)}`}>{trackLabel(cert.cert_number)}</span>
                </div>
                <h3 className="font-bold text-[#0F1631] text-base mb-2 leading-tight flex-1">{cert.title}</h3>
                <p className="text-gray-500 text-sm mb-4 leading-relaxed line-clamp-3">{cert.description}</p>
                <div className="flex items-center justify-between mt-auto pt-3 border-t border-gray-100">
                  <span className="text-xs text-gray-400">{cert.hours_min}–{cert.hours_max}h</span>
                  {cert.status !== 'approved' && <span className="text-xs text-amber-600 font-medium">Draft</span>}

                </div>
              </div>
            ))}
          </div>
        )}
      </main>

  // ─── Cert Detail ─────────────────────────────────────────────────────────
  function CertDetail({ cert, onBack, onStartLesson, profile }) {
    const [modules, setModules] = useState([]);
    const [quiz, setQuiz] = useState(null);
    const [progress, setProgress] = useState([]);
    const [loading, setLoading] = useState(true);
    const isStaff = ['super_admin','admin','instructor','reviewer'].includes(profile?.role);

    useEffect(() => {
      (async () => {
        const sb = await getSupabase();
        if (!sb || !cert) { setLoading(false); return; }
        let mq = sb.from('modules').select('*, lessons(*)').eq('certification_id', cert.id).order('sort_order');
        if (!isStaff) mq = mq.eq('status','approved');
        const [{ data: mods }, { data: qz }, { data: prog }] = await Promise.all([
          mq,
          sb.from('quizzes').select('*').eq('certification_id', cert.id).maybeSingle(),
          sb.from('student_progress').select('*').eq('certification_id', cert.id)
        ]);
        const sorted = (mods || []).map(m => ({ ...m, lessons: (m.lessons || []).sort((a,b) => a.sort_order - b.sort_order) }));

        setQuiz(qz);
        setProgress(prog || []);

    return (
      <main className="max-w-4xl mx-auto px-4 py-10 fade-in">

          ← Back to Catalog
        </button>
        <div className="flex items-start justify-between gap-4 mb-2">
          <h1 className="text-3xl font-bold text-[#0F1631] leading-tight">{cert.title}</h1>
          {cert.status === 'approved'
            ? <span className="flex-shrink-0 text-xs px-3 py-1 rounded-full bg-green-50 text-green-700 font-semibold border border-green-200">✓ Approved</span>
            : <span className="flex-shrink-0 text-xs px-3 py-1 rounded-full bg-amber-50 text-amber-700 font-semibold border border-amber-200">Drafted · Awaiting Review</span>
          }
        </div>
        <p className="text-gray-500 mb-4">{cert.hours_min}–{cert.hours_max} hours · Self-paced</p>
        {pct > 0 && (
          <div className="mb-6">
            <div className="flex justify-between text-xs text-gray-500 mb-1"><span>Progress</span><span>{pct}%</span></div>
            <div className="h-2 bg-gray-100 rounded-full overflow-hidden">
              <div className="h-2 bg-[#2D1FB1] rounded-full transition-all" style={{ width: `${pct}%` }}/>
            </div>
          </div>
        )}
        <p className="text-gray-700 leading-relaxed mb-6">{cert.description}</p>
        {cert.learning_outcomes?.length > 0 && (
          <div className="bg-blue-50 border border-blue-100 rounded-xl p-5 mb-8">
            <div className="font-semibold text-[#0F1631] mb-3 text-sm">Learning Outcomes</div>
            <ul className="space-y-2">{cert.learning_outcomes.map((o,i) => (
              <li key={i} className="flex items-start gap-2 text-sm text-gray-700">
                <span className="text-[#2D1FB1] font-bold mt-0.5">✓</span>{o}
              </li>
            ))}</ul>
          </div>
        )}
        {loading ? <div className="text-center py-10 text-gray-400">Loading content…</div> : (
          <div className="space-y-4">
            {modules.map((mod, mi) => (
              <div key={mod.id} className="bg-white border border-gray-200 rounded-xl overflow-hidden">
                <div className="px-5 py-4 bg-gray-50 border-b border-gray-100">
                  <div className="text-xs text-gray-400 font-medium mb-0.5">Module {mi+1}</div>
                  <div className="font-bold text-[#0F1631]">{mod.title}</div>
                </div>
                <div className="divide-y divide-gray-100">
                  {(mod.lessons||[]).map((lesson, li) => {
                    const done = completedIds.has(lesson.id);
                    return (
                      <button key={lesson.id} onClick={() => onStartLesson(lesson, mod, cert)}
                        className="w-full flex items-center gap-4 px-5 py-3.5 hover:bg-blue-50 transition-colors text-left">
                        <div className={`w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0 ${done ? 'bg-green-100' : 'bg-gray-100'}`}>
                          {done ? <span className="text-green-600 text-xs font-bold">✓</span> : <span className="text-gray-400 text-xs font-bold">{mi+1}.{li+1}</span>}
                        </div>
                        <span className="flex-1 text-sm font-medium text-[#0F1631]">{lesson.title}</span>
                        {lesson.read_time_minutes && <span className="text-xs text-gray-400 flex-shrink-0">{lesson.read_time_minutes} min</span>}
                      </button>

                  })}
                </div>
              </div>
            ))}
            {quiz && (
              <div className="bg-white border-2 border-[#2D1FB1] rounded-xl p-5 flex items-center justify-between">
                <div>
                  <div className="font-bold text-[#0F1631] mb-0.5">{quiz.title}</div>
                  <div className="text-sm text-gray-500">{quiz.passing_score}% required to pass · 20 questions</div>
                </div>
                <button onClick={() => onStartLesson(null, null, cert, quiz)}
                  className="px-5 py-2 bg-[#2D1FB1] text-white text-sm font-bold rounded-lg hover:bg-indigo-700 transition-colors">

  // ─── Lesson Player ───────────────────────────────────────────────────────
  function LessonPlayer({ lesson, mod, cert, allLessons, onComplete, onBack, onGoToQuiz, profile }) {
    const [saving, setSaving] = useState(false);
    const [done, setDone] = useState(false);

    const idx = allLessons.findIndex(l => l.id === lesson.id);
    const prev = allLessons[idx - 1];
    const next = allLessons[idx + 1];

    const markComplete = async () => {
      setSaving(true);
      const sb = await getSupabase();
      if (sb) {
        await sb.from('student_progress').upsert({
          user_id: (await sb.auth.getUser()).data.user.id,
          certification_id: cert.id,
          lesson_id: lesson.id,
          status: 'completed',
          completed_at: new Date().toISOString()
        }, { onConflict: 'user_id,lesson_id' });
      }
      setSaving(false);
      setDone(true);
      onComplete && onComplete(lesson, next);
    };

    return (
      <main className="max-w-3xl mx-auto px-4 py-10 fade-in">
        <div className="flex items-center gap-2 text-xs text-gray-400 mb-6">
          <button onClick={onBack} className="hover:text-[#2D1FB1] transition-colors">{cert?.title}</button>
          <span>›</span><span className="text-gray-600">{mod?.title}</span>
          <span>›</span><span className="text-gray-600">{lesson.title}</span>
        </div>
        <div className="flex items-start justify-between gap-4 mb-2">
          <h1 className="text-3xl font-bold text-[#0F1631] leading-tight">{lesson.title}</h1>
          {lesson.status === 'approved'
            ? <span className="flex-shrink-0 text-xs px-2 py-1 rounded-full bg-green-50 text-green-700 font-medium">Approved</span>
            : <span className="flex-shrink-0 text-xs px-2 py-1 rounded-full bg-amber-50 text-amber-700 font-medium">Drafted · Awaiting Review</span>
          }
        </div>
        {lesson.read_time_minutes && <p className="text-sm text-gray-400 mb-8">{lesson.read_time_minutes} min read</p>}
        <article className="prose max-w-none"
          dangerouslySetInnerHTML={{ __html: renderMarkdown(lesson.content) }} />
        <div className="mt-12 pt-6 border-t border-gray-200 flex items-center justify-between gap-4">
          <button onClick={() => prev ? onComplete(lesson, prev, true) : onBack()}
            className="px-4 py-2 text-sm text-gray-500 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors">
            ← {prev ? 'Previous' : 'Back to Cert'}
          </button>
          {done ? (
            <span className="text-green-600 font-semibold text-sm">✓ Completed</span>
          ) : (
            <button onClick={markComplete} disabled={saving}
              className="px-6 py-2 bg-[#2D1FB1] text-white text-sm font-bold rounded-lg hover:bg-indigo-700 transition-colors disabled:opacity-50">
              {saving ? 'Saving…' : next ? 'Mark Complete & Next →' : 'Mark Complete'}
            </button>
          )}
        </div>
      </main>
    );
  }

  // ─── Quiz Player ─────────────────────────────────────────────────────────
  function QuizPlayer({ cert, quiz, onBack, onPassed, profile }) {
    const [questions, setQuestions] = useState([]);
    const [loading, setLoading] = useState(true);
    const [idx, setIdx] = useState(0);
    const [answers, setAnswers] = useState({});
    const [submitted, setSubmitted] = useState(false);
    const [score, setScore] = useState(null);
    const [saving, setSaving] = useState(false);
    const [certClaimed, setCertClaimed] = useState(false);

    useEffect(() => {
      (async () => {
        const sb = await getSupabase();
        if (!sb) { setLoading(false); return; }
        const { data } = await sb.from('quiz_questions').select('*').eq('quiz_id', quiz.id).order('sort_order');
        setQuestions(data || []);
        setLoading(false);
      })();
    }, [quiz.id]);

    const q = questions[idx];
    const total = questions.length;
    const pct = total ? Math.round((idx / total) * 100) : 0;

    const submit = async () => {
      const correct = questions.filter(q => answers[q.id] === q.correct_option_id).length;
      const sc = Math.round((correct / total) * 100);
      setScore(sc);
      setSubmitted(true);
      const sb = await getSupabase();
      if (sb) {
        const { data: { user } } = await sb.auth.getUser();
        await sb.from('quiz_attempts').insert({
          user_id: user.id, quiz_id: quiz.id, certification_id: cert.id,
          answers, score: sc, passed: sc >= quiz.passing_score,
          started_at: new Date().toISOString(), completed_at: new Date().toISOString()
        });
      }
    };

    const claimCertificate = async () => {
      setSaving(true);
      const sb = await getSupabase();
      if (sb) {
        const { data: { user } } = await sb.auth.getUser();
        const { data: prof } = await sb.from('profiles').select('full_name').eq('id', user.id).maybeSingle();
        const certNum = 'CFA-' + Date.now().toString(36).toUpperCase();
        const { data: comp } = await sb.from('certification_completions').upsert({
          user_id: user.id, certification_id: cert.id,
          artifact_submitted: false, completed_at: new Date().toISOString(),
          certificate_number: certNum
        }, { onConflict: 'user_id,certification_id' }).select().maybeSingle();
        if (comp) {
          await sb.from('certificates').upsert({
            user_id: user.id, certification_id: cert.id, completion_id: comp.id,
            recipient_name: prof?.full_name || user.email,
            cert_title: cert.title, cert_number: certNum, score, issued_at: new Date().toISOString()
          }, { onConflict: 'cert_number' });
        }
        setCertClaimed(true);
        onPassed && onPassed();
      }
      setSaving(false);
    };

    if (loading) return <div className="text-center py-20 text-gray-400">Loading quiz…</div>;

    if (submitted) {
      const passed = score >= quiz.passing_score;
      return (
        <main className="max-w-3xl mx-auto px-4 py-10 fade-in">
          <div className={`rounded-2xl p-8 mb-8 text-center ${passed ? 'bg-green-50 border border-green-200' : 'bg-red-50 border border-red-200'}`}>
            <div className={`text-5xl font-black mb-2 ${passed ? 'text-green-600' : 'text-red-500'}`}>{score}%</div>
            <div className={`text-xl font-bold mb-1 ${passed ? 'text-green-700' : 'text-red-600'}`}>{passed ? '🎉 You passed!' : 'Not quite — keep learning'}</div>
            <div className="text-sm text-gray-500">Required: {quiz.passing_score}% · Your score: {score}%</div>
          </div>
          {passed && !certClaimed && (
            <div className="text-center mb-8">
              <button onClick={claimCertificate} disabled={saving}
                className="px-8 py-3 bg-[#F97316] text-white font-bold rounded-xl hover:bg-orange-600 transition-colors disabled:opacity-50">
                {saving ? 'Claiming…' : '🏆 Claim Your Certificate'}
              </button>
            </div>
          )}
          {certClaimed && <div className="text-center text-green-600 font-semibold mb-8">✓ Certificate claimed! View it in your Dashboard.</div>}
          <div className="space-y-4">
            {questions.map((q, i) => {
              const userAns = answers[q.id];
              const correct = userAns === q.correct_option_id;
              return (
                <div key={q.id} className={`p-5 rounded-xl border ${correct ? 'border-green-200 bg-green-50' : 'border-red-200 bg-red-50'}`}>
                  <div className="font-semibold text-sm text-[#0F1631] mb-2">{i+1}. {q.question_text}</div>
                  <div className="text-sm mb-2">
                    {(q.options||[]).map(opt => (
                      <div key={opt.id} className={`py-0.5 ${opt.id === q.correct_option_id ? 'text-green-700 font-semibold' : opt.id === userAns && !correct ? 'text-red-600 line-through' : 'text-gray-500'}`}>
                        {opt.id.toUpperCase()}. {opt.text}
                      </div>
                    ))}
                  </div>
                  {q.explanation && <div className="text-xs text-gray-600 bg-white/60 rounded p-2">{q.explanation}</div>}
                </div>
              );
            })}
          </div>
          <div className="mt-8 text-center">
            <button onClick={onBack} className="px-6 py-2 border border-gray-200 text-gray-600 text-sm rounded-lg hover:bg-gray-50 transition-colors">
              ← Back to Certification
            </button>
          </div>
        </main>
      );
    }

    if (!q) return null;
    return (
      <main className="max-w-2xl mx-auto px-4 py-10 fade-in">
        <div className="mb-6">
          <div className="flex justify-between text-xs text-gray-500 mb-1"><span>Question {idx+1} of {total}</span><span>{pct}%</span></div>
          <div className="h-1.5 bg-gray-100 rounded-full"><div className="h-1.5 bg-[#2D1FB1] rounded-full transition-all" style={{ width: `${pct}%` }}/></div>
        </div>
        <div className="bg-white rounded-2xl border border-gray-200 p-8 mb-4">
          <div className="text-lg font-bold text-[#0F1631] mb-6 leading-snug">{q.question_text}</div>
          <div className="space-y-3">
            {(q.options||[]).map(opt => (
              <button key={opt.id} onClick={() => setAnswers(a => ({ ...a, [q.id]: opt.id }))}
                className={`w-full text-left px-4 py-3.5 rounded-xl border text-sm font-medium transition-all ${answers[q.id] === opt.id ? 'bg-[#2D1FB1] border-[#2D1FB1] text-white' : 'bg-white border-gray-200 text-gray-700 hover:border-[#2D1FB1]'}`}>
                <span className="font-bold mr-2">{opt.id.toUpperCase()}.</span> {opt.text}
              </button>
            ))}
          </div>
        </div>
        <div className="flex justify-between">
          <button onClick={() => setIdx(i => Math.max(0, i-1))} disabled={idx === 0}
            className="px-4 py-2 text-sm text-gray-500 border border-gray-200 rounded-lg hover:bg-gray-50 disabled:opacity-30 transition-colors">← Previous</button>
          {idx < total - 1 ? (
            <button onClick={() => setIdx(i => i+1)} disabled={!answers[q.id]}
              className="px-6 py-2 bg-[#2D1FB1] text-white text-sm font-bold rounded-lg hover:bg-indigo-700 disabled:opacity-30 transition-colors">Next →</button>
          ) : (
            <button onClick={submit} disabled={Object.keys(answers).length < total}
              className="px-6 py-2 bg-[#F97316] text-white text-sm font-bold rounded-lg hover:bg-orange-600 disabled:opacity-30 transition-colors">Submit Quiz</button>
          )}
        </div>
      </main>
    );
  }

  // ─── Student Dashboard ───────────────────────────────────────────────────

          sb.from('certifications').select('*').eq('status','approved').order('cert_number'),

        setProgress(p || []);

        setMyCerts(myCerts || []);

    const completed = certs.filter(c => completedCertIds.has(c.id));

    const lessonsPct = (cert) => {
      const certProgress = progress.filter(p => p.certification_id === cert.id && p.status === 'completed');
      return certProgress.length;
    };

    if (loading) return <div className="text-center py-20 text-gray-400">Loading your dashboard…</div>;

    if (viewingCert) {
      return <CertificateView cert={viewingCert} onClose={() => setViewingCert(null)} />;
    }

    return (
      <main className="max-w-5xl mx-auto px-4 py-10 fade-in">
        <div className="flex items-start justify-between mb-8">
          <div>
            <h1 className="text-3xl font-bold text-[#0F1631] mb-1">Welcome back{profile?.full_name ? `, ${profile.full_name.split(' ')[0]}` : ''}!</h1>
            <p className="text-gray-500 text-sm">{user?.email} · Student</p>
          </div>
          <button onClick={onSignOut} className="px-4 py-2 border border-gray-200 text-gray-500 text-sm rounded-lg hover:bg-gray-50 transition-colors">Sign Out</button>

  // ─── Admin Dashboard ─────────────────────────────────────────────────────
  function AdminDashboard({ user, profile, onSignOut }) {
    const [tab, setTab] = useState('certifications');
    const [certs, setCerts] = useState([]);
    const [students, setStudents] = useState([]);
    const [draftLessons, setDraftLessons] = useState([]);
    const [loading, setLoading] = useState(true);
    const [approving, setApproving] = useState({});

    useEffect(() => {
      (async () => {
        const sb = await getSupabase();
        if (!sb) { setLoading(false); return; }
        const [{ data: c }, { data: s }, { data: dl }] = await Promise.all([
          sb.from('certifications').select('*').order('cert_number'),
          sb.from('profiles').select('id,full_name,email,role,created_at').in('role', ['student','organization_owner','organization_manager']).order('created_at', { ascending: false }),
          sb.from('lessons').select('*, modules(title, certifications(title))').in('status', ['draft','review']).order('created_at', { ascending: false })
        ]);
        setCerts(c || []);
        setStudents(s || []);
        setDraftLessons(dl || []);
        setLoading(false);
      })();
    }, []);

    const approveCert = async (cert) => {
      setApproving(a => ({ ...a, [cert.id]: true }));
      const sb = await getSupabase();
      if (sb) {
        await sb.from('certifications').update({ status: 'approved' }).eq('id', cert.id);
        setCerts(prev => prev.map(c => c.id === cert.id ? { ...c, status: 'approved' } : c));
      }
      setApproving(a => ({ ...a, [cert.id]: false }));
    };

    const approveLesson = async (lesson) => {
      setApproving(a => ({ ...a, [lesson.id]: true }));
      const sb = await getSupabase();
      if (sb) {
        await sb.from('lessons').update({ status: 'approved', reviewed_at: new Date().toISOString() }).eq('id', lesson.id);
        setDraftLessons(prev => prev.filter(l => l.id !== lesson.id));
      }
      setApproving(a => ({ ...a, [lesson.id]: false }));
    };

    const draftCount = certs.filter(c => c.status !== 'approved').length;

    return (
      <main className="max-w-6xl mx-auto px-4 py-10 fade-in">
        <div className="flex items-start justify-between mb-8">
          <div>
            <h1 className="text-3xl font-bold text-[#0F1631] mb-1">Admin Dashboard</h1>
            <p className="text-gray-500 text-sm">{user?.email} · {profile?.role?.replace('_',' ')}</p>
          </div>
          <button onClick={onSignOut} className="px-4 py-2 border border-gray-200 text-gray-500 text-sm rounded-lg hover:bg-gray-50 transition-colors">Sign Out</button>
        </div>
        <div className="flex gap-1 border-b border-gray-200 mb-8">
          {[['certifications','Certifications'],['students','Students'],['review','Content Review'],['commerce','Offers & Orders']].map(([id,label]) => (
            <button key={id} onClick={() => setTab(id)}
              className={`px-5 py-3 text-sm font-semibold border-b-2 transition-colors ${tab===id ? 'border-[#2D1FB1] text-[#2D1FB1]' : 'border-transparent text-gray-500 hover:text-[#0F1631]'}`}>
              {label}
              {id==='certifications' && draftCount > 0 && <span className="ml-2 bg-amber-100 text-amber-700 text-xs px-1.5 py-0.5 rounded-full">{draftCount}</span>}
              {id==='review' && draftLessons.length > 0 && <span className="ml-2 bg-amber-100 text-amber-700 text-xs px-1.5 py-0.5 rounded-full">{draftLessons.length}</span>}
            </button>
          ))}
        </div>
        {loading ? <div className="text-center py-20 text-gray-400">Loading…</div> : (<>
          {tab === 'certifications' && (
            <div className="space-y-2">
              {certs.map(cert => (
                <div key={cert.id} className="bg-white border border-gray-200 rounded-xl p-5 flex items-center gap-4">
                  <span className="font-black text-gray-300 text-lg w-8">{String(cert.cert_number).padStart(2,'0')}</span>
                  <div className="flex-1">
                    <div className="font-semibold text-[#0F1631] text-sm">{cert.title}</div>
                    <div className="text-xs text-gray-400">{cert.hours_min}–{cert.hours_max}h</div>
                  </div>
                  {cert.status === 'approved'
                    ? <span className="text-xs px-3 py-1 rounded-full bg-green-50 text-green-700 font-semibold">Approved</span>
                    : <div className="flex items-center gap-2">
                        <span className="text-xs px-3 py-1 rounded-full bg-amber-50 text-amber-700 font-semibold">Draft</span>
                        <button onClick={() => approveCert(cert)} disabled={approving[cert.id]}
                          className="text-xs px-3 py-1.5 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700 disabled:opacity-50 transition-colors">
                          {approving[cert.id] ? 'Approving…' : 'Approve'}
                        </button>
                      </div>
                  }
                </div>
              ))}
            </div>
          )}
          {tab === 'students' && (
            <div className="space-y-2">
              {students.length === 0 && <div className="text-center py-12 text-gray-400">No students enrolled yet.</div>}
              {students.map(s => (
                <div key={s.id} className="bg-white border border-gray-200 rounded-xl p-5 flex items-center gap-4">
                  <div className="w-9 h-9 rounded-full bg-[#2D1FB1] text-white flex items-center justify-center font-bold text-sm flex-shrink-0">
                    {(s.full_name || s.email || '?')[0].toUpperCase()}
                  </div>
                  <div className="flex-1">
                    <div className="font-semibold text-[#0F1631] text-sm">{s.full_name || s.email}</div>
                    <div className="text-xs text-gray-400">{s.email} · {s.role}</div>
                  </div>
                  <div className="text-xs text-gray-400">{new Date(s.created_at).toLocaleDateString()}</div>
                </div>
              ))}
            </div>
          )}
          {tab === 'review' && (
            <div className="space-y-3">
              {draftLessons.length === 0 && <div className="text-center py-12 text-gray-400">No lessons pending review.</div>}
              {draftLessons.map(lesson => (
                <div key={lesson.id} className="bg-white border border-amber-200 rounded-xl p-5 flex items-center gap-4">
                  <div className="flex-1">
                    <div className="font-semibold text-[#0F1631] text-sm">{lesson.title}</div>
                    <div className="text-xs text-gray-400 mt-0.5">
                      {lesson.modules?.certifications?.title} › {lesson.modules?.title}
                    </div>
                  </div>
                  <span className="text-xs px-2.5 py-1 rounded-full bg-amber-50 text-amber-700 font-semibold capitalize">{lesson.status}</span>
                  <button onClick={() => approveLesson(lesson)} disabled={approving[lesson.id]}
                    className="text-xs px-3 py-1.5 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700 disabled:opacity-50 transition-colors">
                    {approving[lesson.id] ? 'Approving…' : 'Approve'}
                  </button>
                </div>
              ))}
            </div>
          )}
          {tab === 'commerce' && <AdminOffersManager />}
        </>)}
      </main>
    );
  }

              <h2 className="text-3xl font-bold text-white mb-4">Download the Free RMAP Evidence Checklist</h2>
              <p className="text-indigo-200 leading-relaxed">
                Know exactly what USDA reviewers look for before you submit. Our evidence checklist maps every scoring criterion from 7 CFR 4280.316.
              </p>
            </div>
            <div className="bg-white rounded-2xl p-8 shadow-xl">
              <LeadCaptureForm />
            </div>
          </div>
        </section>

        {/* 6. Pricing */}
        <section id="pricing" className="py-20 px-4 bg-[#F8FAFC]">
          <div className="max-w-6xl mx-auto">
            <div className="text-center mb-12">
              <h2 className="text-3xl font-bold text-[#0F1631] mb-3">Pricing</h2>
              <p className="text-gray-600 max-w-xl mx-auto">Start with what you need. Scale as your program grows.</p>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
              {PRICING_TIERS.map((tier, i) => (
                <div
                  key={i}
                  className={`bg-white rounded-2xl p-6 shadow-sm flex flex-col border-2 ${tier.featured ? 'border-[#F97316] shadow-lg' : 'border-gray-100'}`}
                >
                  {tier.featured && (
                    <div className="text-center mb-3">
                      <span className="text-xs font-bold bg-[#F97316] text-white px-3 py-1 rounded-full uppercase tracking-wider">Most Popular</span>
                    </div>
                  )}
                  <h3 className="font-bold text-[#0F1631] text-base mb-1">{tier.name}</h3>
                  <div className="text-2xl font-extrabold text-[#2D1FB1] mb-3">{tier.price}</div>
                  <p className="text-sm text-gray-500 leading-relaxed mb-6 flex-1">{tier.desc}</p>
                  <button
                    onClick={() => tier.contact && (window.location.href = 'mailto:support@capfundacademy.com')}
                    className={`w-full py-2.5 px-4 font-semibold text-sm rounded-xl transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-[#2D1FB1] ${tier.ctaStyle}`}
                  >
                    {tier.cta}
                  </button>
                </div>
              ))}
            </div>
          </div>
        </section>

        {/* 7. FAQ */}
        <section className="py-20 px-4 bg-white">
          <div className="max-w-3xl mx-auto">
            <div className="text-center mb-12">
              <h2 className="text-3xl font-bold text-[#0F1631] mb-3">Frequently Asked Questions</h2>
            </div>
            <div className="divide-y divide-gray-200">
              {FAQS.map((faq, i) => <FAQItem key={i} q={faq.q} a={faq.a} />)}
            </div>
          </div>
        </section>

        {/* 8. Final CTA */}
        <section className="py-20 px-4 bg-[#2D1FB1]">
          <div className="max-w-3xl mx-auto text-center">
            <h2 className="text-3xl font-bold text-white mb-4">Ready to Build a USDA-Ready Microlending Program?</h2>
            <p className="text-indigo-200 mb-8 text-lg">
              Start with Cert 1 — a free preview of the Rural Microfinance Associate track.
            </p>
            <button className="px-10 py-4 bg-[#F97316] text-white font-bold rounded-xl hover:bg-orange-600 transition-colors text-base shadow-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-white">
              Start with Cert 1 Free Preview
            </button>
          </div>
        </section>
      </main>
    );
  }

  // ─── Application Workspace ───────────────────────────────────────────────
  const PROGRAM_LABELS = {
    rmap: 'USDA RMAP — Rural Microentrepreneur Assistance',
    rbdg: 'USDA RBDG — Rural Business Development Grant',
    irp:  'IRP — Intermediary Relending Program',
    rlf_ops: 'RLF Operational Readiness Review',
    full_binder: 'Full Application Binder Gap Analysis',
  };

  const READINESS_COLORS = {
    not_ready:        { bg: 'bg-red-50',    text: 'text-red-700',    border: 'border-red-200',    label: 'Not Ready' },
    emerging:         { bg: 'bg-orange-50', text: 'text-orange-700', border: 'border-orange-200', label: 'Emerging' },
    competitive:      { bg: 'bg-yellow-50', text: 'text-yellow-700', border: 'border-yellow-200', label: 'Competitive' },
    strong:           { bg: 'bg-blue-50',   text: 'text-blue-700',   border: 'border-blue-200',   label: 'Strong' },
    submission_ready: { bg: 'bg-green-50',  text: 'text-green-700',  border: 'border-green-200',  label: 'Submission Ready' },
  };

  function ApplicationWorkspace({ user, profile, onBack }) {
    const [step, setStep] = useState('list'); // list | create | workspace | scoring | results
    const [workspaces, setWorkspaces] = useState([]);
    const [activeWS, setActiveWS]     = useState(null);
    const [criteria, setCriteria]     = useState([]);
    const [answers, setAnswers]       = useState({});
    const [evidence, setEvidence]     = useState([]);
    const [scoringResult, setScoringResult] = useState(null);
    const [priorResults, setPriorResults]   = useState([]);
    const [loading, setLoading]   = useState(true);
    const [scoring, setScoring]   = useState(false);
    const [scoreError, setScoreError] = useState('');
    const [context, setContext]   = useState('');
    const [uploading, setUploading] = useState(false);
    const [newWS, setNewWS] = useState({ program_type: 'rmap', title: '', applicant_name: '', fiscal_year: new Date().getFullYear() });

    useEffect(() => {
      loadWorkspaces();
    }, []);

    const loadWorkspaces = async () => {
      setLoading(true);
      const sb = await getSupabase();
      if (!sb) { setLoading(false); return; }
      const { data } = await sb.from('application_workspaces').select('*').order('updated_at', { ascending: false });
      setWorkspaces(data || []);
      setLoading(false);
    };

    const createWorkspace = async () => {
      if (!newWS.title.trim()) return;
      const sb = await getSupabase();
      if (!sb) return;
      const { data } = await sb.from('application_workspaces').insert({
        user_id: user.id, ...newWS, title: newWS.title.trim()
      }).select().single();
      if (data) { await openWorkspace(data); }
    };

    const openWorkspace = async (ws) => {
      setActiveWS(ws);
      setLoading(true);
      const sb = await getSupabase();
      if (!sb) { setLoading(false); return; }
      const [{ data: rubric }, { data: ans }, { data: ev }, { data: results }] = await Promise.all([
        sb.from('scoring_rubrics').select('id').eq('program_type', ws.program_type).eq('is_active', true).order('version', { ascending: false }).limit(1).maybeSingle(),
        sb.from('application_answers').select('*').eq('workspace_id', ws.id),
        sb.from('evidence_files').select('*').eq('workspace_id', ws.id),
        sb.from('scoring_results').select('*, scoring_runs(started_at, model_used)').eq('workspace_id', ws.id).order('created_at', { ascending: false }).limit(5)
      ]);
      if (rubric) {
        const { data: crit } = await sb.from('scoring_criteria').select('*').eq('rubric_id', rubric.id).order('sort_order');
        setCriteria(crit || []);
      }
      const amap = {}; (ans || []).forEach(a => { amap[a.criterion_id] = a.answer_text || ''; });
      setAnswers(amap);
      setEvidence(ev || []);
      setPriorResults(results || []);
      setScoringResult(results?.[0] || null);
      setLoading(false);
      setStep('workspace');
    };

    const saveAnswer = async (criterionId, text) => {
      setAnswers(a => ({ ...a, [criterionId]: text }));
      const sb = await getSupabase();
      if (!sb) return;
      await sb.from('application_answers').upsert({
        workspace_id: activeWS.id, criterion_id: criterionId, answer_text: text, updated_at: new Date().toISOString()
      }, { onConflict: 'workspace_id,criterion_id' });
    };

    const uploadEvidence = async (file, criterionId) => {
      setUploading(true);
      const sb = await getSupabase();
      if (!sb) { setUploading(false); return; }
      try {
        const { data: { session } } = await sb.auth.getSession();
        const res = await fetch('/.netlify/functions/sign-upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
          body: JSON.stringify({ workspace_id: activeWS.id, file_name: file.name, mime_type: file.type, file_size: file.size })
        });
        const { signed_url, path } = await res.json();
        await fetch(signed_url, { method: 'PUT', body: file, headers: { 'Content-Type': file.type } });
        const { data: ef } = await sb.from('evidence_files').insert({
          workspace_id: activeWS.id, user_id: user.id, file_name: file.name,
          file_path: path, file_size: file.size, mime_type: file.type,
          label: file.name, criterion_id: criterionId || null
        }).select().single();
        if (ef) setEvidence(prev => [...prev, ef]);
      } catch (e) { alert('Upload failed: ' + e.message); }
      setUploading(false);
    };

    const runScoring = async () => {
      setScoring(true); setScoreError('');
      const sb = await getSupabase();
      if (!sb) { setScoring(false); return; }
      try {
        const { data: { session } } = await sb.auth.getSession();
        const res = await fetch('/.netlify/functions/ai-scoring', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
          body: JSON.stringify({ workspace_id: activeWS.id, context })
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
        setScoringResult({ ...json.result, created_at: new Date().toISOString() });
        setPriorResults(prev => [{ ...json.result, created_at: new Date().toISOString() }, ...prev]);
        setStep('results');
      } catch (e) { setScoreError(e.message); }
      setScoring(false);
    };

    // Group criteria by section
    const sections = criteria.reduce((acc, c) => {
      if (!acc[c.section_code]) acc[c.section_code] = { label: c.section_label, items: [] };
      acc[c.section_code].items.push(c);
      return acc;
    }, {});

    if (loading && step !== 'list') return <div className="text-center py-20 text-gray-400">Loading workspace…</div>;

    // LIST view
    if (step === 'list') return (
      <main className="max-w-4xl mx-auto px-4 py-10 fade-in">
        <button onClick={onBack} className="text-sm text-gray-500 hover:text-[#2D1FB1] mb-6 flex items-center gap-1">← Dashboard</button>
        <div className="flex items-center justify-between mb-6">
          <div>
            <h1 className="text-3xl font-bold text-[#0F1631] mb-1">AI Scoring Engine</h1>
            <p className="text-gray-500 text-sm">Score your RMAP, RBDG, or IRP application readiness against the exact federal criteria.</p>
          </div>
          <button onClick={() => setStep('create')} className="px-5 py-2.5 bg-[#F97316] text-white font-bold rounded-xl hover:bg-orange-600 transition-colors text-sm">+ New Workspace</button>
        </div>
        <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 mb-6 text-xs text-amber-800 leading-relaxed">
          <strong>Advisory tool only.</strong> AI scoring estimates are based on publicly available federal criteria. Results do not represent USDA's review or determination and do not guarantee funding, eligibility, or approval.
        </div>
        {loading ? <div className="text-center py-12 text-gray-400">Loading…</div> : workspaces.length === 0 ? (
          <div className="bg-white border border-gray-200 rounded-2xl p-12 text-center">
            <div className="text-4xl mb-4">📋</div>
            <div className="font-bold text-[#0F1631] mb-2">No workspaces yet</div>
            <p className="text-gray-500 text-sm mb-5">Create a workspace for each application you're preparing.</p>
            <button onClick={() => setStep('create')} className="px-6 py-2.5 bg-[#2D1FB1] text-white font-bold rounded-xl hover:bg-indigo-700 transition-colors text-sm">Create First Workspace</button>
          </div>
        ) : (
          <div className="space-y-3">
            {workspaces.map(ws => (
              <div key={ws.id} className="bg-white border border-gray-200 rounded-xl p-5 hover:shadow-md transition-shadow cursor-pointer flex items-center gap-4" onClick={() => openWorkspace(ws)}>
                <div className="w-10 h-10 rounded-lg bg-[#2D1FB1] text-white flex items-center justify-center text-xs font-black flex-shrink-0">{ws.program_type.toUpperCase().slice(0,4)}</div>
                <div className="flex-1">
                  <div className="font-bold text-[#0F1631]">{ws.title}</div>
                  <div className="text-xs text-gray-400 mt-0.5">{PROGRAM_LABELS[ws.program_type]} · FY {ws.fiscal_year}</div>
                </div>
                <span className="text-[#2D1FB1] text-sm font-semibold">Open →</span>
              </div>
            ))}
          </div>
        )}
      </main>
    );

    // CREATE view
    if (step === 'create') return (
      <main className="max-w-2xl mx-auto px-4 py-10 fade-in">
        <button onClick={() => setStep('list')} className="text-sm text-gray-500 hover:text-[#2D1FB1] mb-6 flex items-center gap-1">← Back</button>
        <h2 className="text-2xl font-bold text-[#0F1631] mb-6">New Application Workspace</h2>
        <div className="bg-white border border-gray-200 rounded-2xl p-6 space-y-4">
          <div>
            <label className="block text-xs font-semibold text-gray-600 mb-1">Program Type</label>
            <select value={newWS.program_type} onChange={e => setNewWS(w => ({ ...w, program_type: e.target.value }))}
              className="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#2D1FB1]">
              {Object.entries(PROGRAM_LABELS).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
            </select>
          </div>
          <div>
            <label className="block text-xs font-semibold text-gray-600 mb-1">Workspace Title</label>
            <input value={newWS.title} onChange={e => setNewWS(w => ({ ...w, title: e.target.value }))}
              className="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#2D1FB1]"
              placeholder="e.g. Our Organization RMAP 2026 Application" />
          </div>
          <div>
            <label className="block text-xs font-semibold text-gray-600 mb-1">Applicant Organization Name</label>
            <input value={newWS.applicant_name} onChange={e => setNewWS(w => ({ ...w, applicant_name: e.target.value }))}
              className="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#2D1FB1]"
              placeholder="Legal name of your organization" />
          </div>
          <div>
            <label className="block text-xs font-semibold text-gray-600 mb-1">Federal Fiscal Year</label>
            <input type="number" value={newWS.fiscal_year} onChange={e => setNewWS(w => ({ ...w, fiscal_year: parseInt(e.target.value) }))}
              className="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#2D1FB1]" />
          </div>
          <div className="flex gap-3 pt-2">
            <button onClick={() => setStep('list')} className="flex-1 py-2.5 border border-gray-200 text-gray-600 rounded-xl text-sm hover:bg-gray-50 transition-colors">Cancel</button>
            <button onClick={createWorkspace} disabled={!newWS.title.trim()}
              className="flex-1 py-2.5 bg-[#2D1FB1] text-white font-bold rounded-xl text-sm hover:bg-indigo-700 disabled:opacity-40 transition-colors">Create Workspace</button>
          </div>
        </div>
      </main>
    );

    // WORKSPACE view
    if (step === 'workspace' || step === 'scoring') return (
      <main className="max-w-5xl mx-auto px-4 py-10 fade-in">
        <button onClick={() => { setStep('list'); setActiveWS(null); }} className="text-sm text-gray-500 hover:text-[#2D1FB1] mb-4 flex items-center gap-1">← All Workspaces</button>
        <div className="flex items-start justify-between gap-4 mb-6">
          <div>
            <h1 className="text-2xl font-bold text-[#0F1631]">{activeWS?.title}</h1>
            <p className="text-sm text-gray-500">{PROGRAM_LABELS[activeWS?.program_type]} · FY {activeWS?.fiscal_year}</p>
          </div>
          <div className="flex gap-2">
            {scoringResult && <button onClick={() => setStep('results')} className="px-4 py-2 border border-[#2D1FB1] text-[#2D1FB1] text-sm font-semibold rounded-lg hover:bg-blue-50 transition-colors">View Last Score</button>}
            <button onClick={runScoring} disabled={scoring}
              className="px-5 py-2 bg-[#F97316] text-white text-sm font-bold rounded-lg hover:bg-orange-600 disabled:opacity-50 transition-colors flex items-center gap-2">
              {scoring ? '⏳ Scoring…' : '🤖 Run AI Score'}
            </button>
          </div>
        </div>
        {scoreError && <div className="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700">{scoreError}</div>}
        <div className="mb-4 bg-amber-50 border border-amber-100 rounded-xl p-3 text-xs text-amber-700">
          Answer each question as completely as possible. Upload supporting documents below each section. Then click "Run AI Score."
        </div>

        {/* Evidence upload (global) */}
        <div className="bg-white border border-gray-200 rounded-xl p-5 mb-6">
          <div className="font-semibold text-[#0F1631] mb-3 text-sm">📎 Evidence Files ({evidence.length} uploaded)</div>
          <label className="flex items-center gap-2 cursor-pointer text-sm text-[#2D1FB1] font-semibold hover:underline">
            {uploading ? '⏳ Uploading…' : '+ Upload document'}
            <input type="file" className="sr-only" disabled={uploading} accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.txt,.csv"
              onChange={e => { const f = e.target.files?.[0]; if (f) uploadEvidence(f, null); e.target.value = ''; }} />
          </label>
          {evidence.length > 0 && (
            <div className="mt-3 space-y-1">
              {evidence.map(ef => (
                <div key={ef.id} className="flex items-center gap-2 text-xs text-gray-600">
                  <span>📄</span><span>{ef.label || ef.file_name}</span>
                  <span className="text-gray-400">({ef.file_size ? (ef.file_size/1024).toFixed(0)+'KB' : ''})</span>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Criteria by section */}
        {Object.entries(sections).map(([sectionCode, section]) => (
          <div key={sectionCode} className="mb-6">
            <div className="bg-[#2D1FB1] text-white px-5 py-3 rounded-t-xl">
              <div className="text-xs font-mono opacity-70">{sectionCode}</div>
              <div className="font-bold">{section.label}</div>
            </div>
            <div className="bg-white border border-t-0 border-gray-200 rounded-b-xl divide-y divide-gray-100">
              {section.items.map(criterion => (
                <div key={criterion.id} className="p-5">
                  <div className="flex items-start justify-between gap-4 mb-2">
                    <div>
                      <span className="text-xs font-mono bg-gray-100 px-1.5 py-0.5 rounded mr-2">{criterion.criterion_code}</span>
                      <span className="font-semibold text-sm text-[#0F1631]">{criterion.criterion_label}</span>
                    </div>
                    <span className="text-xs font-bold text-[#2D1FB1] flex-shrink-0">Max {criterion.max_points} pts</span>
                  </div>
                  <p className="text-xs text-gray-500 mb-2 leading-relaxed">{criterion.description}</p>
                  {criterion.evidence_hint && (
                    <div className="text-xs text-gray-400 mb-2 bg-gray-50 rounded p-2">
                      <strong>Evidence needed:</strong> {criterion.evidence_hint}
                    </div>
                  )}
                  <textarea
                    value={answers[criterion.id] || ''}
                    onChange={e => saveAnswer(criterion.id, e.target.value)}
                    placeholder="Describe what you have for this criterion. Be specific — include numbers, dates, and details the AI can evaluate…"
                    rows={3}
                    className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#2D1FB1] resize-none"
                  />
                </div>
              ))}
            </div>
          </div>
        ))}

        {/* Context */}
        <div className="bg-white border border-gray-200 rounded-xl p-5 mb-6">
          <div className="font-semibold text-sm text-[#0F1631] mb-2">Additional context for the AI (optional)</div>
          <textarea value={context} onChange={e => setContext(e.target.value)} rows={3}
            className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#2D1FB1] resize-none"
            placeholder="Any context that doesn't fit the questions above: your submission timeline, specific USDA state office, prior application history, etc." />
        </div>

        <div className="text-center">
          <button onClick={runScoring} disabled={scoring}
            className="px-10 py-3.5 bg-[#F97316] text-white font-bold rounded-xl hover:bg-orange-600 disabled:opacity-50 transition-colors text-base">
            {scoring ? '⏳ Running AI Score…' : '🤖 Run AI Score Now'}
          </button>
          <p className="text-xs text-gray-400 mt-2">Advisory only · Results do not represent USDA determination</p>
        </div>
      </main>
    );

    // RESULTS view
    if (step === 'results' && scoringResult) {
      const r = scoringResult;
      const rl = READINESS_COLORS[r.readiness_level] || READINESS_COLORS.emerging;
      const pct = r.max_possible_score ? Math.round((r.total_score_estimate / r.max_possible_score) * 100) : 0;
      return (
        <main className="max-w-4xl mx-auto px-4 py-10 fade-in">
          <div className="flex items-center justify-between mb-6">
            <button onClick={() => setStep('workspace')} className="text-sm text-gray-500 hover:text-[#2D1FB1] flex items-center gap-1">← Back to Workspace</button>
            <button onClick={() => window.print()} className="px-4 py-2 border border-gray-200 text-gray-600 text-sm rounded-lg hover:bg-gray-50 transition-colors">🖨 Print Report</button>
          </div>

          {/* Score header */}
          <div className={`rounded-2xl p-8 mb-6 text-center border ${rl.bg} ${rl.border}`}>
            <div className={`text-6xl font-black mb-1 ${rl.text}`}>{r.total_score_estimate}<span className="text-2xl font-bold opacity-60">/{r.max_possible_score}</span></div>
            <div className={`text-xl font-bold mb-2 ${rl.text}`}>{rl.label}</div>
            <div className="w-full bg-white/60 rounded-full h-3 max-w-sm mx-auto mb-3">
              <div className={`h-3 rounded-full ${rl.text.replace('text-','bg-')}`} style={{ width: `${pct}%` }}/>
            </div>
            {r.readiness_level_explanation && <p className="text-sm text-gray-600">{r.readiness_level_explanation}</p>}
          </div>

          {/* Section scores */}
          {Object.keys(r.section_scores || {}).length > 0 && (
            <div className="bg-white border border-gray-200 rounded-xl p-5 mb-5">
              <div className="font-bold text-[#0F1631] mb-3">Section Scores</div>
              <div className="space-y-3">
                {Object.entries(r.section_scores).map(([code, s]) => (
                  <div key={code}>
                    <div className="flex justify-between text-sm mb-1">
                      <span className="font-medium text-gray-700">{s.label || code}</span>
                      <span className="font-bold text-[#0F1631]">{s.score}/{s.max}</span>
                    </div>
                    <div className="h-2 bg-gray-100 rounded-full">
                      <div className="h-2 bg-[#2D1FB1] rounded-full" style={{ width: `${s.pct || (s.score/s.max*100)}%` }}/>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Plain English Summary */}
          {r.plain_english_summary && (
            <div className="bg-blue-50 border border-blue-100 rounded-xl p-5 mb-5">
              <div className="font-bold text-[#0F1631] mb-2">📝 Summary</div>
              <div className="text-sm text-gray-700 leading-relaxed whitespace-pre-line">{r.plain_english_summary}</div>
            </div>
          )}

          <div className="grid md:grid-cols-2 gap-4 mb-5">
            {r.strengths?.length > 0 && (
              <div className="bg-green-50 border border-green-100 rounded-xl p-5">
                <div className="font-bold text-green-800 mb-2">✅ Strengths</div>
                <ul className="space-y-1">{r.strengths.map((s,i) => <li key={i} className="text-sm text-green-700">• {s}</li>)}</ul>
