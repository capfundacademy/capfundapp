  // ─── Admin Blog Manager ───────────────────────────────────────────────────
  function AdminBlogManager() {
    const [posts, setPosts]     = useState([]);
    const [editing, setEditing] = useState(null);
    const [form, setForm]       = useState({ title:'', slug:'', category:'rmap-readiness', excerpt:'', content:'', meta_title:'', meta_description:'', featured: false, status:'draft' });
    const [saving, setSaving]   = useState(false);
    const [loading, setLoading] = useState(true);

    const load = async () => {
      const sb = await getSupabase();
      if (!sb) return;
      const { data } = await sb.from('blog_posts').select('id,title,slug,category,status,featured,published_at').order('created_at', { ascending: false });
      setPosts(data || []);
      setLoading(false);
    };

    useEffect(() => { load(); }, []);

    const openNew = () => {
      setForm({ title:'', slug:'', category:'rmap-readiness', excerpt:'', content:'', meta_title:'', meta_description:'', featured: false, status:'draft' });
      setEditing('new');
    };

    const openEdit = async (post) => {
      const sb = await getSupabase();
      const { data } = await sb.from('blog_posts').select('*').eq('id', post.id).single();
      setForm(data || {});
      setEditing(post.id);
    };

    const save = async () => {
      setSaving(true);
      const sb = await getSupabase();
      if (!sb) { setSaving(false); return; }
      const payload = { ...form, published_at: form.status === 'published' ? (form.published_at || new Date().toISOString()) : null };
      if (editing === 'new') {
        await sb.from('blog_posts').insert(payload);
      } else {
        await sb.from('blog_posts').update(payload).eq('id', editing);
      }
      setSaving(false);
      setEditing(null);
      load();
    };

    const deletePost = async (id) => {
      if (!confirm('Delete this post?')) return;
      const sb = await getSupabase();
      await sb.from('blog_posts').delete().eq('id', id);
      load();
    };

    const slugify = (t) => t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

    if (editing) return (
      <div className="space-y-4 max-w-3xl">
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-bold text-[#0F1631]">{editing === 'new' ? 'New Post' : 'Edit Post'}</h3>
          <button onClick={() => setEditing(null)} className="text-sm text-gray-500 hover:text-gray-700">Cancel</button>
        </div>
        {[
          ['Title', 'title', 'text'],
          ['Slug', 'slug', 'text'],
          ['Excerpt', 'excerpt', 'textarea'],
          ['Content (Markdown)', 'content', 'textarea-lg'],
          ['Meta Title', 'meta_title', 'text'],
          ['Meta Description', 'meta_description', 'textarea'],
        ].map(([label, key, type]) => (
          <div key={key}>
            <label className="block text-xs font-semibold text-gray-500 mb-1">{label}</label>
            {type === 'text' ? (
              <input value={form[key] || ''} onChange={e => setForm(f => ({ ...f, [key]: e.target.value, ...(key === 'title' && editing === 'new' ? { slug: slugify(e.target.value) } : {}) }))}
                className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#2D1FB1]" />
            ) : (
              <textarea value={form[key] || ''} onChange={e => setForm(f => ({ ...f, [key]: e.target.value }))} rows={type === 'textarea-lg' ? 16 : 3}
                className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#2D1FB1] font-mono" />
            )}
          </div>
        ))}
        <div className="flex gap-4">
          <div className="flex-1">
            <label className="block text-xs font-semibold text-gray-500 mb-1">Category</label>
            <select value={form.category} onChange={e => setForm(f => ({ ...f, category: e.target.value }))}
              className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#2D1FB1]">
              {BLOG_CATEGORIES.filter(c => c.id !== 'all').map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
            </select>
          </div>
          <div className="flex-1">
            <label className="block text-xs font-semibold text-gray-500 mb-1">Status</label>
            <select value={form.status} onChange={e => setForm(f => ({ ...f, status: e.target.value }))}
              className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#2D1FB1]">
              <option value="draft">Draft</option>
              <option value="published">Published</option>
              <option value="archived">Archived</option>
            </select>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <input type="checkbox" id="featured" checked={form.featured || false} onChange={e => setForm(f => ({ ...f, featured: e.target.checked }))} />
          <label htmlFor="featured" className="text-sm text-gray-600">Featured post</label>
        </div>
        <button onClick={save} disabled={saving || !form.title || !form.slug}
          className="px-6 py-2.5 bg-[#2D1FB1] text-white font-bold rounded-xl hover:bg-indigo-700 disabled:opacity-50 transition-colors text-sm">
          {saving ? 'Saving…' : 'Save Post'}
        </button>
      </div>
    );

    return (
      <div>
        <div className="flex items-center justify-between mb-6">
          <h3 className="font-bold text-[#0F1631]">Blog Posts ({posts.length})</h3>
          <button onClick={openNew} className="px-4 py-2 bg-[#2D1FB1] text-white text-sm font-bold rounded-lg hover:bg-indigo-700 transition-colors">+ New Post</button>
        </div>
        {loading ? <div className="text-center py-12 text-gray-400">Loading…</div> : (
          <div className="space-y-2">
            {posts.map(post => (
              <div key={post.id} className="bg-white border border-gray-200 rounded-xl p-4 flex items-center gap-4">
                <div className="flex-1">
                  <div className="font-semibold text-[#0F1631] text-sm">{post.title}</div>
                  <div className="text-xs text-gray-400 mt-0.5">{BLOG_CATEGORIES.find(c => c.id === post.category)?.label} · {post.status}</div>
                </div>
                {post.featured && <span className="text-xs px-2 py-0.5 rounded-full bg-amber-50 text-amber-700 font-semibold">Featured</span>}
                <span className={`text-xs px-2 py-0.5 rounded-full font-semibold ${post.status === 'published' ? 'bg-green-50 text-green-700' : 'bg-gray-100 text-gray-500'}`}>{post.status}</span>
                <button onClick={() => openEdit(post)} className="text-xs px-3 py-1.5 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors">Edit</button>
                <button onClick={() => deletePost(post.id)} className="text-xs px-3 py-1.5 border border-red-100 text-red-500 rounded-lg hover:bg-red-50 transition-colors">Delete</button>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  // ─── Affiliate Dashboard (Admin) ──────────────────────────────────────────
  function AdminAffiliates() {
    const [affiliates, setAffiliates] = useState([]);
    const [referrals, setReferrals]   = useState([]);
    const [tab, setTab]               = useState('affiliates');
    const [loading, setLoading]       = useState(true);
    const [form, setForm]             = useState({ code:'', commission_rate: 10, notes:'' });
    const [saving, setSaving]         = useState(false);

    useEffect(() => {
      (async () => {
        const sb = await getSupabase();
        if (!sb) { setLoading(false); return; }
        const [{ data: af }, { data: ref }] = await Promise.all([
          sb.from('affiliates').select('*, profiles(full_name,email)').order('created_at', { ascending: false }),
          sb.from('referrals').select('*, affiliates(code, profiles(full_name))').order('created_at', { ascending: false }).limit(50)
        ]);
        setAffiliates(af || []);
        setReferrals(ref || []);
        setLoading(false);
      })();
    }, []);

    const createAffiliate = async () => {
      if (!form.code.trim()) return;
      setSaving(true);
      const sb = await getSupabase();
      const { data, error } = await sb.from('affiliates').insert({ code: form.code.trim().toLowerCase(), commission_rate: Number(form.commission_rate), notes: form.notes, status: 'active' }).select().single();
      if (!error && data) setAffiliates(prev => [data, ...prev]);
      setForm({ code:'', commission_rate:10, notes:'' });
      setSaving(false);
    };

    const toggleStatus = async (af) => {
      const newStatus = af.status === 'active' ? 'paused' : 'active';
      const sb = await getSupabase();
      await sb.from('affiliates').update({ status: newStatus }).eq('id', af.id);
      setAffiliates(prev => prev.map(a => a.id === af.id ? { ...a, status: newStatus } : a));
    };

    const totalEarned = affiliates.reduce((s, a) => s + Number(a.total_earned || 0), 0);
    const totalPaid   = affiliates.reduce((s, a) => s + Number(a.total_paid || 0), 0);

    return (
      <div>
        <div className="grid grid-cols-3 gap-4 mb-6">
          <div className="bg-white border border-gray-200 rounded-xl p-5 text-center">
            <div className="text-3xl font-black text-[#2D1FB1]">{affiliates.length}</div>
            <div className="text-xs text-gray-500 mt-1">Total Affiliates</div>
          </div>
          <div className="bg-white border border-gray-200 rounded-xl p-5 text-center">
            <div className="text-3xl font-black text-green-600">${totalEarned.toFixed(2)}</div>
            <div className="text-xs text-gray-500 mt-1">Total Commissions Earned</div>
          </div>
          <div className="bg-white border border-gray-200 rounded-xl p-5 text-center">
            <div className="text-3xl font-black text-[#F97316]">${(totalEarned - totalPaid).toFixed(2)}</div>
            <div className="text-xs text-gray-500 mt-1">Unpaid Balance</div>
          </div>
        </div>

        <div className="flex gap-1 border-b border-gray-200 mb-6">
          {[['affiliates','Affiliates'],['referrals','Referrals'],['new','+ Add Affiliate']].map(([id,label]) => (
            <button key={id} onClick={() => setTab(id)}
              className={`px-4 py-2.5 text-sm font-semibold border-b-2 transition-colors ${tab===id ? 'border-[#2D1FB1] text-[#2D1FB1]' : 'border-transparent text-gray-500 hover:text-[#0F1631]'}`}>
              {label}
            </button>
          ))}
        </div>

        {loading && <div className="text-center py-12 text-gray-400">Loading…</div>}

        {!loading && tab === 'affiliates' && (
          <div className="space-y-2">
            {affiliates.length === 0 && <div className="text-center py-12 text-gray-400">No affiliates yet. Add one above.</div>}
            {affiliates.map(af => (
              <div key={af.id} className="bg-white border border-gray-200 rounded-xl p-4 flex items-center gap-4">
                <div className="flex-1">
                  <div className="font-semibold text-[#0F1631] text-sm font-mono">{af.code}</div>
                  <div className="text-xs text-gray-400 mt-0.5">{af.profiles?.full_name || af.profiles?.email || 'No user linked'} · {af.commission_rate}% commission</div>
                </div>
                <div className="text-sm font-semibold text-green-600">${Number(af.total_earned).toFixed(2)} earned</div>
                <span className={`text-xs px-2 py-1 rounded-full font-semibold ${af.status === 'active' ? 'bg-green-50 text-green-700' : 'bg-gray-100 text-gray-500'}`}>{af.status}</span>
                <button onClick={() => toggleStatus(af)} className="text-xs px-3 py-1.5 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors">
                  {af.status === 'active' ? 'Pause' : 'Activate'}
                </button>
              </div>
            ))}
          </div>
        )}

        {!loading && tab === 'referrals' && (
          <div className="space-y-2">
            {referrals.length === 0 && <div className="text-center py-12 text-gray-400">No referrals recorded yet.</div>}
            {referrals.map(ref => (
              <div key={ref.id} className="bg-white border border-gray-200 rounded-xl p-4 flex items-center gap-4">
                <div className="flex-1">
                  <div className="font-semibold text-[#0F1631] text-sm">{ref.referred_email || 'Unknown'}</div>
                  <div className="text-xs text-gray-400 mt-0.5">Code: {ref.affiliates?.code} · {new Date(ref.created_at).toLocaleDateString()}</div>
                </div>
                <div className="text-sm font-semibold">${Number(ref.order_amount || 0).toFixed(2)}</div>
                <div className="text-sm font-semibold text-green-600">+${Number(ref.commission || 0).toFixed(2)}</div>
                <span className={`text-xs px-2 py-1 rounded-full font-semibold ${ref.status === 'paid' ? 'bg-green-50 text-green-700' : ref.status === 'approved' ? 'bg-blue-50 text-blue-700' : 'bg-amber-50 text-amber-700'}`}>{ref.status}</span>
              </div>
            ))}
          </div>
        )}

        {tab === 'new' && (
          <div className="bg-white border border-gray-200 rounded-xl p-6 max-w-md space-y-4">
            <h3 className="font-bold text-[#0F1631]">Add New Affiliate</h3>
            <div>
              <label className="block text-xs font-semibold text-gray-500 mb-1">Affiliate Code (unique, lowercase)</label>
              <input value={form.code} onChange={e => setForm(f => ({ ...f, code: e.target.value.toLowerCase().replace(/\s/g,'') }))}
                className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#2D1FB1] font-mono"
                placeholder="e.g. partner-sbdc" />
            </div>
            <div>
              <label className="block text-xs font-semibold text-gray-500 mb-1">Commission Rate (%)</label>
              <input type="number" min="1" max="50" value={form.commission_rate} onChange={e => setForm(f => ({ ...f, commission_rate: e.target.value }))}
                className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#2D1FB1]" />
            </div>
            <div>
              <label className="block text-xs font-semibold text-gray-500 mb-1">Notes</label>
              <textarea value={form.notes} onChange={e => setForm(f => ({ ...f, notes: e.target.value }))} rows={2}
                className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#2D1FB1]"
                placeholder="Partner name, agreement date, etc." />
            </div>
            <button onClick={createAffiliate} disabled={saving || !form.code}
              className="px-6 py-2.5 bg-[#2D1FB1] text-white font-bold rounded-xl hover:bg-indigo-700 disabled:opacity-50 transition-colors text-sm">
              {saving ? 'Creating…' : 'Create Affiliate'}
            </button>
          </div>
        )}
      </div>
    );
  }

  // ─── Public Directory ─────────────────────────────────────────────────────
  function DirectoryPage() {
    const [professionals, setProfessionals] = useState([]);
    const [loading, setLoading]             = useState(true);
    const [search, setSearch]               = useState('');
    const [stateFilter, setStateFilter]     = useState('');

    useEffect(() => {
      (async () => {
        const sb = await getSupabase();
        if (!sb) { setLoading(false); return; }
        const { data } = await sb
          .from('profiles')
          .select('id, full_name, public_bio, public_org, public_state, certificates:certificates(cert_title, cert_number, issued_at)')
          .eq('public_listing', true)
          .order('full_name');
        setProfessionals(data || []);
        setLoading(false);
      })();
    }, []);

    const filtered = professionals.filter(p => {
      const q = search.toLowerCase();
      const matchSearch = !q || (p.full_name || '').toLowerCase().includes(q) || (p.public_org || '').toLowerCase().includes(q) || (p.public_bio || '').toLowerCase().includes(q);
      const matchState = !stateFilter || p.public_state === stateFilter;
      return matchSearch && matchState;
    });

    const states = [...new Set(professionals.map(p => p.public_state).filter(Boolean))].sort();

    return (
      <div className="min-h-screen bg-[#F8FAFC]">
        <div className="bg-[#0F1631] text-white py-16 px-4">
          <div className="max-w-5xl mx-auto text-center">
            <div className="inline-block bg-[#2D1FB1] text-xs font-semibold text-white px-3 py-1 rounded-full mb-4 uppercase tracking-wider">Certified Professionals</div>
            <h1 className="text-4xl font-bold mb-3">Find a Certified Rural Finance Practitioner</h1>
            <p className="text-indigo-200 text-lg max-w-2xl mx-auto">Cap Fund Academy graduates have completed rigorous training in rural microlending, RLF operations, and USDA program compliance.</p>
          </div>
        </div>

        <div className="max-w-5xl mx-auto px-4 py-10">
          {/* Search and filter */}
          <div className="flex gap-3 mb-8">
            <input value={search} onChange={e => setSearch(e.target.value)}
              className="flex-1 border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-[#2D1FB1]"
              placeholder="Search by name, organization, or specialty…" />
            {states.length > 0 && (
              <select value={stateFilter} onChange={e => setStateFilter(e.target.value)}
                className="border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-[#2D1FB1]">
                <option value="">All States</option>
                {states.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            )}
          </div>

          {loading ? (
            <div className="text-center py-20 text-gray-400">Loading directory…</div>
          ) : filtered.length === 0 ? (
            <div className="text-center py-20 text-gray-400">
              <p className="font-semibold mb-2">No certified professionals listed yet.</p>
              <p className="text-sm">Certified graduates can opt into the directory from their profile settings.</p>
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              {filtered.map(pro => (
                <div key={pro.id} className="bg-white border border-gray-200 rounded-2xl p-6 hover:shadow-md transition-shadow">
                  <div className="flex items-start gap-4">
                    <div className="w-12 h-12 rounded-full bg-[#2D1FB1] text-white flex items-center justify-center font-black text-lg flex-shrink-0">
                      {(pro.full_name || '?')[0].toUpperCase()}
                    </div>
                    <div className="flex-1">
                      <div className="font-bold text-[#0F1631]">{pro.full_name}</div>
                      {pro.public_org && <div className="text-sm text-gray-500">{pro.public_org}</div>}
                      {pro.public_state && <div className="text-xs text-gray-400">{pro.public_state}</div>}
                    </div>
                  </div>
                  {pro.public_bio && <p className="text-sm text-gray-600 mt-4 leading-relaxed">{pro.public_bio}</p>}
                  {pro.certificates?.length > 0 && (
                    <div className="mt-4 pt-4 border-t border-gray-100">
                      <div className="text-xs font-semibold text-gray-400 mb-2">CERTIFICATIONS EARNED</div>
                      <div className="flex flex-wrap gap-1.5">
                        {pro.certificates.slice(0,5).map((c, i) => (
                          <span key={i} className="text-xs px-2 py-1 bg-blue-50 text-[#2D1FB1] rounded-full font-medium">
                            Cert {c.cert_number}
                          </span>
                        ))}
                        {pro.certificates.length > 5 && (
                          <span className="text-xs px-2 py-1 bg-gray-100 text-gray-500 rounded-full">+{pro.certificates.length - 5} more</span>
                        )}
                      </div>
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}

          <div className="mt-16 text-center">
            <p className="text-sm text-gray-500 mb-1">Are you a Cap Fund Academy graduate?</p>
            <p className="text-sm text-gray-400">Opt into the directory from your profile settings after logging in.</p>
          </div>
        </div>
      </div>
    );
  }

  // ─── Profile Settings ────────────────────────────────────────────────────
  function ProfileSettings({ user, profile, onClose, onProfileUpdate }) {
    const [tab, setTab]               = useState('profile');
    const [fullName, setFullName]     = useState(profile?.full_name || '');
    const [org, setOrg]               = useState(profile?.public_org || '');
    const [bio, setBio]               = useState(profile?.public_bio || '');
    const [state, setState]           = useState(profile?.public_state || '');
    const [listing, setListing]       = useState(profile?.public_listing || false);
    const [currentPw, setCurrentPw]   = useState('');
    const [newPw, setNewPw]           = useState('');
    const [confirmPw, setConfirmPw]   = useState('');
    const [avatarFile, setAvatarFile] = useState(null);
    const [avatarPreview, setAvatarPreview] = useState(profile?.avatar_url || null);
    const [cropMode, setCropMode]     = useState(false);
    const [saving, setSaving]         = useState(false);
    const [msg, setMsg]               = useState(null);
    const fileRef = useRef(null);
    const canvasRef = useRef(null);
    const imgRef = useRef(null);

    const showMsg = (text, type = 'success') => {
      setMsg({ text, type });
      setTimeout(() => setMsg(null), 4000);
    };

    // Avatar file pick → show preview for crop
    const handleFileChange = (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => { setAvatarPreview(ev.target.result); setAvatarFile(file); setCropMode(true); };
      reader.readAsDataURL(file);
    };

    // Crop: draw circle-crop on canvas and extract blob
    const cropAndUpload = async () => {
      const img = imgRef.current;
      const canvas = canvasRef.current;
      if (!img || !canvas) return;
      const size = 300;
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      // Draw circle clip
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();
      // Scale image to fill circle
      const s = Math.min(img.naturalWidth, img.naturalHeight);
      const ox = (img.naturalWidth - s) / 2;
      const oy = (img.naturalHeight - s) / 2;
      ctx.drawImage(img, ox, oy, s, s, 0, 0, size, size);

      setSaving(true);
      canvas.toBlob(async (blob) => {
        try {
          const sb = await getSupabase();
          const path = `avatars/${user.id}.png`;
          const { error: upErr } = await sb.storage.from('evidence').upload(path, blob, { contentType: 'image/png', upsert: true });
          if (upErr) throw upErr;
          const { data: urlData } = await sb.storage.from('evidence').createSignedUrl(path, 31536000);
          const avatarUrl = urlData?.signedUrl;
          await sb.from('profiles').update({ avatar_url: avatarUrl }).eq('id', user.id);
          setAvatarPreview(avatarUrl);
          setCropMode(false);
          onProfileUpdate?.();
          showMsg('Profile picture updated!');
        } catch (e) { showMsg(e.message, 'error'); }
        setSaving(false);
      }, 'image/png');
    };

    const saveProfile = async () => {
      setSaving(true);
      try {
        const sb = await getSupabase();
        await sb.from('profiles').update({
          full_name: fullName,
          public_org: org,
          public_bio: bio,
          public_state: state,
          public_listing: listing,
        }).eq('id', user.id);
        onProfileUpdate?.();
        showMsg('Profile saved!');
      } catch (e) { showMsg(e.message, 'error'); }
      setSaving(false);
    };

    const changePassword = async () => {
      if (!newPw || newPw !== confirmPw) { showMsg('Passwords do not match', 'error'); return; }
      if (newPw.length < 8) { showMsg('Password must be at least 8 characters', 'error'); return; }
      setSaving(true);
      try {
        const sb = await getSupabase();
        const { error } = await sb.auth.updateUser({ password: newPw });
        if (error) throw error;
        setCurrentPw(''); setNewPw(''); setConfirmPw('');
        showMsg('Password changed successfully!');
      } catch (e) { showMsg(e.message, 'error'); }
      setSaving(false);
    };

    return (
      <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4" onClick={e => e.target === e.currentTarget && onClose()}>
        <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
          <div className="flex items-center justify-between px-6 py-4 border-b border-gray-100">
            <h2 className="font-bold text-[#0F1631]">Profile Settings</h2>
            <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-xl">✕</button>
          </div>

          {msg && (
            <div className={`mx-6 mt-4 px-4 py-2.5 rounded-lg text-sm font-medium ${msg.type === 'error' ? 'bg-red-50 text-red-700' : 'bg-green-50 text-green-700'}`}>
              {msg.text}
            </div>
          )}

          {/* Tabs */}
          <div className="flex border-b border-gray-100 px-6">
            {[['profile','Profile'],['avatar','Photo'],['password','Password']].map(([id,label]) => (
              <button key={id} onClick={() => setTab(id)}
                className={`px-4 py-3 text-sm font-semibold border-b-2 transition-colors ${tab===id ? 'border-[#2D1FB1] text-[#2D1FB1]' : 'border-transparent text-gray-500'}`}>
                {label}
              </button>
            ))}
          </div>

          <div className="p-6 space-y-4">
            {/* Profile tab */}
            {tab === 'profile' && (
              <>
                <div>
                  <label className="block text-xs font-semibold text-gray-500 mb-1">Full Name</label>
                  <input value={fullName} onChange={e => setFullName(e.target.value)}
                    className="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#2D1FB1]" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-gray-500 mb-1">Organization</label>
                  <input value={org} onChange={e => setOrg(e.target.value)}
                    className="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#2D1FB1]" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-gray-500 mb-1">State</label>
                  <input value={state} onChange={e => setState(e.target.value)} placeholder="e.g. Alabama"
                    className="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#2D1FB1]" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-gray-500 mb-1">Bio (for public directory)</label>
                  <textarea value={bio} onChange={e => setBio(e.target.value)} rows={3} placeholder="Brief professional bio..."
                    className="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#2D1FB1]" />
                </div>
                <label className="flex items-center gap-3 cursor-pointer">
                  <input type="checkbox" checked={listing} onChange={e => setListing(e.target.checked)} className="w-4 h-4 rounded" />
                  <div>
                    <div className="text-sm font-medium text-[#0F1631]">List me in the Certified Professionals Directory</div>
                    <div className="text-xs text-gray-500">Your name, org, state, bio, and certifications will be publicly visible</div>
                  </div>
                </label>
                <button onClick={saveProfile} disabled={saving}
                  className="w-full py-2.5 bg-[#2D1FB1] text-white font-bold rounded-xl hover:bg-indigo-700 disabled:opacity-50 transition-colors text-sm">
                  {saving ? 'Saving…' : 'Save Profile'}
                </button>
              </>
            )}

            {/* Avatar tab */}
            {tab === 'avatar' && (
              <>
                <div className="flex flex-col items-center gap-4">
                  {!cropMode ? (
                    <>
                      <div className="w-32 h-32 rounded-full overflow-hidden bg-gray-100 border-4 border-[#2D1FB1] flex items-center justify-center">
                        {avatarPreview
                          ? <img src={avatarPreview} alt="Avatar" className="w-full h-full object-cover" />
                          : <span className="text-4xl font-black text-[#2D1FB1]">{(profile?.full_name || user?.email || '?')[0].toUpperCase()}</span>
                        }
                      </div>
                      <button onClick={() => fileRef.current?.click()}
                        className="px-5 py-2.5 bg-[#2D1FB1] text-white font-bold rounded-xl hover:bg-indigo-700 transition-colors text-sm">
                        Choose Photo
                      </button>
                      <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={handleFileChange} />
                      <p className="text-xs text-gray-500 text-center">JPG, PNG, or GIF. Will be cropped to a circle.</p>
                    </>
                  ) : (
                    <>
                      <p className="text-sm text-gray-600 text-center">Preview — click Save to use this photo</p>
                      <div className="relative w-48 h-48 rounded-full overflow-hidden border-4 border-[#2D1FB1]">
                        <img ref={imgRef} src={avatarPreview} alt="crop preview" className="w-full h-full object-cover" />
                      </div>
                      <canvas ref={canvasRef} className="hidden" />
                      <div className="flex gap-3">
                        <button onClick={() => { setCropMode(false); setAvatarFile(null); }} className="px-4 py-2 border border-gray-200 text-gray-600 rounded-lg text-sm hover:bg-gray-50">
                          Cancel
                        </button>
                        <button onClick={cropAndUpload} disabled={saving}
                          className="px-5 py-2 bg-[#F97316] text-white font-bold rounded-lg text-sm hover:bg-orange-500 disabled:opacity-50 transition-colors">
                          {saving ? 'Uploading…' : 'Save Photo'}
                        </button>
                      </div>
                    </>
                  )}
                </div>
              </>
            )}

            {/* Password tab */}
            {tab === 'password' && (
              <>
                <div className="bg-blue-50 border border-blue-100 rounded-lg px-4 py-3 text-sm text-blue-700">
                  Password must be at least 8 characters. You will remain logged in after changing your password.
                </div>
                <div>
                  <label className="block text-xs font-semibold text-gray-500 mb-1">New Password</label>
                  <input type="password" value={newPw} onChange={e => setNewPw(e.target.value)} placeholder="Min 8 characters"
                    className="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#2D1FB1]" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-gray-500 mb-1">Confirm New Password</label>
                  <input type="password" value={confirmPw} onChange={e => setConfirmPw(e.target.value)} placeholder="Repeat password"
                    className="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#2D1FB1]" />
                </div>
                {newPw && confirmPw && newPw !== confirmPw && (
                  <p className="text-xs text-red-500">Passwords do not match</p>
                )}
                <button onClick={changePassword} disabled={saving || !newPw || newPw !== confirmPw}
                  className="w-full py-2.5 bg-[#2D1FB1] text-white font-bold rounded-xl hover:bg-indigo-700 disabled:opacity-50 transition-colors text-sm">
                  {saving ? 'Changing…' : 'Change Password'}
                </button>
              </>
            )}
          </div>
        </div>
      </div>
    );
  }

  // ─── Root App ─────────────────────────────────────────────────────────────
  function App() {
    const [loading, setLoading]         = useState(true);
    const [pubView, setPubView]         = useState('home'); // public views
    const [user, setUser]               = useState(null);
    const [profile, setProfile]         = useState(null);
    const [loginOpen, setLoginOpen]     = useState(false);
    const [profileOpen, setProfileOpen] = useState(false);
    // LMS navigation state
    const [lmsView, setLmsView]         = useState('dashboard'); // dashboard | admin | catalog | cert | lesson | quiz | scoring | pricing | org
    const [selectedCert, setSelectedCert]     = useState(null);
    const [selectedLesson, setSelectedLesson] = useState(null);
    const [selectedMod, setSelectedMod]       = useState(null);
    const [selectedQuiz, setSelectedQuiz]     = useState(null);
    const [allLessons, setAllLessons]         = useState([]);

    const isStaff = ['super_admin','admin','instructor','reviewer'].includes(profile?.role);
    const loggedIn = !!user;

    useEffect(() => {
      // Hard safety valve — never show loading screen for more than 7 seconds
      const safetyTimer = setTimeout(() => setLoading(false), 7000);
      (async () => {
        try {
          const sb = await getSupabase();
          if (sb) {
            const { data: { session } } = await sb.auth.getSession();
            if (session?.user) await loadUser(session.user);
            sb.auth.onAuthStateChange(async (_event, session) => {
              if (session?.user) await loadUser(session.user);
              else { setUser(null); setProfile(null); }
            });
          }
        } catch {}
        finally { clearTimeout(safetyTimer); setLoading(false); }
      })();
    }, []);

    const loadUser = async (u) => {
      setUser(u);
      const sb = await getSupabase();
      if (sb) {
        const { data: prof } = await sb.from('profiles').select('*').eq('id', u.id).maybeSingle();
        setProfile(prof);
        const staffRoles = ['super_admin','admin','instructor','reviewer'];
        setLmsView(staffRoles.includes(prof?.role) ? 'admin' : 'dashboard');
      }
    };

    const handleSignOut = async () => {
      try { const sb = await getSupabase(); if (sb) await sb.auth.signOut(); } catch {}
      setUser(null); setProfile(null);
    };

    const openCert = (cert) => { setSelectedCert(cert); setLmsView('cert'); };
    const openLesson = async (lesson, mod, cert, quiz) => {
      if (quiz) { setSelectedQuiz(quiz); setSelectedCert(cert); setLmsView('quiz'); return; }
      setSelectedLesson(lesson); setSelectedMod(mod); setSelectedCert(cert);
      // Build flat lesson list for prev/next
      const sb = await getSupabase();
      if (sb) {
        const isStaffRole = ['super_admin','admin','instructor','reviewer'].includes(profile?.role);
        let q = sb.from('lessons').select('*, modules!inner(sort_order, certification_id)')
          .eq('modules.certification_id', cert.id).order('sort_order');
        if (!isStaffRole) q = q.eq('status','approved');
        const { data } = await q;
        setAllLessons(data || []);
      }
      setLmsView('lesson');
    };
    const onLessonComplete = (lesson, next, goBack) => {
      if (goBack) { openLesson(next, selectedMod, selectedCert); return; }
      if (next) openLesson(next, selectedMod, selectedCert);
      else setLmsView('cert');
    };

    if (loading) return <LoadingScreen />;

    if (loggedIn) {
      return (
        <div className="min-h-screen bg-[#F8FAFC]">
          {/* Inner nav for logged-in users */}
          <nav className="bg-white border-b border-gray-200 sticky top-0 z-20">
            <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-6">
                <button onClick={() => setLmsView(isStaff ? 'admin' : 'dashboard')} className="flex items-center">
                  <img src="/assets/logo-cfa.png" alt="Cap Fund Academy" style={{ height: 80, width: 'auto' }} />
                </button>
                <button onClick={() => setLmsView('catalog')} className="text-sm text-gray-500 hover:text-[#2D1FB1] transition-colors">Catalog</button>
                <button onClick={() => setLmsView('scoring')} className="text-sm font-semibold text-[#F97316] hover:text-orange-600 transition-colors">🤖 Score My App</button>
                <button onClick={() => setLmsView('pricing')} className="text-sm text-gray-500 hover:text-[#2D1FB1] transition-colors">Pricing</button>
                {isStaff && <button onClick={() => setLmsView('admin')} className="text-sm text-gray-500 hover:text-[#2D1FB1] transition-colors">Admin</button>}
                {!isStaff && <button onClick={() => setLmsView('dashboard')} className="text-sm text-gray-500 hover:text-[#2D1FB1] transition-colors">Dashboard</button>}
                {['organization_owner','organization_manager'].includes(profile?.role) && (
                  <button onClick={() => setLmsView('org')} className="text-sm text-gray-500 hover:text-[#2D1FB1] transition-colors">My Org</button>
                )}
              </div>
              <div className="flex items-center gap-3">
                <button onClick={() => setProfileOpen(true)}
                  className="w-8 h-8 rounded-full bg-[#2D1FB1] text-white flex items-center justify-center font-bold text-sm hover:bg-indigo-700 transition-colors"
                  title="Profile Settings">
                  {profile?.avatar_url
                    ? <img src={profile.avatar_url} alt="" className="w-8 h-8 rounded-full object-cover" />
                    : (profile?.full_name || user?.email || '?')[0].toUpperCase()
                  }
                </button>
                <span className="text-xs text-gray-400 hidden sm:block">{profile?.full_name || user?.email}</span>
              </div>
            </div>
          </nav>

          {profileOpen && (
            <ProfileSettings user={user} profile={profile} onClose={() => setProfileOpen(false)}
              onProfileUpdate={async () => {
                const sb = await getSupabase();
                if (sb) {
                  const { data } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
                  setProfile(data);
                }
              }} />
          )}

          {lmsView === 'dashboard' && !isStaff && (
            <StudentDashboard user={user} profile={profile} onSignOut={handleSignOut}
              onOpenCatalog={() => setLmsView('catalog')} onSelectCert={openCert} />
          )}
          {lmsView === 'admin' && isStaff && (
            <AdminDashboard user={user} profile={profile} onSignOut={handleSignOut} />
          )}
          {lmsView === 'catalog' && (
            <CertCatalog onSelectCert={openCert} profile={profile} />
          )}
          {lmsView === 'scoring' && (
            <ApplicationWorkspace user={user} profile={profile} onBack={() => setLmsView(isStaff ? 'admin' : 'dashboard')} />
          )}
          {lmsView === 'pricing' && (
            <PricingPage user={user} />
          )}
          {lmsView === 'org' && (
            <OrgDashboard user={user} profile={profile} onSignOut={handleSignOut} />
          )}
          {lmsView === 'cert' && selectedCert && (
            <CertDetail cert={selectedCert} onBack={() => setLmsView('catalog')}
              onStartLesson={openLesson} profile={profile} />
          )}
          {lmsView === 'lesson' && selectedLesson && (
            <LessonPlayer lesson={selectedLesson} mod={selectedMod} cert={selectedCert}
              allLessons={allLessons} onComplete={onLessonComplete}
              onBack={() => setLmsView('cert')} profile={profile} />
          )}
          {lmsView === 'quiz' && selectedQuiz && (
            <QuizPlayer cert={selectedCert} quiz={selectedQuiz}
              onBack={() => setLmsView('cert')}
              onPassed={() => setLmsView('dashboard')}
              profile={profile} />
          )}
        </div>
      );
    }

    return (
      <div className="min-h-screen flex flex-col">
        <Header view={pubView} setView={setPubView} onLoginClick={() => setLoginOpen(true)} />
        {pubView === 'home'      && <Homepage setView={setPubView} />}
        {pubView === 'trust'     && <TrustCenter setView={setPubView} />}
        {pubView === 'quiz'      && <RLFReadinessQuiz onComplete={() => setPubView('home')} />}
        {pubView === 'checklist' && <RMAPChecklist onCapture={() => setPubView('home')} />}
        {pubView === 'webinar'   && <VSLPage onCTA={() => setPubView('home')} />}
        {pubView === 'pricing'   && <PricingPage user={null} />}
        {pubView === 'blog'      && <BlogPage setView={setPubView} />}
        {pubView === 'directory' && <DirectoryPage />}
        <Footer setView={setPubView} />
        <LoginModal open={loginOpen} onClose={() => setLoginOpen(false)}
          onLoginSuccess={loadUser} />
      </div>
    );
  }

  // ─── Mount ────────────────────────────────────────────────────────────────
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
</body>
</html>
