  function RLFReadinessQuiz({ onComplete }) {
    const [questions, setQuestions]   = useState([]);
    const [loading, setLoading]       = useState(true);
    const [idx, setIdx]               = useState(0);
    const [answers, setAnswers]       = useState({});
    const [stage, setStage]           = useState('quiz'); // quiz | capture | result
    const [name, setName]             = useState('');
    const [email, setEmail]           = useState('');
    const [org, setOrg]               = useState('');
    const [submitting, setSubmitting] = useState(false);
    const [result, setResult]         = useState(null);

    useEffect(() => {
      (async () => {
        const sb = await getSupabase();
        if (!sb) { setLoading(false); return; }
        const { data } = await sb.from('public_quiz_questions').select('*').eq('is_active', true).order('sort_order');
        // Deduplicate by question_text in case of DB duplicates
        const seen = new Set();
        const unique = (data || []).filter(q => {
          if (seen.has(q.question_text)) return false;
          seen.add(q.question_text);
          return true;
        });
        setQuestions(unique);
        setLoading(false);
      })();
    }, []);

    const total = questions.length;
    const q = questions[idx];
    const pct = total ? Math.round(((idx) / total) * 100) : 0;

    const calcScore = () => {
      let score = 0, max = 0;
      questions.forEach(q => {
        const opts = q.options || [];
        const maxPts = Math.max(...opts.map(o => o.points || 0));
        max += maxPts;
        const chosen = opts.find(o => o.id === answers[q.id]);
        score += chosen?.points || 0;
      });
      return { score, max };
    };

    const submitResult = async () => {
      if (!email.trim()) return;
      setSubmitting(true);
      const { score, max } = calcScore();
      const pctScore = Math.round((score / max) * 100);
      const tag = pctScore >= 80 ? 'advanced' : pctScore >= 60 ? 'ready' : pctScore >= 35 ? 'developing' : 'beginner';
      try {
        await fetch('/.netlify/functions/lead-capture', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, organization: org, source: 'quiz', answers, score, max_score: max })
        });
      } catch {}
      setResult({ score: pctScore, tag, config: RESULT_CONFIG[tag] });
      setStage('result');
      setSubmitting(false);
    };

    if (loading) return <div className="text-center py-20 text-gray-400">Loading quiz…</div>;

    return (
      <div className="max-w-2xl mx-auto px-4 py-12 fade-in">
        <div className="text-center mb-8">
          <div className="inline-block bg-[#2D1FB1] text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-4">Free Assessment</div>
          <h2 className="text-3xl font-black text-[#0F1631] mb-2">RLF Readiness Quiz</h2>
          <p className="text-gray-500">12 questions · 3 minutes · Get your personalized score</p>
        </div>

        {stage === 'quiz' && q && (
          <div className="bg-white rounded-2xl border border-gray-200 shadow-sm p-8">
            <div className="mb-6">
              <div className="flex justify-between text-xs text-gray-400 mb-2"><span>Question {idx + 1} of {total}</span><span>{pct}% complete</span></div>
              <div className="h-2 bg-gray-100 rounded-full"><div className="h-2 bg-[#2D1FB1] rounded-full transition-all" style={{ width: `${pct}%` }}/></div>
            </div>
            <h3 className="text-lg font-bold text-[#0F1631] mb-5 leading-snug">{q.question_text}</h3>
            <div className="space-y-3">
              {(q.options || []).map(opt => (
                <button key={opt.id} onClick={() => setAnswers(a => ({ ...a, [q.id]: opt.id }))}
                  className={`w-full text-left px-4 py-3.5 rounded-xl border text-sm font-medium transition-all ${answers[q.id] === opt.id ? 'bg-[#2D1FB1] border-[#2D1FB1] text-white' : 'border-gray-200 text-gray-700 hover:border-[#2D1FB1] bg-white'}`}>
                  {opt.text}
                </button>
              ))}
            </div>
            <div className="flex justify-between mt-6">
              <button onClick={() => setIdx(i => Math.max(0, i - 1))} disabled={idx === 0}
                className="px-4 py-2 text-sm text-gray-500 border border-gray-200 rounded-lg hover:bg-gray-50 disabled:opacity-30 transition-colors">← Back</button>
              {idx < total - 1 ? (
                <button onClick={() => setIdx(i => i + 1)} disabled={!answers[q.id]}
                  className="px-6 py-2 bg-[#2D1FB1] text-white text-sm font-bold rounded-lg hover:bg-indigo-700 disabled:opacity-30 transition-colors">Next →</button>
              ) : (
                <button onClick={() => setStage('capture')} disabled={!answers[q.id]}
                  className="px-6 py-2 bg-[#F97316] text-white text-sm font-bold rounded-lg hover:bg-orange-600 disabled:opacity-30 transition-colors">Get My Score →</button>
              )}
            </div>
          </div>
        )}

        {stage === 'capture' && (
          <div className="bg-white rounded-2xl border border-gray-200 shadow-sm p-8 text-center">
            <div className="text-4xl mb-4">🎯</div>
            <h3 className="text-2xl font-black text-[#0F1631] mb-2">Almost there!</h3>
            <p className="text-gray-500 mb-6">Enter your info to see your personalized score and action plan.</p>
            <div className="space-y-3 text-left mb-5">
              {/* Honeypot */}
              <input type="text" name="website" style={{ display: 'none' }} tabIndex={-1} autoComplete="off" />
              <input value={name} onChange={e => setName(e.target.value)}
                className="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-[#2D1FB1]"
                placeholder="Your name" />
              <input value={email} onChange={e => setEmail(e.target.value)}
                className="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-[#2D1FB1]"
                placeholder="Your email address *" type="email" required />
              <input value={org} onChange={e => setOrg(e.target.value)}
                className="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-[#2D1FB1]"
                placeholder="Organization name" />
            </div>
            <button onClick={submitResult} disabled={!email.trim() || submitting}
              className="w-full py-3.5 bg-[#F97316] text-white font-black rounded-xl hover:bg-orange-600 disabled:opacity-50 transition-colors">
              {submitting ? 'Calculating…' : 'See My Score →'}
            </button>
            <p className="text-xs text-gray-400 mt-3">No spam. Unsubscribe anytime.</p>
          </div>
        )}

        {stage === 'result' && result && (
          <div>
            <div className={`rounded-2xl border-2 p-8 text-center mb-6 ${result.config.bg} ${result.config.border}`}>
              <div className="text-6xl font-black mb-2" style={{ color: result.config.color }}>{result.score}%</div>
              <div className="text-2xl font-black mb-2" style={{ color: result.config.color }}>{result.config.label}</div>
              <div className="text-sm text-gray-600 mb-1">{result.config.pctRange} readiness range</div>
            </div>
            <div className="bg-white border border-gray-200 rounded-2xl p-6 mb-5">
              <h4 className="font-bold text-[#0F1631] mb-2">What this means</h4>
              <p className="text-sm text-gray-600 leading-relaxed mb-4">{result.config.description}</p>
              <div className="bg-[#F8FAFC] rounded-xl p-4">
                <div className="text-xs font-bold text-[#2D1FB1] mb-1 uppercase tracking-wider">Recommended next step</div>
                <p className="text-sm text-gray-700">{result.config.nextStep}</p>
              </div>
            </div>
            <div className="bg-[#2D1FB1] rounded-2xl p-6 text-center">
              <div className="text-white font-bold text-lg mb-2">Ready to close the gaps?</div>
              <p className="text-indigo-200 text-sm mb-5">Cap Fund Academy has the exact training, templates, and AI scoring tools you need.</p>
              <button onClick={onComplete} className="px-8 py-3 bg-[#F97316] text-white font-black rounded-xl hover:bg-orange-600 transition-colors">
                Explore Certifications →
              </button>
            </div>
            <p className="text-xs text-gray-400 text-center mt-4">Results sent to your email. Check your inbox.</p>
          </div>
        )}
      </div>
    );
  }

  // ─── RMAP Checklist Lead Magnet ───────────────────────────────────────────

  function RMAPChecklist({ onCapture }) {
    const [captured, setCaptured] = useState(false);

    const [email, setEmail]       = useState('');
    const [org, setOrg]           = useState('');

    const [checked, setChecked]   = useState({});

    const submit = async () => {
      if (!email.trim()) return;
      setSubmitting(true);
      try {
        await fetch('/.netlify/functions/lead-capture', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, organization: org, source: 'checklist' })
        });
      } catch {}
      setCaptured(true);
      setSubmitting(false);
    };

    const totalPoints = RMAP_CHECKLIST.flatMap(s => s.items).reduce((sum, i) => sum + (i.points || 0), 0);
    const checkedCount = Object.values(checked).filter(Boolean).length;
    const totalItems = RMAP_CHECKLIST.flatMap(s => s.items).length;

    return (
      <div className="max-w-4xl mx-auto px-4 py-12 fade-in">

  // ─── Pricing Page ────────────────────────────────────────────────────────
  function PricingPage({ onCheckout, user, onLoginRequest }) {
    const [offers, setOffers] = useState([]);
    const [loading, setLoading] = useState(true);
    const [coupon, setCoupon] = useState('');
    const [checkingOut, setCheckingOut] = useState(null);
    const [checkoutError, setCheckoutError] = useState('');

    useEffect(() => {
      (async () => {
        const sb = await getSupabase();
        if (!sb) { setLoading(false); return; }
        const { data } = await sb.from('offers').select('*').eq('is_active', true).order('sort_order');
        setOffers(data || []);
        setLoading(false);
      })();
    }, []);

    const startCheckout = async (offer) => {
      if (!user) {
        if (onLoginRequest) onLoginRequest();
        else setCheckoutError('Please log in to purchase.');
        return;
      }
      setCheckingOut(offer.id);
      setCheckoutError('');
      const sb = await getSupabase();
      if (!sb) { setCheckingOut(null); return; }
      try {
        const { data: { session } } = await sb.auth.getSession();
        const res = await fetch('/.netlify/functions/stripe-checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
          body: JSON.stringify({ offer_id: offer.id, coupon_code: coupon || undefined })
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Checkout failed');
        window.location.href = json.url;
      } catch (e) { setCheckoutError(e.message); setCheckingOut(null); }
    };

    const fmt = (cents) => '$' + (cents / 100).toLocaleString('en-US', { minimumFractionDigits: 0 });

    const typeIcon = { single_cert: '📄', bundle: '📚', org_license: '🏢', subscription: '🔄', dwu: '🤝' };

    return (
      <main className="max-w-6xl mx-auto px-4 py-16 fade-in">
        <div className="text-center mb-12">
          <h1 className="text-4xl font-black text-[#0F1631] mb-3">Pricing & Offers</h1>
          <p className="text-gray-500 text-lg max-w-2xl mx-auto">Choose the path that fits your organization's goals and budget. All certifications include lifetime access and artifact templates.</p>
        </div>

        {checkoutError && (
          <div className="max-w-lg mx-auto mb-6 p-4 bg-red-50 border border-red-200 rounded-xl text-sm text-red-700">{checkoutError}</div>
        )}

        {/* Coupon input */}
        <div className="max-w-sm mx-auto mb-10 flex gap-2">
          <input value={coupon} onChange={e => setCoupon(e.target.value.toUpperCase())}
            className="flex-1 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#2D1FB1]"
            placeholder="Coupon code (optional)" />
        </div>

        {loading ? <div className="text-center py-12 text-gray-400">Loading offers…</div> : (
          <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
            {offers.map(offer => (
              <div key={offer.id} className={`bg-white rounded-2xl border-2 p-6 flex flex-col ${offer.is_featured ? 'border-[#F97316] shadow-xl' : 'border-gray-200'}`}>
                {offer.is_featured && (
                  <div className="text-xs font-black text-[#F97316] uppercase tracking-wider mb-3">Most Popular</div>
                )}
                <div className="text-2xl mb-2">{typeIcon[offer.offer_type] || '📋'}</div>
                <h3 className="text-xl font-black text-[#0F1631] mb-2">{offer.title}</h3>
                <p className="text-gray-500 text-sm mb-4 leading-relaxed flex-1">{offer.description}</p>
                {offer.features?.length > 0 && (
                  <ul className="space-y-1.5 mb-6">
                    {offer.features.map((f, i) => (
                      <li key={i} className="flex items-start gap-2 text-sm text-gray-700">
                        <span className="text-green-500 font-bold flex-shrink-0">✓</span>{f}
                      </li>
                    ))}
                  </ul>
                )}
                <div className="mt-auto">
                  <div className="text-3xl font-black text-[#0F1631] mb-1">
                    {fmt(offer.price_cents)}
                    {offer.offer_type === 'subscription' && <span className="text-base font-normal text-gray-400">/mo</span>}
                  </div>
                  {offer.seat_limit > 1 && <div className="text-xs text-gray-400 mb-3">Up to {offer.seat_limit} seats</div>}
                  {offer.offer_type === 'dwu' ? (
                    <a href="mailto:support@capfundacademy.com?subject=Done-With-You Application Support Inquiry"
                      className="block w-full py-3 text-center bg-[#0F1631] text-white font-bold rounded-xl hover:bg-gray-800 transition-colors text-sm">
                      Contact Us →
                    </a>
                  ) : (
                    <button onClick={() => startCheckout(offer)} disabled={!!checkingOut}
                      className={`w-full py-3 font-bold rounded-xl transition-colors text-sm ${offer.is_featured ? 'bg-[#F97316] hover:bg-orange-600 text-white' : 'bg-[#2D1FB1] hover:bg-indigo-700 text-white'} disabled:opacity-50`}>
                      {checkingOut === offer.id ? 'Redirecting…' : 'Get Started'}
                    </button>
                  )}
                </div>
              </div>
            ))}
          </div>
        )}

        <div className="mt-12 text-center text-xs text-gray-400 max-w-2xl mx-auto leading-relaxed">
          {DISCLAIMER}
        </div>
      </main>
    );
  }

  // ─── Autopilot Health Dashboard ──────────────────────────────────────────
  function AutopilotDashboard() {
    const [metrics, setMetrics]         = useState(null);
    const [exceptions, setExceptions]   = useState([]);
    const [runs, setRuns]               = useState([]);
    const [loading, setLoading]         = useState(true);
    const [resolving, setResolving]     = useState({});
    const [triggering, setTriggering]   = useState(null); // fn name currently running
    const [triggerResult, setTriggerResult] = useState(null); // { fn, ok, data, error }

    useEffect(() => { loadDashboard(); }, []);

    const loadDashboard = async () => {
      setLoading(true);
      const sb = await getSupabase();
      if (!sb) { setLoading(false); return; }

      const sevenDaysAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();
      const thirtyDaysAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString();

      const [
        { count: leads7d },
        { count: leadsTotal },
        { count: students },
        { data: orders7d },
        { data: ordersTotal },
        { count: completionsTotal },
        { count: completions7d },
        { count: scoringRuns7d },
        { count: postsGenerated7d },
        { count: pendingApprovals },
        { count: pendingContent },
        { data: recentExceptions },
        { data: recentRuns }
      ] = await Promise.all([
        sb.from('leads').select('*', { count: 'exact', head: true }).gte('created_at', sevenDaysAgo),
        sb.from('leads').select('*', { count: 'exact', head: true }),
        sb.from('profiles').select('*', { count: 'exact', head: true }).in('role', ['student','organization_owner','organization_manager']),
        sb.from('orders').select('amount_cents').eq('status', 'paid').gte('created_at', thirtyDaysAgo),
        sb.from('orders').select('amount_cents').eq('status', 'paid'),
        sb.from('certification_completions').select('*', { count: 'exact', head: true }),
        sb.from('certification_completions').select('*', { count: 'exact', head: true }).gte('completed_at', sevenDaysAgo),
        sb.from('scoring_runs').select('*', { count: 'exact', head: true }).eq('status', 'complete').gte('started_at', sevenDaysAgo),
        sb.from('social_posts').select('*', { count: 'exact', head: true }).gte('created_at', sevenDaysAgo),
        sb.from('quiz_responses').select('*', { count: 'exact', head: true }).gte('created_at', sevenDaysAgo),
        sb.from('social_posts').select('*', { count: 'exact', head: true }).eq('status', 'review'),
        sb.from('exception_events').select('*').eq('resolved', false).order('created_at', { ascending: false }).limit(20),
        sb.from('autopilot_runs').select('*').order('started_at', { ascending: false }).limit(15),
      ]);

      const revenue30d = (orders7d || []).reduce((s, o) => s + (o.amount_cents || 0), 0);
      const revenueTotal = (ordersTotal || []).reduce((s, o) => s + (o.amount_cents || 0), 0);
      setMetrics({ leads7d, leadsTotal, students, revenue30d, revenueTotal, completionsTotal, completions7d, scoringRuns7d, postsGenerated7d, pendingApprovals, pendingContent });
      setExceptions(recentExceptions || []);
      setRuns(recentRuns || []);
      setLoading(false);
    };

    const resolveException = async (ex) => {
      setResolving(r => ({ ...r, [ex.id]: true }));
      const sb = await getSupabase();
      if (!sb) { setResolving(r => ({ ...r, [ex.id]: false })); return; }
      const { data: { user } } = await sb.auth.getUser();
      await sb.from('exception_events').update({ resolved: true, resolved_at: new Date().toISOString(), resolved_by: user.id }).eq('id', ex.id);
      setExceptions(prev => prev.filter(e => e.id !== ex.id));
      setResolving(r => ({ ...r, [ex.id]: false }));
    };

    const SEV_COLORS = { info: 'text-blue-600 bg-blue-50', warning: 'text-amber-700 bg-amber-50', error: 'text-red-700 bg-red-50', critical: 'text-red-900 bg-red-100' };
    const SEV_ICONS  = { info: 'ℹ️', warning: '⚠️', error: '🚨', critical: '🔴' };
    const RUN_COLORS = { success: 'text-green-700 bg-green-50', failed: 'text-red-700 bg-red-50', partial: 'text-amber-700 bg-amber-50', running: 'text-blue-700 bg-blue-50' };
    const fmtRelative = (d) => {
      if (!d) return '—';
      const diff = Date.now() - new Date(d).getTime();
      if (diff < 3600000) return Math.floor(diff/60000) + 'm ago';
      if (diff < 86400000) return Math.floor(diff/3600000) + 'h ago';
      return Math.floor(diff/86400000) + 'd ago';
    };
    const fmt = (cents) => '$' + ((cents || 0) / 100).toLocaleString('en-US', { minimumFractionDigits: 0 });

    if (loading) return <div className="text-center py-16 text-gray-400">Loading autopilot dashboard…</div>;

    const pendingTotal = metrics?.pendingContent || 0;

    return (
      <div className="fade-in space-y-6">
        {/* Header */}
        <div className="flex items-center justify-between">
          <div>
            <h2 className="text-xl font-bold text-[#0F1631]">Autopilot Health</h2>
            <p className="text-sm text-gray-500">All-time totals + 7-day activity · {new Date().toLocaleDateString()}</p>
          </div>
          <button onClick={loadDashboard} className="px-4 py-2 border border-gray-200 text-sm font-semibold rounded-lg hover:bg-gray-50 transition-colors">↻ Refresh</button>
        </div>

        {/* KPI grid */}
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
          {[
            { label: 'Total Leads',            value: metrics?.leadsTotal || 0,        sub: `+${metrics?.leads7d||0} this week`,     color: '#2D1FB1', icon: '👥' },
            { label: 'Total Revenue',          value: fmt(metrics?.revenueTotal),       sub: fmt(metrics?.revenue30d) + ' (30d)',      color: '#16A34A', icon: '💰' },
            { label: 'Active Students',        value: metrics?.students || 0,           sub: 'enrolled users',                         color: '#F97316', icon: '🎓' },
            { label: 'Certs Completed',        value: metrics?.completionsTotal || 0,   sub: `+${metrics?.completions7d||0} this week`,color: '#7C3AED', icon: '🏆' },
            { label: 'AI Scores Run (7d)',     value: metrics?.scoringRuns7d || 0,      sub: 'application scorecards',                color: '#0891B2', icon: '🤖' },
            { label: 'Content Posts (7d)',     value: metrics?.postsGenerated7d || 0,   sub: 'auto-published posts',                  color: '#2D1FB1', icon: '✍️' },
            { label: 'Quiz Completions (7d)',  value: metrics?.pendingApprovals || 0,   sub: 'free quiz responses',                   color: '#D97706', icon: '📊' },
            { label: 'Pending Review',         value: pendingTotal,                     sub: pendingTotal > 0 ? 'needs action' : 'all clear', color: pendingTotal > 0 ? '#DC2626' : '#16A34A', icon: pendingTotal > 0 ? '🔔' : '✅' },
          ].map(({ label, value, color, icon, sub }) => (
            <div key={label} className="bg-white border border-gray-200 rounded-xl p-4">
              <div className="text-lg mb-1">{icon}</div>
              <div className="text-2xl font-black" style={{ color }}>{value}</div>
              <div className="text-xs text-gray-500 mt-0.5 leading-tight">{label}</div>
              {sub && <div className="text-xs text-gray-400 mt-0.5">{sub}</div>}
            </div>
          ))}
        </div>

        {/* Scheduled functions */}
        {(() => {
          const triggerFn = async (fnName) => {
            setTriggering(fnName);
            setTriggerResult(null);
            try {
              const sb = await getSupabase();
              const { data: { session } } = await sb.auth.getSession();
              const res = await fetch(`/.netlify/functions/${fnName}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session?.access_token}` },
                body: JSON.stringify({ _manual_trigger: true }),
              });
              const data = await res.json().catch(() => ({}));
              setTriggerResult({ fn: fnName, ok: res.ok, data });
            } catch (e) {
              setTriggerResult({ fn: fnName, ok: false, error: e.message });
            }
            setTriggering(null);
            loadDashboard();
          };

          const fns = [
            { name: 'daily-content',     label: '📱 Social Media & Blog',    schedule: 'Daily 8am UTC',   canTrigger: true },
            { name: 'daily-nurture',     label: 'Daily Lead Nurture',         schedule: 'Daily 9am UTC' },
            { name: 'weekly-digest',     label: 'Weekly Digest Email',        schedule: 'Mondays 8am UTC' },
            { name: 'abandoned-checkout',label: 'Abandoned Checkout',         schedule: 'Every 2 hours' },
            { name: 'renewal-reminder',  label: 'Renewal Reminders',          schedule: 'Daily 10am UTC' },
            { name: 'exception-detect',  label: 'Exception Detection',        schedule: 'Every hour' },
          ];

          return (
            <div className="bg-white border border-gray-200 rounded-xl overflow-hidden">
              <div className="px-5 py-3 border-b border-gray-100 flex items-center justify-between">
                <div className="font-bold text-[#0F1631] text-sm">Scheduled Functions</div>
                <div className="text-xs text-gray-400">{runs.length} recent runs</div>
              </div>

              {/* Trigger result banner */}
              {triggerResult && (
                <div className={`px-5 py-3 border-b text-sm ${triggerResult.ok ? 'bg-green-50 border-green-100' : 'bg-red-50 border-red-100'}`}>
                  <div className="flex items-start justify-between gap-4">
                    <div className="flex-1">
                      <span className={`font-bold ${triggerResult.ok ? 'text-green-700' : 'text-red-700'}`}>
                        {triggerResult.ok ? '✅ Run completed' : '❌ Run failed'} — {triggerResult.fn}
                      </span>
                      {triggerResult.data?.errors?.length > 0 && (
                        <div className="mt-1 text-xs text-red-600 space-y-0.5">
                          {triggerResult.data.errors.map((e, i) => <div key={i}>• {e}</div>)}
                        </div>
                      )}
                      {triggerResult.data?.buffer && (
                        <div className="mt-1 text-xs text-gray-600 space-y-0.5">
                          {Object.entries(triggerResult.data.buffer).map(([p, r]) => (
                            <div key={p}>• {p}: {r?.success ? `✅ queued (${r.buffer_id || 'id?'})` : r?.skipped ? `⚠️ skipped — ${r.reason}` : `❌ ${r?.error || 'failed'}`}</div>
                          ))}
                        </div>
                      )}
                      {triggerResult.error && <div className="mt-1 text-xs text-red-600">{triggerResult.error}</div>}
                    </div>
                    <button onClick={() => setTriggerResult(null)} className="text-gray-400 hover:text-gray-600 flex-shrink-0">✕</button>
                  </div>
                </div>
              )}

              <div className="divide-y divide-gray-100">
                {fns.map(fn => {
                  const lastRun = runs.find(r => r.function_name === fn.name);
                  const isRunning = triggering === fn.name;
                  return (
                    <div key={fn.name} className="px-5 py-3 flex items-center gap-4">
                      <div className="flex-1">
                        <div className="text-sm font-medium text-[#0F1631]">{fn.label}</div>
                        <div className="text-xs text-gray-400">{fn.schedule}</div>
                        {lastRun?.summary?.errors?.length > 0 && (
                          <div className="text-xs text-red-500 mt-0.5">Last error: {lastRun.summary.errors[0]}</div>
                        )}
                      </div>
                      <div className="flex items-center gap-2">
                        {fn.canTrigger && (
                          <button
                            onClick={() => triggerFn(fn.name)}
                            disabled={!!triggering}
                            className="text-xs px-2.5 py-1 bg-[#2D1FB1] text-white font-bold rounded-lg hover:bg-indigo-700 transition-colors disabled:opacity-40">
                            {isRunning ? '⏳ Running…' : '▶ Run Now'}
                          </button>
                        )}
                        {lastRun ? (
                          <div className="flex items-center gap-2">
                            <span className={`text-xs px-2 py-0.5 rounded-full font-semibold ${RUN_COLORS[lastRun.status] || 'bg-gray-100 text-gray-500'}`}>{lastRun.status}</span>
                            <span className="text-xs text-gray-400">{fmtRelative(lastRun.started_at)}</span>
                          </div>
                        ) : (
                          <span className="text-xs text-gray-300">No runs yet</span>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })()}

        {/* Exceptions */}
        <div className="bg-white border border-gray-200 rounded-xl overflow-hidden">
          <div className="px-5 py-3 border-b border-gray-100 flex items-center justify-between">
            <div className="font-bold text-[#0F1631] text-sm">Active Exceptions {exceptions.length > 0 && <span className="ml-2 bg-red-100 text-red-700 text-xs px-1.5 py-0.5 rounded-full">{exceptions.length}</span>}</div>
          </div>
          {exceptions.length === 0 ? (
            <div className="px-5 py-8 text-center text-green-600 text-sm font-semibold">✅ No active exceptions</div>
          ) : (
            <div className="divide-y divide-gray-100">
              {exceptions.map(ex => (
                <div key={ex.id} className="px-5 py-4 flex items-start gap-3">
                  <span className="text-lg flex-shrink-0">{SEV_ICONS[ex.severity] || '⚠️'}</span>
                  <div className="flex-1">
                    <div className="flex items-center gap-2 mb-0.5">
                      <span className="font-semibold text-sm text-[#0F1631]">{ex.title}</span>
                      <span className={`text-xs px-2 py-0.5 rounded-full font-semibold ${SEV_COLORS[ex.severity] || 'bg-gray-100 text-gray-500'}`}>{ex.severity}</span>
                    </div>
                    {ex.description && <div className="text-xs text-gray-500 mb-1">{ex.description}</div>}
                    <div className="text-xs text-gray-400">{fmtRelative(ex.created_at)}</div>
                  </div>
                  <button onClick={() => resolveException(ex)} disabled={!!resolving[ex.id]}
                    className="text-xs px-3 py-1.5 border border-gray-200 rounded-lg hover:bg-gray-50 disabled:opacity-40 transition-colors flex-shrink-0">
                    {resolving[ex.id] ? '…' : 'Resolve'}
                  </button>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    );
  }

  // ─── Content Engine ──────────────────────────────────────────────────────
  const PLATFORMS = [
    { id: 'linkedin',         label: 'LinkedIn',       icon: '💼' },
    { id: 'facebook',         label: 'Facebook',       icon: '📘' },
    { id: 'instagram',        label: 'Instagram',      icon: '📸' },
    { id: 'tiktok_script',    label: 'TikTok/Reels',   icon: '🎬' },
    { id: 'email_newsletter', label: 'Newsletter',     icon: '📧' },
    { id: 'blog',             label: 'Blog Post',      icon: '✍️' },
    { id: 'ad_copy',          label: 'Ad Copy',        icon: '📣' },
    { id: 'seo_meta',         label: 'SEO Meta',       icon: '🔍' },
  ];

  const TOPIC_SUGGESTIONS = [
    'Why rural nonprofits struggle to access USDA RMAP funding',
    'The 7 documents USDA reviewers look at first in every RMAP application',
    'What is a revolving loan fund and why does your rural community need one',
    'RBDG vs RMAP: which USDA program is right for your organization',
    'How to build a competitive RMAP work plan from scratch',
    '3 reasons most RMAP applications get scored low on the service area criterion',
    'The borrower-centered lending principles every microlender should know',
    'How to use AI to score your RMAP application before you submit',
    'IRP intermediary relending: the underused federal capital tool for rural CDFIs',
    '2 CFR 200 compliance basics for new federal grantees',
  ];

  function ContentEngine() {
    const [tab, setTab]               = useState('generate'); // generate | calendar | queue | settings
    const [platform, setPlatform]     = useState('linkedin');
    const [topic, setTopic]           = useState('');
    const [context, setContext]       = useState('');
    const [generating, setGenerating] = useState(false);
    const [result, setResult]         = useState(null);
    const [error, setError]           = useState('');
    const [posts, setPosts]           = useState([]);
    const [loadingPosts, setLoadingPosts] = useState(false);
    const [bvs, setBvs]               = useState(null);
    const [savingBvs, setSavingBvs]   = useState(false);
    const [approving, setApproving]   = useState({});
    const [csvExporting, setCsvExporting] = useState(false);

    useEffect(() => {
      if (tab === 'queue' || tab === 'calendar') loadPosts();
      if (tab === 'settings') loadBVS();
    }, [tab]);

    const loadPosts = async () => {
      setLoadingPosts(true);
      const sb = await getSupabase();
      if (!sb) { setLoadingPosts(false); return; }
      const { data } = await sb.from('social_posts').select('*').order('created_at', { ascending: false }).limit(100);
      setPosts(data || []);
      setLoadingPosts(false);
    };

    const loadBVS = async () => {
      const sb = await getSupabase();
      if (!sb) return;
      const { data } = await sb.from('brand_voice_settings').select('*').limit(1).maybeSingle();
      setBvs(data);
    };

    const saveBVS = async () => {
      if (!bvs) return;
      setSavingBvs(true);
      const sb = await getSupabase();
      if (!sb) { setSavingBvs(false); return; }
      await sb.from('brand_voice_settings').update({ ...bvs, updated_at: new Date().toISOString() }).eq('id', bvs.id);
      setSavingBvs(false);
    };

    const generate = async () => {
      if (!topic.trim()) return;
      setGenerating(true); setError(''); setResult(null);
      const sb = await getSupabase();
      if (!sb) { setGenerating(false); return; }
      try {
        const { data: { session } } = await sb.auth.getSession();
        const res = await fetch('/.netlify/functions/content-generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
          body: JSON.stringify({ platform, topic: topic.trim(), additional_context: context.trim() || undefined, save: true })
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Generation failed');
        setResult(json);
      } catch (e) { setError(e.message); }
      setGenerating(false);
    };

    const approvePost = async (post) => {
      setApproving(a => ({ ...a, [post.id]: true }));
      const sb = await getSupabase();
      if (!sb) { setApproving(a => ({ ...a, [post.id]: false })); return; }
      const { data: { user } } = await sb.auth.getUser();
      await sb.from('social_posts').update({ status: 'approved', approved_by: user.id, approved_at: new Date().toISOString() }).eq('id', post.id);
      setPosts(prev => prev.map(p => p.id === post.id ? { ...p, status: 'approved' } : p));
      setApproving(a => ({ ...a, [post.id]: false }));
    };

    const rejectPost = async (post) => {
      const note = prompt('Reason for rejection (optional):');
      const sb = await getSupabase();
      if (!sb) return;
      await sb.from('social_posts').update({ status: 'rejected', rejection_note: note || null }).eq('id', post.id);
      setPosts(prev => prev.map(p => p.id === post.id ? { ...p, status: 'rejected' } : p));
    };

    const exportCSV = () => {
      setCsvExporting(true);
      const approved = posts.filter(p => p.status === 'approved');
      if (!approved.length) { alert('No approved posts to export.'); setCsvExporting(false); return; }
      const rows = [['Platform','Type','Content','Hashtags','UTM URL','Status','Approved At']];
      approved.forEach(p => {
        rows.push([
          p.platform, p.content_type,
          `"${(p.body || '').replace(/"/g,'""')}"`,
          (p.hashtags || []).join(' '),
          p.utm_url || '',
          p.status,
          p.approved_at ? new Date(p.approved_at).toLocaleDateString() : ''
        ]);
      });
      const csv = rows.map(r => r.join(',')).join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `capfund-content-${new Date().toISOString().slice(0,10)}.csv`; a.click();
      URL.revokeObjectURL(url);
      setCsvExporting(false);
    };

    const STATUS_COLORS = {
      draft: 'bg-gray-100 text-gray-600', review: 'bg-amber-50 text-amber-700',
      approved: 'bg-green-50 text-green-700', rejected: 'bg-red-50 text-red-600',
      published: 'bg-blue-50 text-blue-700'
    };
    const PLATFORM_ICON = Object.fromEntries(PLATFORMS.map(p => [p.id, p.icon]));
    const reviewPosts = posts.filter(p => p.status === 'review');

    return (
      <div className="fade-in">
        <div className="flex items-center gap-1 border-b border-gray-200 mb-6">
          {[['generate','✨ Generate'],['queue','Approval Queue'],['calendar','Content Calendar'],['settings','Settings']].map(([id,label]) => (
            <button key={id} onClick={() => setTab(id)}
              className={`px-4 py-2.5 text-sm font-semibold border-b-2 transition-colors whitespace-nowrap ${tab===id ? 'border-[#2D1FB1] text-[#2D1FB1]' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>
              {label}
              {id === 'queue' && reviewPosts.length > 0 && <span className="ml-1.5 bg-amber-100 text-amber-700 text-xs px-1.5 py-0.5 rounded-full">{reviewPosts.length}</span>}
            </button>
          ))}
        </div>

        {/* GENERATE tab */}
        {tab === 'generate' && (
          <div className="grid md:grid-cols-2 gap-6">
            <div className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-gray-600 mb-2">Platform</label>
                <div className="grid grid-cols-4 gap-2">
                  {PLATFORMS.map(p => (
                    <button key={p.id} onClick={() => setPlatform(p.id)}
                      className={`py-2 px-1 rounded-xl border text-center transition-all ${platform === p.id ? 'bg-[#2D1FB1] border-[#2D1FB1] text-white' : 'border-gray-200 hover:border-[#2D1FB1] bg-white'}`}>
                      <div className="text-lg">{p.icon}</div>
                      <div className="text-[10px] font-semibold mt-0.5">{p.label}</div>
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-gray-600 mb-2">Topic / Angle</label>
                <textarea value={topic} onChange={e => setTopic(e.target.value)} rows={3}
                  className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#2D1FB1] resize-none"
                  placeholder="What should this content be about?" />
                <div className="mt-2">
                  <div className="text-xs text-gray-400 mb-1">Suggestions:</div>
                  <div className="flex flex-wrap gap-1">
                    {TOPIC_SUGGESTIONS.slice(0,4).map((s, i) => (
                      <button key={i} onClick={() => setTopic(s)} className="text-xs px-2.5 py-1 bg-gray-100 text-gray-600 rounded-full hover:bg-blue-50 hover:text-[#2D1FB1] transition-colors text-left">{s.slice(0,45)}…</button>
                    ))}
                  </div>
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-gray-600 mb-2">Additional Context (optional)</label>
                <textarea value={context} onChange={e => setContext(e.target.value)} rows={2}
                  className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#2D1FB1] resize-none"
                  placeholder="Specific cert to promote, current offer, seasonal angle…" />
              </div>

              <button onClick={generate} disabled={!topic.trim() || generating}
                className="w-full py-3.5 bg-[#2D1FB1] text-white font-black rounded-xl hover:bg-indigo-700 disabled:opacity-40 transition-colors flex items-center justify-center gap-2">
                {generating ? <>⏳ Generating…</> : <>✨ Generate {PLATFORMS.find(p=>p.id===platform)?.label} Content</>}
              </button>

              {error && <div className="p-3 bg-red-50 border border-red-200 rounded-xl text-sm text-red-700">{error}</div>}
            </div>

            {/* Result panel */}
            <div>
              {result ? (
                <div className="space-y-4">
                  {/* Compliance badge */}
                  <div className={`flex items-center gap-2 px-4 py-2.5 rounded-xl ${result.compliance.passed ? 'bg-green-50 border border-green-200' : 'bg-red-50 border border-red-200'}`}>
                    <span>{result.compliance.passed ? '✅' : '🚫'}</span>
                    <span className={`text-sm font-semibold ${result.compliance.passed ? 'text-green-700' : 'text-red-700'}`}>
                      {result.compliance.passed ? 'Compliance check passed' : `Blocked: ${result.compliance.flags.length} forbidden claim(s)`}
                    </span>
                    {result.status && <span className={`ml-auto text-xs px-2 py-0.5 rounded-full font-semibold ${STATUS_COLORS[result.status] || 'bg-gray-100 text-gray-600'}`}>{result.status}</span>}
                  </div>

                  {result.compliance.flags.length > 0 && (
                    <div className="bg-amber-50 border border-amber-200 rounded-xl p-3">
                      {result.compliance.flags.map((f, i) => (
                        <div key={i} className="text-xs text-amber-700"><span className="font-semibold">"{f.phrase}"</span> — {f.reason}</div>
                      ))}
                    </div>
                  )}

                  <div className="bg-white border border-gray-200 rounded-xl p-5">
                    <div className="flex items-center justify-between mb-3">
                      <div className="flex items-center gap-2">
                        <span>{PLATFORM_ICON[platform]}</span>
                        <span className="font-bold text-sm text-[#0F1631]">{PLATFORMS.find(p=>p.id===platform)?.label}</span>
                      </div>
                      <button onClick={() => navigator.clipboard.writeText(result.content)} className="text-xs text-[#2D1FB1] hover:underline font-semibold">Copy</button>
                    </div>
                    <div className="text-sm text-gray-700 leading-relaxed whitespace-pre-wrap">{result.content}</div>
                  </div>

                  {result.needs_review && (
                    <div className="text-xs text-amber-700 bg-amber-50 border border-amber-100 rounded-lg p-3">
                      📋 Queued for review in the Approval Queue tab.
                    </div>
                  )}
                </div>
              ) : (
                <div className="bg-gray-50 border border-gray-200 rounded-2xl h-full min-h-[300px] flex flex-col items-center justify-center text-center p-8">
                  <div className="text-4xl mb-3">✨</div>
                  <div className="font-bold text-gray-500 mb-1">Your content will appear here</div>
                  <div className="text-sm text-gray-400">Select a platform, enter a topic, and click Generate</div>
                </div>
              )}
            </div>
          </div>
        )}

        {/* APPROVAL QUEUE tab */}
        {tab === 'queue' && (
          <div>
            <div className="flex items-center justify-between mb-4">
              <div className="text-sm text-gray-500">{reviewPosts.length} post{reviewPosts.length !== 1 ? 's' : ''} awaiting approval</div>
              <button onClick={exportCSV} disabled={csvExporting} className="px-4 py-2 border border-gray-200 text-sm font-semibold rounded-lg hover:bg-gray-50 transition-colors flex items-center gap-1.5">
                📥 {csvExporting ? 'Exporting…' : 'Export Approved CSV'}
              </button>
            </div>
            {loadingPosts ? <div className="text-center py-12 text-gray-400">Loading…</div> : (
              <div className="space-y-4">
                {posts.filter(p => ['review','draft','approved','rejected'].includes(p.status)).map(post => (
                  <div key={post.id} className={`bg-white border rounded-xl p-5 ${post.status === 'review' ? 'border-amber-300' : 'border-gray-200'}`}>
                    <div className="flex items-start justify-between gap-4 mb-3">
                      <div className="flex items-center gap-2">
                        <span>{PLATFORM_ICON[post.platform] || '📄'}</span>
                        <span className="font-semibold text-sm text-[#0F1631] capitalize">{post.platform?.replace('_',' ')}</span>
                        <span className={`text-xs px-2 py-0.5 rounded-full font-semibold ${STATUS_COLORS[post.status] || 'bg-gray-100 text-gray-600'}`}>{post.status}</span>
                        {post.ai_generated && <span className="text-xs text-gray-400">AI</span>}
                      </div>
                      <span className="text-xs text-gray-400 flex-shrink-0">{new Date(post.created_at).toLocaleDateString()}</span>
                    </div>
                    <div className="text-sm text-gray-700 leading-relaxed mb-3 line-clamp-4 whitespace-pre-wrap">{post.body}</div>
                    {post.compliance_flags?.length > 0 && (
                      <div className="text-xs text-red-600 mb-2">⚠️ Flags: {post.compliance_flags.map(f => f.phrase).join(', ')}</div>
                    )}
                    {post.status === 'review' && (
                      <div className="flex gap-2 pt-2 border-t border-gray-100">
                        <button onClick={() => approvePost(post)} disabled={!!approving[post.id]}
                          className="px-4 py-1.5 bg-green-600 text-white text-xs font-bold rounded-lg hover:bg-green-700 disabled:opacity-50 transition-colors">
                          {approving[post.id] ? '…' : '✓ Approve'}
                        </button>
                        <button onClick={() => rejectPost(post)} className="px-4 py-1.5 bg-red-50 text-red-600 border border-red-200 text-xs font-bold rounded-lg hover:bg-red-100 transition-colors">
                          ✗ Reject
                        </button>
                        <button onClick={() => navigator.clipboard.writeText(post.body)} className="px-4 py-1.5 border border-gray-200 text-xs rounded-lg hover:bg-gray-50 transition-colors">
                          Copy
                        </button>
                      </div>
                    )}
                    {post.status === 'approved' && (
                      <div className="flex gap-2 pt-2 border-t border-gray-100">
                        <button onClick={() => navigator.clipboard.writeText(post.body)} className="px-4 py-1.5 border border-gray-200 text-xs rounded-lg hover:bg-gray-50 transition-colors">Copy for Buffer/Metricool</button>
                      </div>
                    )}
                  </div>
                ))}
                {posts.filter(p => ['review','draft','approved','rejected'].includes(p.status)).length === 0 && (
                  <div className="text-center py-12 text-gray-400">No posts yet. Generate some content first.</div>
                )}
              </div>
            )}
          </div>
        )}

        {/* CALENDAR tab */}
        {tab === 'calendar' && (
          <div>
            <div className="flex items-center justify-between mb-4">
              <div className="text-sm text-gray-500">Content calendar — approved posts ready to schedule</div>
              <button onClick={exportCSV} disabled={csvExporting} className="px-4 py-2 bg-[#F97316] text-white text-sm font-bold rounded-lg hover:bg-orange-600 transition-colors">
                📥 Export to CSV (Buffer/Metricool)
              </button>
            </div>
            <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 mb-4 text-sm text-amber-800">
              💡 Export approved content as CSV to import into Buffer, Metricool, or any social scheduler. Each row = one post.
            </div>
            {loadingPosts ? <div className="text-center py-12 text-gray-400">Loading…</div> : (
              <div className="space-y-2">
                {posts.filter(p => p.status === 'approved').map(post => (
                  <div key={post.id} className="bg-white border border-green-200 rounded-xl p-4 flex items-center gap-4">
                    <span className="text-xl">{PLATFORM_ICON[post.platform] || '📄'}</span>
                    <div className="flex-1 min-w-0">
                      <div className="text-sm font-medium text-[#0F1631] truncate">{post.body.slice(0,80)}…</div>
                      <div className="text-xs text-gray-400 capitalize">{post.platform?.replace('_',' ')} · {new Date(post.created_at).toLocaleDateString()}</div>
                    </div>
                    <button onClick={() => navigator.clipboard.writeText(post.body)} className="text-xs text-[#2D1FB1] font-semibold hover:underline flex-shrink-0">Copy</button>
                  </div>
                ))}
                {posts.filter(p => p.status === 'approved').length === 0 && (
                  <div className="text-center py-12 text-gray-400">No approved posts yet. Generate and approve content first.</div>
                )}
              </div>
            )}
          </div>
        )}

        {/* SETTINGS tab */}
        {tab === 'settings' && bvs && (
          <div className="max-w-2xl space-y-5">
            <div>
              <label className="block text-xs font-bold text-gray-600 mb-1">Autopilot Level</label>
              <select value={bvs.autopilot_level} onChange={e => setBvs(b => ({ ...b, autopilot_level: e.target.value }))}
                className="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#2D1FB1]">
                <option value="draft_only">Draft Only — all content stays draft, manual publish</option>
                <option value="approval_required">Approval Required — queued for human review before publish</option>
                <option value="preapproved">Preapproved Autopilot — approved instantly after compliance check</option>
                <option value="paused">Emergency Pause — all generation disabled</option>
              </select>
            </div>
            <div>
              <label className="block text-xs font-bold text-gray-600 mb-1">Brand Tone</label>
              <input value={bvs.tone} onChange={e => setBvs(b => ({ ...b, tone: e.target.value }))}
                className="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#2D1FB1]"
                placeholder="e.g. professional, trustworthy, accessible, institutional" />
            </div>
            <div>
              <label className="block text-xs font-bold text-gray-600 mb-1">Target Audience</label>
              <textarea value={bvs.audience} onChange={e => setBvs(b => ({ ...b, audience: e.target.value }))} rows={2}
                className="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#2D1FB1] resize-none" />
            </div>
            <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 text-xs text-amber-800">
              ⚠️ Forbidden claims are managed in the database (table: forbidden_claims). Any content containing those phrases will be blocked before saving.
            </div>
            <button onClick={saveBVS} disabled={savingBvs}
              className="px-6 py-2.5 bg-[#2D1FB1] text-white font-bold rounded-xl hover:bg-indigo-700 disabled:opacity-50 transition-colors text-sm">
              {savingBvs ? 'Saving…' : 'Save Settings'}
            </button>
          </div>
        )}
        {tab === 'settings' && !bvs && <div className="text-center py-12 text-gray-400">Loading settings… Run sql/12_content_schema.sql if this persists.</div>}
      </div>
    );
  }

  // ─── CRM Dashboard ───────────────────────────────────────────────────────
  function CRMDashboard() {
    const [leads, setLeads]           = useState([]);
    const [stages, setStages]         = useState([]);
    const [tasks, setTasks]           = useState([]);
    const [loading, setLoading]       = useState(true);
    const [view, setView]             = useState('pipeline'); // pipeline | list | lead | sequences | templates
    const [selectedLead, setSelectedLead] = useState(null);
    const [filter, setFilter]         = useState({ stage: '', source: '', tag: '' });
    const [search, setSearch]         = useState('');
    const [events, setEvents]         = useState([]);
    const [leadTasks, setLeadTasks]   = useState([]);
    const [newNote, setNewNote]       = useState('');
    const [newTask, setNewTask]       = useState('');
    const [savingNote, setSavingNote] = useState(false);
    const [sequences, setSequences]   = useState([]);
    const [templates, setTemplates]   = useState([]);

    useEffect(() => {
      loadCRM();
    }, []);

    const loadCRM = async () => {
      setLoading(true);
      const sb = await getSupabase();
      if (!sb) { setLoading(false); return; }
      const [{ data: l }, { data: s }, { data: t }] = await Promise.all([
        sb.from('leads').select('*, funnel_stages(name,color)').order('last_activity', { ascending: false }).limit(200),
        sb.from('funnel_stages').select('*').eq('is_active', true).order('sort_order'),
        sb.from('crm_tasks').select('*, leads(name,email)').eq('completed', false).order('due_at').limit(50)
      ]);
      setLeads(l || []);
      setStages(s || []);
      setTasks(t || []);
      setLoading(false);
    };

    const openLead = async (lead) => {
      setSelectedLead(lead);
      setView('lead');
      const sb = await getSupabase();
      if (!sb) return;
      const [{ data: ev }, { data: tk }] = await Promise.all([
        sb.from('crm_events').select('*').eq('lead_id', lead.id).order('created_at', { ascending: false }).limit(50),
        sb.from('crm_tasks').select('*').eq('lead_id', lead.id).order('created_at', { ascending: false })
      ]);
      setEvents(ev || []);
      setLeadTasks(tk || []);
    };

    const addNote = async () => {
      if (!newNote.trim() || !selectedLead) return;
      setSavingNote(true);
      const sb = await getSupabase();
      if (!sb) { setSavingNote(false); return; }
      const { data: ev } = await sb.from('crm_events').insert({
        lead_id: selectedLead.id, event_type: 'note', title: 'Note added', body: newNote.trim()
      }).select().single();
      if (ev) setEvents(prev => [ev, ...prev]);
      await sb.from('leads').update({ notes: newNote.trim(), last_activity: new Date().toISOString() }).eq('id', selectedLead.id);
      setNewNote('');
      setSavingNote(false);
    };

    const addTask = async () => {
      if (!newTask.trim() || !selectedLead) return;
      const sb = await getSupabase();
      if (!sb) return;
      const { data: task } = await sb.from('crm_tasks').insert({
        lead_id: selectedLead.id, title: newTask.trim(),
        due_at: new Date(Date.now() + 24*60*60*1000).toISOString()
      }).select().single();
      if (task) setLeadTasks(prev => [task, ...prev]);
      setNewTask('');
    };

    const completeTask = async (task) => {
      const sb = await getSupabase();
      if (!sb) return;
      await sb.from('crm_tasks').update({ completed: true, completed_at: new Date().toISOString() }).eq('id', task.id);
      setLeadTasks(prev => prev.map(t => t.id === task.id ? { ...t, completed: true } : t));
      setTasks(prev => prev.filter(t => t.id !== task.id));
    };

    const changeStage = async (leadId, stageId) => {
      const sb = await getSupabase();
      if (!sb) return;
      await sb.from('leads').update({ stage_id: stageId, last_activity: new Date().toISOString() }).eq('id', leadId);
      setLeads(prev => prev.map(l => l.id === leadId ? { ...l, stage_id: stageId } : l));
      if (selectedLead?.id === leadId) setSelectedLead(l => ({ ...l, stage_id: stageId }));
    };

    const loadSequences = async () => {
      const sb = await getSupabase();
      if (!sb) return;
      const { data } = await sb.from('email_sequences').select('*, email_sequence_steps(*)').order('name');
      setSequences(data || []);
    };

    const loadTemplates = async () => {
      const sb = await getSupabase();
      if (!sb) return;
      const { data } = await sb.from('email_templates').select('*').order('name');
      setTemplates(data || []);
    };

    useEffect(() => {
      if (view === 'sequences') loadSequences();
      if (view === 'templates') loadTemplates();
    }, [view]);

    const filteredLeads = leads.filter(l => {
      if (search && !`${l.name||''} ${l.email||''} ${l.organization||''}`.toLowerCase().includes(search.toLowerCase())) return false;
      if (filter.stage && l.stage_id !== filter.stage) return false;
      if (filter.source && l.source !== filter.source) return false;
      if (filter.tag && l.result_tag !== filter.tag) return false;
      return true;
    });

    const RESULT_COLORS = { beginner: '#F97316', developing: '#FFD23F', ready: '#2D1FB1', advanced: '#16A34A' };
    const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }) : '—';
    const fmtRelative = (d) => {
      if (!d) return '—';
      const diff = Date.now() - new Date(d).getTime();
      if (diff < 60000) return 'just now';
      if (diff < 3600000) return Math.floor(diff/60000) + 'm ago';
      if (diff < 86400000) return Math.floor(diff/3600000) + 'h ago';
      return Math.floor(diff/86400000) + 'd ago';
    };

    if (loading) return <div className="text-center py-12 text-gray-400">Loading CRM…</div>;

    return (
      <div className="fade-in">
        {/* CRM sub-nav */}
        <div className="flex items-center gap-1 border-b border-gray-200 mb-6 overflow-x-auto">
          {[['pipeline','Pipeline'],['list','All Leads'],['lead','Lead Detail'],['sequences','Email Sequences'],['templates','Templates']].map(([id,label]) => (
            (id !== 'lead' || selectedLead) && (
              <button key={id} onClick={() => setView(id)}
                className={`px-4 py-2.5 text-sm font-semibold whitespace-nowrap border-b-2 transition-colors ${view===id ? 'border-[#2D1FB1] text-[#2D1FB1]' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>
                {label}
                {id==='list' && <span className="ml-1.5 text-xs text-gray-400">({filteredLeads.length})</span>}
                {id==='pipeline' && tasks.length > 0 && <span className="ml-1.5 bg-orange-100 text-orange-700 text-xs px-1.5 py-0.5 rounded-full">{tasks.length}</span>}
              </button>
            )
          ))}
          <div className="flex-1"/>
          <input value={search} onChange={e => setSearch(e.target.value)}
            className="border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-[#2D1FB1] w-48 mr-2"
            placeholder="Search leads…" />
        </div>

        {/* PIPELINE view — stage columns */}
        {view === 'pipeline' && (
          <div>
            {/* Task strip */}
            {tasks.length > 0 && (
              <div className="mb-6 bg-amber-50 border border-amber-200 rounded-xl p-4">
                <div className="text-xs font-bold text-amber-800 mb-2 uppercase tracking-wider">Due Tasks ({tasks.length})</div>
                <div className="space-y-1">
                  {tasks.slice(0,5).map(task => (
                    <div key={task.id} className="flex items-center gap-3">
                      <button onClick={() => completeTask(task)} className="w-4 h-4 rounded border border-amber-400 flex-shrink-0 hover:bg-amber-200 transition-colors"/>
                      <span className="text-sm text-gray-700 flex-1">{task.title}</span>
                      <span className="text-xs text-gray-400">{task.leads?.name || task.leads?.email}</span>
                      <span className="text-xs text-amber-600">{task.due_at ? fmtDate(task.due_at) : 'No date'}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
            <div className="overflow-x-auto">
              <div className="flex gap-4 pb-4" style={{ minWidth: stages.length * 220 }}>
                {stages.map(stage => {
                  const stageLeads = filteredLeads.filter(l => l.stage_id === stage.id || (!l.stage_id && stage.slug === 'new_lead'));
                  return (
                    <div key={stage.id} className="flex-shrink-0 w-52">
                      <div className="flex items-center justify-between mb-3">
                        <div className="flex items-center gap-2">
                          <div className="w-2.5 h-2.5 rounded-full" style={{ background: stage.color }}/>
                          <span className="text-xs font-bold text-gray-700">{stage.name}</span>
                        </div>
                        <span className="text-xs text-gray-400 bg-gray-100 px-1.5 rounded-full">{stageLeads.length}</span>
                      </div>
                      <div className="space-y-2">
                        {stageLeads.slice(0,10).map(lead => (
                          <div key={lead.id} onClick={() => openLead(lead)}
                            className="bg-white border border-gray-200 rounded-xl p-3 cursor-pointer hover:shadow-md hover:border-[#2D1FB1] transition-all">
                            <div className="font-semibold text-xs text-[#0F1631] truncate mb-0.5">{lead.name || lead.email}</div>
                            {lead.organization && <div className="text-xs text-gray-400 truncate mb-1">{lead.organization}</div>}
                            <div className="flex items-center justify-between">
                              {lead.result_tag && <span className="text-xs px-1.5 py-0.5 rounded-full font-semibold" style={{ background: `${RESULT_COLORS[lead.result_tag]}20`, color: RESULT_COLORS[lead.result_tag] }}>{lead.result_tag}</span>}
                              <span className="text-xs text-gray-400 ml-auto">{fmtRelative(lead.last_activity)}</span>
                            </div>
                          </div>
                        ))}
                        {stageLeads.length > 10 && <div className="text-xs text-center text-gray-400 py-1">+{stageLeads.length-10} more</div>}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        )}

        {/* LIST view */}
        {view === 'list' && (
          <div>
            <div className="flex gap-2 mb-4 flex-wrap">
              <select value={filter.stage} onChange={e => setFilter(f => ({ ...f, stage: e.target.value }))}
                className="border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none">
                <option value="">All Stages</option>
                {stages.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
              </select>
              <select value={filter.tag} onChange={e => setFilter(f => ({ ...f, tag: e.target.value }))}
                className="border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none">
                <option value="">All Results</option>
                {['beginner','developing','ready','advanced'].map(t => <option key={t} value={t}>{t}</option>)}
              </select>
              <select value={filter.source} onChange={e => setFilter(f => ({ ...f, source: e.target.value }))}
                className="border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none">
                <option value="">All Sources</option>
                {['quiz','checklist','webinar','website','purchase'].map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            </div>
            <div className="bg-white border border-gray-200 rounded-xl overflow-hidden">
              <div className="grid grid-cols-12 px-5 py-2.5 bg-gray-50 text-xs font-semibold text-gray-500 border-b border-gray-100">
                <div className="col-span-3">Lead</div>
                <div className="col-span-2">Stage</div>
                <div className="col-span-2">Source</div>
                <div className="col-span-2">Score</div>
                <div className="col-span-2">Last Active</div>
                <div className="col-span-1"/>
              </div>
              {filteredLeads.length === 0 && <div className="text-center py-12 text-gray-400 text-sm">No leads found.</div>}
              {filteredLeads.map(lead => (
                <div key={lead.id} className="grid grid-cols-12 px-5 py-3.5 border-b border-gray-100 hover:bg-blue-50 transition-colors items-center">
                  <div className="col-span-3">
                    <div className="font-semibold text-sm text-[#0F1631] truncate">{lead.name || '—'}</div>
                    <div className="text-xs text-gray-400 truncate">{lead.email}</div>
                  </div>
                  <div className="col-span-2">
                    <select value={lead.stage_id || ''} onChange={e => changeStage(lead.id, e.target.value || null)}
                      className="border border-gray-200 rounded px-2 py-1 text-xs focus:outline-none w-full">
                      <option value="">Unset</option>
                      {stages.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                    </select>
                  </div>
                  <div className="col-span-2 text-xs text-gray-500 capitalize">{lead.source || '—'}</div>
                  <div className="col-span-2">
                    {lead.result_tag && <span className="text-xs px-2 py-0.5 rounded-full font-semibold capitalize" style={{ background: `${RESULT_COLORS[lead.result_tag]}20`, color: RESULT_COLORS[lead.result_tag] }}>{lead.result_tag}</span>}
                    {lead.quiz_score != null && <span className="text-xs text-gray-400 ml-1">{lead.quiz_score}%</span>}
                  </div>
                  <div className="col-span-2 text-xs text-gray-400">{fmtRelative(lead.last_activity)}</div>
                  <div className="col-span-1 text-right">
                    <button onClick={() => openLead(lead)} className="text-xs text-[#2D1FB1] font-semibold hover:underline">View</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* LEAD DETAIL view */}
        {view === 'lead' && selectedLead && (
          <div className="grid md:grid-cols-3 gap-6">
            {/* Left: lead info */}
            <div className="md:col-span-1 space-y-4">
              <div className="bg-white border border-gray-200 rounded-xl p-5">
                <div className="w-12 h-12 rounded-full bg-[#2D1FB1] text-white flex items-center justify-center font-black text-lg mb-3">
                  {(selectedLead.name || selectedLead.email || '?')[0].toUpperCase()}
                </div>
                <div className="font-bold text-[#0F1631]">{selectedLead.name || '—'}</div>
                <div className="text-sm text-gray-500 mb-3">{selectedLead.email}</div>
                {selectedLead.organization && <div className="text-xs text-gray-400 mb-1">🏢 {selectedLead.organization}</div>}
                {selectedLead.source && <div className="text-xs text-gray-400 mb-1">📥 Source: {selectedLead.source}</div>}
                {selectedLead.result_tag && <div className="text-xs font-semibold capitalize mt-2 px-2 py-0.5 rounded-full inline-block" style={{ background: `${RESULT_COLORS[selectedLead.result_tag]}20`, color: RESULT_COLORS[selectedLead.result_tag] }}>{selectedLead.result_tag}</div>}
                {selectedLead.quiz_score != null && <div className="text-xs text-gray-500 mt-1">Quiz score: {selectedLead.quiz_score}%</div>}
              </div>
              <div className="bg-white border border-gray-200 rounded-xl p-4">
                <div className="text-xs font-bold text-gray-600 mb-2">Stage</div>
                <select value={selectedLead.stage_id || ''} onChange={e => changeStage(selectedLead.id, e.target.value || null)}
                  className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#2D1FB1]">
                  <option value="">Unset</option>
                  {stages.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                </select>
              </div>
              {/* Tasks */}
              <div className="bg-white border border-gray-200 rounded-xl p-4">
                <div className="text-xs font-bold text-gray-600 mb-3">Tasks</div>
                <div className="flex gap-2 mb-3">
                  <input value={newTask} onChange={e => setNewTask(e.target.value)}
                    className="flex-1 border border-gray-200 rounded-lg px-2 py-1.5 text-xs focus:outline-none"
                    placeholder="Add a task…" onKeyDown={e => e.key === 'Enter' && addTask()} />
                  <button onClick={addTask} disabled={!newTask.trim()} className="px-3 py-1.5 bg-[#2D1FB1] text-white text-xs font-bold rounded-lg disabled:opacity-40">Add</button>
                </div>
                <div className="space-y-1.5">
                  {leadTasks.map(task => (
                    <div key={task.id} className={`flex items-center gap-2 text-xs ${task.completed ? 'opacity-40' : ''}`}>
                      <button onClick={() => !task.completed && completeTask(task)}
                        className={`w-4 h-4 rounded border flex-shrink-0 flex items-center justify-center transition-colors ${task.completed ? 'bg-green-100 border-green-300' : 'border-gray-300 hover:bg-gray-100'}`}>
                        {task.completed && <span className="text-green-600 text-xs">✓</span>}
                      </button>
                      <span className={task.completed ? 'line-through text-gray-400' : 'text-gray-700'}>{task.title}</span>
                    </div>
                  ))}
                  {leadTasks.length === 0 && <div className="text-xs text-gray-400 italic">No tasks</div>}
                </div>
              </div>
            </div>

            {/* Right: activity feed + note */}
            <div className="md:col-span-2 space-y-4">
              <div className="bg-white border border-gray-200 rounded-xl p-5">
                <div className="text-xs font-bold text-gray-600 mb-3">Add Note</div>
                <div className="flex gap-2">
                  <textarea value={newNote} onChange={e => setNewNote(e.target.value)} rows={2}
                    className="flex-1 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#2D1FB1] resize-none"
                    placeholder="Write a note about this lead…" />
                  <button onClick={addNote} disabled={!newNote.trim() || savingNote} className="px-4 bg-[#2D1FB1] text-white text-sm font-bold rounded-lg disabled:opacity-40 hover:bg-indigo-700 transition-colors self-start py-2">
                    {savingNote ? '…' : 'Save'}
                  </button>
                </div>
              </div>
              <div className="bg-white border border-gray-200 rounded-xl p-5">
                <div className="text-xs font-bold text-gray-600 mb-4">Activity Feed</div>
                {events.length === 0 && <div className="text-sm text-gray-400 italic">No activity yet.</div>}
                <div className="space-y-3">
                  {events.map(ev => (
                    <div key={ev.id} className="flex items-start gap-3">
                      <div className="w-7 h-7 rounded-full bg-gray-100 flex items-center justify-center text-xs flex-shrink-0">
                        {ev.event_type === 'note' ? '📝' : ev.event_type === 'email_sent' ? '📧' : ev.event_type === 'stage_change' ? '🔄' : '📋'}
                      </div>
                      <div className="flex-1">
                        <div className="text-sm font-medium text-[#0F1631]">{ev.title}</div>
                        {ev.body && <div className="text-xs text-gray-500 mt-0.5 leading-relaxed">{ev.body}</div>}
                        <div className="text-xs text-gray-400 mt-0.5">{fmtDate(ev.created_at)}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        )}

        {/* SEQUENCES view */}
        {view === 'sequences' && (
          <div>
            <div className="flex justify-between items-center mb-4">
              <div className="text-sm text-gray-500">{sequences.length} email sequences configured</div>
            </div>
            <div className="space-y-3">
              {sequences.map(seq => (
                <div key={seq.id} className="bg-white border border-gray-200 rounded-xl p-5">
                  <div className="flex items-center justify-between mb-2">
                    <div>
                      <div className="font-bold text-[#0F1631] text-sm">{seq.name}</div>
                      <div className="text-xs text-gray-400">Trigger: {seq.trigger_event}{seq.result_tag ? ` · Tag: ${seq.result_tag}` : ''}</div>
                    </div>
                    <span className={`text-xs px-2.5 py-1 rounded-full font-semibold ${seq.is_active ? 'bg-green-50 text-green-700' : 'bg-gray-100 text-gray-400'}`}>
                      {seq.is_active ? 'Active' : 'Paused'}
                    </span>
                  </div>
                  {seq.email_sequence_steps?.length > 0 && (
                    <div className="text-xs text-gray-400 mt-1">{seq.email_sequence_steps.length} email{seq.email_sequence_steps.length !== 1 ? 's' : ''} · steps: {seq.email_sequence_steps.map(s => `+${s.delay_hours}h`).join(', ')}</div>
                  )}
                </div>
              ))}
              {sequences.length === 0 && <div className="text-center py-12 text-gray-400">No sequences found. Run sql/11_crm_schema.sql to seed defaults.</div>}
            </div>
          </div>
        )}

        {/* TEMPLATES view */}
        {view === 'templates' && (
          <div className="space-y-3">
            {templates.map(tmpl => (
              <div key={tmpl.id} className="bg-white border border-gray-200 rounded-xl p-5">
                <div className="flex items-center justify-between mb-1">
                  <div className="font-bold text-[#0F1631] text-sm">{tmpl.name}</div>
                  <span className="text-xs text-gray-400 font-mono">{tmpl.slug}</span>
                </div>
                <div className="text-xs text-gray-500 mb-2">Subject: {tmpl.subject}</div>
                {tmpl.variables?.length > 0 && (
                  <div className="text-xs text-gray-400">Variables: {tmpl.variables.map(v => `{{${v}}}`).join(', ')}</div>
                )}
              </div>
            ))}
            {templates.length === 0 && <div className="text-center py-12 text-gray-400">No templates found. Run sql/11_crm_schema.sql to seed defaults.</div>}
          </div>
        )}
      </div>
    );
  }

  // ─── Admin Offers Manager ─────────────────────────────────────────────────
  function AdminOffersManager() {
    const [offers, setOffers] = useState([]);
    const [coupons, setCoupons] = useState([]);
    const [orders, setOrders] = useState([]);
    const [tab, setTab] = useState('offers');
    const [loading, setLoading] = useState(true);
    const [editing, setEditing] = useState(null);
    const [saving, setSaving] = useState(false);

    useEffect(() => {
      (async () => {
        const sb = await getSupabase();
        if (!sb) { setLoading(false); return; }
        const [{ data: o }, { data: c }, { data: ord }] = await Promise.all([
          sb.from('offers').select('*').order('sort_order'),
          sb.from('coupons').select('*').order('created_at', { ascending: false }),
          sb.from('orders').select('*, offers(title), profiles(full_name,email)').order('created_at', { ascending: false }).limit(50)
        ]);
        setOffers(o || []);
        setCoupons(c || []);
        setOrders(ord || []);
        setLoading(false);
      })();
    }, []);

    const saveOffer = async (offer) => {
      setSaving(true);
      const sb = await getSupabase();
      if (!sb) { setSaving(false); return; }
      if (offer.id) {
        const { data } = await sb.from('offers').update({ ...offer, updated_at: new Date().toISOString() }).eq('id', offer.id).select().single();
        setOffers(prev => prev.map(o => o.id === data.id ? data : o));
      } else {
        const { data } = await sb.from('offers').insert({ ...offer }).select().single();
        setOffers(prev => [...prev, data]);
      }
      setSaving(false);
      setEditing(null);
    };

    const toggleActive = async (offer) => {
      const sb = await getSupabase();
      if (!sb) return;
      await sb.from('offers').update({ is_active: !offer.is_active }).eq('id', offer.id);
      setOffers(prev => prev.map(o => o.id === offer.id ? { ...o, is_active: !o.is_active } : o));
    };

    const fmt = (cents) => '$' + (cents / 100).toLocaleString();
