    if (_supabase) return _supabase;
    const url = window.ENV?.SUPABASE_URL;
    const key = window.ENV?.SUPABASE_ANON_KEY;
    if (!url || url === 'YOUR_SUPABASE_URL' || !key || key === 'YOUR_SUPABASE_ANON_KEY') {
      return null;
    }
    try {
      const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2.58.0');
      _supabase = createClient(url, key);
      return _supabase;

      return null;

  function LeadCaptureForm() {
    const [form, setForm] = useState({ name: '', email: '', organization: '' });
    const [status, setStatus] = useState('idle'); // idle | loading | success | error

    const handleChange = e => setForm(f => ({ ...f, [e.target.name]: e.target.value }));

    const handleSubmit = async e => {
      e.preventDefault();
      setStatus('loading');
      try {
        const sb = await getSupabase();
        if (sb) {
          const { error } = await sb.from('leads').insert([{
            name: form.name,
            email: form.email,
            organization: form.organization,
            source: 'checklist',
          }]);
          if (error) {
            // Silent — still show success to user
          }
        }
        setStatus('success');
        setForm({ name: '', email: '', organization: '' });
      } catch {
        setStatus('success'); // Show success regardless of backend state
      }
    };

            <label htmlFor="lead-email" className="block text-sm font-medium text-gray-700 mb-1">Email Address</label>

  // ─── Login Modal ──────────────────────────────────────────────────────────
  function LoginModal({ open, onClose, onLoginSuccess }) {
    const [form, setForm] = useState({ email: '', password: '' });
    const [error, setError] = useState('');
    const [loading, setLoading] = useState(false);

    const handleChange = e => setForm(f => ({ ...f, [e.target.name]: e.target.value }));

    const handleSubmit = async e => {
      e.preventDefault();
      setError('');
      setLoading(true);
      try {
        const sb = await getSupabase();
        if (!sb) {
          setError('Authentication is not configured yet. Please check back later.');
          setLoading(false);
          return;
        }
        const { data, error: authError } = await sb.auth.signInWithPassword({
          email: form.email,
          password: form.password,
        });
        if (authError) {
          setError(authError.message);
          setLoading(false);
          return;
        }
        onLoginSuccess(data.user);
        onClose();
      } catch {
        setError('An unexpected error occurred. Please try again.');
        setLoading(false);
      }
    };

    if (!open) return null;

    return (
      <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 px-4" role="dialog" aria-modal="true" aria-label="Login">
        <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 fade-in">

                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12"/>

            </button>

              <input

            </div>
            <div>
              <label htmlFor="login-password" className="block text-sm font-medium text-gray-700 mb-1">Password</label>
              <input
                id="login-password"
                name="password"
                type="password"
                required
                autoComplete="current-password"
                value={form.password}
                onChange={handleChange}
                className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#2D1FB1]"
              />
            </div>
            {error && (
              <div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-3 py-2">{error}</div>
            )}
            <button
              type="submit"
              disabled={loading}
              className="w-full py-3 bg-[#F97316] text-white font-semibold rounded-lg hover:bg-orange-600 transition-colors disabled:opacity-60"
            >
              {loading ? 'Signing in…' : 'Sign In'}

          <p className="mt-4 text-xs text-center text-gray-400">
            No account? Contact <a href="mailto:support@capfundacademy.com" className="underline">support@capfundacademy.com</a>
          </p>
        </div>
      </div>
    );
  }

  // ─── Dashboard (Phase 2 placeholder) ─────────────────────────────────────
  // ─── Markdown renderer ───────────────────────────────────────────────────
  function renderMarkdown(text) {
    if (!text) return '';
    let html = text
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/^#{3} (.+)$/gm, '<h3 class="text-lg font-bold text-[#0F1631] mt-6 mb-2">$1</h3>')
      .replace(/^#{2} (.+)$/gm, '<h2 class="text-xl font-bold text-[#0F1631] mt-8 mb-3">$1</h2>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/`(.+?)`/g, '<code class="bg-gray-100 px-1.5 py-0.5 rounded text-sm font-mono">$1</code>')
      .replace(/^---$/gm, '<hr class="my-6 border-gray-200"/>')
      .replace(/^\| (.+) \|$/gm, (row) => {
        const cells = row.split('|').filter(c => c.trim() && !c.trim().match(/^[-\s]+$/));
        if (!cells.length) return '';
        return '<tr>' + cells.map(c => `<td class="border border-gray-200 px-3 py-2 text-sm">${c.trim()}</td>`).join('') + '</tr>';
      })
      .replace(/(<tr>.*<\/tr>\n?)+/gs, m => `<div class="overflow-x-auto my-4"><table class="min-w-full border-collapse border border-gray-200 rounded-lg">${m}</table></div>`)
      .replace(/^☐ (.+)$/gm, '<div class="flex items-start gap-2 my-1"><span class="text-gray-400 mt-0.5">☐</span><span>$1</span></div>')
      .replace(/^\d+\. (.+)$/gm, '<li class="ml-5 list-decimal my-0.5">$1</li>')
      .replace(/^- (.+)$/gm, '<li class="ml-5 list-disc my-0.5">$1</li>')
      .replace(/(<li.*<\/li>\n?)+/gs, m => `<ul class="my-3 space-y-1">${m}</ul>`)
      .replace(/^(.+)$/gm, (line) => {
        if (line.match(/^<[a-zA-Z]/) || !line.trim()) return line;
        return `<p class="my-3 leading-relaxed text-gray-700">${line}</p>`;
      });
    return html;
  }

  function StudyCoach({ lesson, cert, open, onClose, profile }) {
    const [messages, setMessages] = useState([]);

    const bottomRef = useRef(null);

        }]);
      }
    }, [open]);

    useEffect(() => {
      bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
    }, [messages]);

    const send = async () => {
      const text = input.trim();
      if (!text || loading) return;
      setInput('');
      const newMessages = [...messages, { role: 'user', content: text }];
      setMessages(newMessages);
      setLoading(true);
      try {
        const sb = await getSupabase();
        if (!sb) throw new Error('Not connected');
        const { data: { session } } = await sb.auth.getSession();
        const res = await fetch('/.netlify/functions/ai-coach', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
          body: JSON.stringify({
            messages: newMessages.map(m => ({ role: m.role, content: m.content })),

          })
        });

        setMessages(prev => [...prev, { role: 'assistant', content: json.answer || 'I had trouble generating a response. Please try again.' }]);

        setMessages(prev => [...prev, { role: 'assistant', content: 'Connection error. Please check your internet and try again.' }]);

              </div>
            </div>

                  dangerouslySetInnerHTML={{ __html: renderMsg(msg.content) }} />

                  <div className="flex gap-1 items-center">
                    <div className="w-2 h-2 rounded-full bg-gray-400 animate-bounce" style={{ animationDelay: '0ms' }}/>
                    <div className="w-2 h-2 rounded-full bg-gray-400 animate-bounce" style={{ animationDelay: '150ms' }}/>
                    <div className="w-2 h-2 rounded-full bg-gray-400 animate-bounce" style={{ animationDelay: '300ms' }}/>

          </div>
        </div>
      </div>
    );

  // ─── Quiz Player ─────────────────────────────────────────────────────────
  function QuizPlayer({ cert, quiz, onBack, onPassed, profile }) {
    const [questions, setQuestions] = useState([]);
    const [loading, setLoading] = useState(true);
    const [idx, setIdx] = useState(0);
    const [answers, setAnswers] = useState({});
    const [submitted, setSubmitted] = useState(false);
    const [score, setScore] = useState(null);
    const [saving, setSaving] = useState(false);
    const [certClaimed, setCertClaimed] = useState(false);

    useEffect(() => {
      (async () => {
        const sb = await getSupabase();
        if (!sb) { setLoading(false); return; }
        const { data } = await sb.from('quiz_questions').select('*').eq('quiz_id', quiz.id).order('sort_order');
        setQuestions(data || []);
        setLoading(false);
      })();
    }, [quiz.id]);

    const q = questions[idx];
    const total = questions.length;
    const pct = total ? Math.round((idx / total) * 100) : 0;

    const submit = async () => {
      const correct = questions.filter(q => answers[q.id] === q.correct_option_id).length;
      const sc = Math.round((correct / total) * 100);
      setScore(sc);
      setSubmitted(true);
      const sb = await getSupabase();
      if (sb) {
        const { data: { user } } = await sb.auth.getUser();
        await sb.from('quiz_attempts').insert({
          user_id: user.id, quiz_id: quiz.id, certification_id: cert.id,
          answers, score: sc, passed: sc >= quiz.passing_score,
          started_at: new Date().toISOString(), completed_at: new Date().toISOString()
        });
      }
    };

    const claimCertificate = async () => {
      setSaving(true);
      const sb = await getSupabase();
      if (sb) {
        const { data: { user } } = await sb.auth.getUser();
        const { data: prof } = await sb.from('profiles').select('full_name').eq('id', user.id).maybeSingle();
        const certNum = 'CFA-' + Date.now().toString(36).toUpperCase();
        const { data: comp } = await sb.from('certification_completions').upsert({
          user_id: user.id, certification_id: cert.id,
          artifact_submitted: false, completed_at: new Date().toISOString(),
          certificate_number: certNum
        }, { onConflict: 'user_id,certification_id' }).select().maybeSingle();
        if (comp) {
          await sb.from('certificates').upsert({
            user_id: user.id, certification_id: cert.id, completion_id: comp.id,
            recipient_name: prof?.full_name || user.email,
            cert_title: cert.title, cert_number: certNum, score, issued_at: new Date().toISOString()
          }, { onConflict: 'cert_number' });
        }
        setCertClaimed(true);
        onPassed && onPassed();
      }
      setSaving(false);
    };

    if (loading) return <div className="text-center py-20 text-gray-400">Loading quiz…</div>;

    if (submitted) {
      const passed = score >= quiz.passing_score;
      return (
        <main className="max-w-3xl mx-auto px-4 py-10 fade-in">
          <div className={`rounded-2xl p-8 mb-8 text-center ${passed ? 'bg-green-50 border border-green-200' : 'bg-red-50 border border-red-200'}`}>
            <div className={`text-5xl font-black mb-2 ${passed ? 'text-green-600' : 'text-red-500'}`}>{score}%</div>
            <div className={`text-xl font-bold mb-1 ${passed ? 'text-green-700' : 'text-red-600'}`}>{passed ? '🎉 You passed!' : 'Not quite — keep learning'}</div>
            <div className="text-sm text-gray-500">Required: {quiz.passing_score}% · Your score: {score}%</div>
          </div>
          {passed && !certClaimed && (
            <div className="text-center mb-8">
              <button onClick={claimCertificate} disabled={saving}
                className="px-8 py-3 bg-[#F97316] text-white font-bold rounded-xl hover:bg-orange-600 transition-colors disabled:opacity-50">
                {saving ? 'Claiming…' : '🏆 Claim Your Certificate'}
              </button>
            </div>
          )}
          {certClaimed && <div className="text-center text-green-600 font-semibold mb-8">✓ Certificate claimed! View it in your Dashboard.</div>}
          <div className="space-y-4">
            {questions.map((q, i) => {
              const userAns = answers[q.id];
              const correct = userAns === q.correct_option_id;
              return (
                <div key={q.id} className={`p-5 rounded-xl border ${correct ? 'border-green-200 bg-green-50' : 'border-red-200 bg-red-50'}`}>
                  <div className="font-semibold text-sm text-[#0F1631] mb-2">{i+1}. {q.question_text}</div>
                  <div className="text-sm mb-2">
                    {(q.options||[]).map(opt => (
                      <div key={opt.id} className={`py-0.5 ${opt.id === q.correct_option_id ? 'text-green-700 font-semibold' : opt.id === userAns && !correct ? 'text-red-600 line-through' : 'text-gray-500'}`}>
                        {opt.id.toUpperCase()}. {opt.text}
                      </div>
                    ))}
                  </div>
                  {q.explanation && <div className="text-xs text-gray-600 bg-white/60 rounded p-2">{q.explanation}</div>}
                </div>
              );
            })}
          </div>
          <div className="mt-8 text-center">
            <button onClick={onBack} className="px-6 py-2 border border-gray-200 text-gray-600 text-sm rounded-lg hover:bg-gray-50 transition-colors">
              ← Back to Certification
            </button>
          </div>
        </main>
      );
    }

    if (!q) return null;
    return (
      <main className="max-w-2xl mx-auto px-4 py-10 fade-in">
        <div className="mb-6">
          <div className="flex justify-between text-xs text-gray-500 mb-1"><span>Question {idx+1} of {total}</span><span>{pct}%</span></div>
          <div className="h-1.5 bg-gray-100 rounded-full"><div className="h-1.5 bg-[#2D1FB1] rounded-full transition-all" style={{ width: `${pct}%` }}/></div>
        </div>
        <div className="bg-white rounded-2xl border border-gray-200 p-8 mb-4">
          <div className="text-lg font-bold text-[#0F1631] mb-6 leading-snug">{q.question_text}</div>
          <div className="space-y-3">
            {(q.options||[]).map(opt => (
              <button key={opt.id} onClick={() => setAnswers(a => ({ ...a, [q.id]: opt.id }))}
                className={`w-full text-left px-4 py-3.5 rounded-xl border text-sm font-medium transition-all ${answers[q.id] === opt.id ? 'bg-[#2D1FB1] border-[#2D1FB1] text-white' : 'bg-white border-gray-200 text-gray-700 hover:border-[#2D1FB1]'}`}>
                <span className="font-bold mr-2">{opt.id.toUpperCase()}.</span> {opt.text}
              </button>
            ))}
          </div>
        </div>
        <div className="flex justify-between">
          <button onClick={() => setIdx(i => Math.max(0, i-1))} disabled={idx === 0}
            className="px-4 py-2 text-sm text-gray-500 border border-gray-200 rounded-lg hover:bg-gray-50 disabled:opacity-30 transition-colors">← Previous</button>
          {idx < total - 1 ? (
            <button onClick={() => setIdx(i => i+1)} disabled={!answers[q.id]}
              className="px-6 py-2 bg-[#2D1FB1] text-white text-sm font-bold rounded-lg hover:bg-indigo-700 disabled:opacity-30 transition-colors">Next →</button>
          ) : (
            <button onClick={submit} disabled={Object.keys(answers).length < total}
              className="px-6 py-2 bg-[#F97316] text-white text-sm font-bold rounded-lg hover:bg-orange-600 disabled:opacity-30 transition-colors">Submit Quiz</button>
          )}
        </div>
      </main>
    );
  }

  // ─── Student Dashboard ───────────────────────────────────────────────────
  function StudentDashboard({ user, profile, onSignOut, onOpenCatalog, onSelectCert }) {
    const [certs, setCerts] = useState([]);
    const [progress, setProgress] = useState([]);
    const [completions, setCompletions] = useState([]);
    const [certificates, setMyCerts] = useState([]);
    const [viewingCert, setViewingCert] = useState(null);
    const [loading, setLoading] = useState(true);

    useEffect(() => {
      (async () => {
        const sb = await getSupabase();
        if (!sb) { setLoading(false); return; }
        const [{ data: c }, { data: p }, { data: comp }, { data: myCerts }] = await Promise.all([
          sb.from('certifications').select('*').eq('status','approved').order('cert_number'),
          sb.from('student_progress').select('*'),
          sb.from('certification_completions').select('*'),
          sb.from('certificates').select('*, certifications(title)').order('issued_at', { ascending: false })
        ]);
        setCerts(c || []);
        setProgress(p || []);
        setCompletions(comp || []);
        setMyCerts(myCerts || []);
        setLoading(false);
      })();
    }, []);

    const completedCertIds = new Set(completions.map(c => c.certification_id));
    const inProgress = certs.filter(c => progress.some(p => p.certification_id === c.id) && !completedCertIds.has(c.id));
    const completed = certs.filter(c => completedCertIds.has(c.id));

    const lessonsPct = (cert) => {
      const certProgress = progress.filter(p => p.certification_id === cert.id && p.status === 'completed');
      return certProgress.length;
    };

    if (loading) return <div className="text-center py-20 text-gray-400">Loading your dashboard…</div>;

    if (viewingCert) {
      return <CertificateView cert={viewingCert} onClose={() => setViewingCert(null)} />;
    }

    return (
      <main className="max-w-5xl mx-auto px-4 py-10 fade-in">
        <div className="flex items-start justify-between mb-8">
          <div>
            <h1 className="text-3xl font-bold text-[#0F1631] mb-1">Welcome back{profile?.full_name ? `, ${profile.full_name.split(' ')[0]}` : ''}!</h1>
            <p className="text-gray-500 text-sm">{user?.email} · Student</p>
          </div>
          <button onClick={onSignOut} className="px-4 py-2 border border-gray-200 text-gray-500 text-sm rounded-lg hover:bg-gray-50 transition-colors">Sign Out</button>
        </div>

        <div className="grid grid-cols-3 gap-4 mb-10">
          <div className="bg-white border border-gray-200 rounded-xl p-5 text-center">
            <div className="text-3xl font-black text-[#2D1FB1] mb-1">{inProgress.length}</div>
            <div className="text-xs text-gray-500 font-medium">In Progress</div>
          </div>
          <div className="bg-white border border-gray-200 rounded-xl p-5 text-center">
            <div className="text-3xl font-black text-green-600 mb-1">{completed.length}</div>
            <div className="text-xs text-gray-500 font-medium">Completed</div>
          </div>
          <div className="bg-white border border-gray-200 rounded-xl p-5 text-center">
            <div className="text-3xl font-black text-[#F97316] mb-1">{certificates.length}</div>
            <div className="text-xs text-gray-500 font-medium">Certificates</div>
          </div>
        </div>

        {inProgress.length > 0 && (
          <div className="mb-8">
            <h2 className="text-lg font-bold text-[#0F1631] mb-4">Continue Learning</h2>
            <div className="space-y-3">
              {inProgress.slice(0,3).map(cert => (
                <div key={cert.id} className="bg-white border border-gray-200 rounded-xl p-5 flex items-center gap-4 hover:shadow-md transition-shadow cursor-pointer" onClick={() => onSelectCert(cert)}>
                  <div className="w-10 h-10 rounded-lg bg-[#2D1FB1] text-white flex items-center justify-center font-black text-sm flex-shrink-0">{String(cert.cert_number).padStart(2,'0')}</div>
                  <div className="flex-1 min-w-0">
                    <div className="font-semibold text-[#0F1631] text-sm truncate">{cert.title}</div>
                    <div className="text-xs text-gray-400 mt-0.5">{lessonsPct(cert)} lessons completed</div>
                  </div>
                  <span className="text-[#2D1FB1] text-sm font-semibold flex-shrink-0">Continue →</span>
                </div>
              ))}
            </div>
          </div>
        )}

        {certificates.length > 0 && (
          <div className="mb-8">
            <h2 className="text-lg font-bold text-[#0F1631] mb-4">My Certificates</h2>
            <div className="space-y-3">
              {certificates.map(cert => (
                <div key={cert.id} className="bg-white border border-green-200 rounded-xl p-5 flex items-center gap-4">
                  <div className="w-10 h-10 rounded-lg bg-green-100 text-green-600 flex items-center justify-center flex-shrink-0">🏆</div>
                  <div className="flex-1">
                    <div className="font-semibold text-[#0F1631] text-sm">{cert.certifications?.title || cert.cert_title}</div>
                    <div className="text-xs text-gray-400 mt-0.5">{cert.cert_number} · {new Date(cert.issued_at).toLocaleDateString()}</div>
                  </div>
                  <button onClick={() => setViewingCert(cert)} className="px-4 py-1.5 bg-green-600 text-white text-xs font-semibold rounded-lg hover:bg-green-700 transition-colors">View</button>
                </div>
              ))}
            </div>
          </div>
        )}

        <div className="bg-blue-50 border border-blue-100 rounded-2xl p-6 flex items-center justify-between">
          <div>
            <div className="font-bold text-[#0F1631] mb-1">Browse all 17 certifications</div>
            <div className="text-sm text-gray-500">From Microfinance Foundations to the Master Capstone.</div>
          </div>
          <button onClick={onOpenCatalog} className="px-5 py-2.5 bg-[#2D1FB1] text-white text-sm font-bold rounded-xl hover:bg-indigo-700 transition-colors flex-shrink-0">Browse Catalog →</button>
        </div>
      </main>
    );
  }

  // ─── Admin Dashboard ─────────────────────────────────────────────────────
  function AdminDashboard({ user, profile, onSignOut }) {
    const [tab, setTab] = useState('autopilot');
    const [certs, setCerts] = useState([]);
    const [students, setStudents] = useState([]);
    const [draftLessons, setDraftLessons] = useState([]);
    const [loading, setLoading] = useState(true);
    const [approving, setApproving] = useState({});

    useEffect(() => {
      (async () => {
        const sb = await getSupabase();
        if (!sb) { setLoading(false); return; }
        const [{ data: c }, { data: s }, { data: dl }] = await Promise.all([
          sb.from('certifications').select('*').order('cert_number'),
          sb.from('profiles').select('id,full_name,email,role,created_at').in('role', ['student','organization_owner','organization_manager']).order('created_at', { ascending: false }),
          sb.from('lessons').select('*, modules(title, certifications(title))').in('status', ['draft','review']).order('created_at', { ascending: false })
        ]);
        setCerts(c || []);
        setStudents(s || []);
        setDraftLessons(dl || []);
        setLoading(false);
      })();
    }, []);

    const approveCert = async (cert) => {
      setApproving(a => ({ ...a, [cert.id]: true }));
      const sb = await getSupabase();
      if (sb) {
        await sb.from('certifications').update({ status: 'approved' }).eq('id', cert.id);
        setCerts(prev => prev.map(c => c.id === cert.id ? { ...c, status: 'approved' } : c));
      }
      setApproving(a => ({ ...a, [cert.id]: false }));
    };

    const approveLesson = async (lesson) => {
      setApproving(a => ({ ...a, [lesson.id]: true }));
      const sb = await getSupabase();
      if (sb) {
        await sb.from('lessons').update({ status: 'approved', reviewed_at: new Date().toISOString() }).eq('id', lesson.id);
        setDraftLessons(prev => prev.filter(l => l.id !== lesson.id));
      }
      setApproving(a => ({ ...a, [lesson.id]: false }));
    };

    const draftCount = certs.filter(c => c.status !== 'approved').length;

    return (
      <main className="max-w-6xl mx-auto px-4 py-10 fade-in">
        <div className="flex items-start justify-between mb-8">
          <div>
            <h1 className="text-3xl font-bold text-[#0F1631] mb-1">Admin Dashboard</h1>
            <p className="text-gray-500 text-sm">{user?.email} · {profile?.role?.replace('_',' ')}</p>
          </div>
          <button onClick={onSignOut} className="px-4 py-2 border border-gray-200 text-gray-500 text-sm rounded-lg hover:bg-gray-50 transition-colors">Sign Out</button>
        </div>
        <div className="flex gap-1 border-b border-gray-200 mb-8">
          {[['autopilot','🤖 Autopilot'],['certifications','Certifications'],['students','Students'],['review','Content Review'],['commerce','Offers & Orders'],['crm','CRM'],['content','Content Engine']].map(([id,label]) => (
            <button key={id} onClick={() => setTab(id)}
              className={`px-5 py-3 text-sm font-semibold border-b-2 transition-colors ${tab===id ? 'border-[#2D1FB1] text-[#2D1FB1]' : 'border-transparent text-gray-500 hover:text-[#0F1631]'}`}>
              {label}
              {id==='certifications' && draftCount > 0 && <span className="ml-2 bg-amber-100 text-amber-700 text-xs px-1.5 py-0.5 rounded-full">{draftCount}</span>}
              {id==='review' && draftLessons.length > 0 && <span className="ml-2 bg-amber-100 text-amber-700 text-xs px-1.5 py-0.5 rounded-full">{draftLessons.length}</span>}
            </button>
          ))}
        </div>
        {loading ? <div className="text-center py-20 text-gray-400">Loading…</div> : (<>
          {tab === 'certifications' && (
            <div className="space-y-2">
              {certs.map(cert => (
                <div key={cert.id} className="bg-white border border-gray-200 rounded-xl p-5 flex items-center gap-4">
                  <span className="font-black text-gray-300 text-lg w-8">{String(cert.cert_number).padStart(2,'0')}</span>
                  <div className="flex-1">
                    <div className="font-semibold text-[#0F1631] text-sm">{cert.title}</div>
                    <div className="text-xs text-gray-400">{cert.hours_min}–{cert.hours_max}h</div>
                  </div>
                  {cert.status === 'approved'
                    ? <span className="text-xs px-3 py-1 rounded-full bg-green-50 text-green-700 font-semibold">Approved</span>
                    : <div className="flex items-center gap-2">
                        <span className="text-xs px-3 py-1 rounded-full bg-amber-50 text-amber-700 font-semibold">Draft</span>
                        <button onClick={() => approveCert(cert)} disabled={approving[cert.id]}
                          className="text-xs px-3 py-1.5 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700 disabled:opacity-50 transition-colors">
                          {approving[cert.id] ? 'Approving…' : 'Approve'}
                        </button>
                      </div>
                  }
                </div>
              ))}
            </div>
          )}
          {tab === 'students' && (
            <div className="space-y-2">
              {students.length === 0 && <div className="text-center py-12 text-gray-400">No students enrolled yet.</div>}
              {students.map(s => (
                <div key={s.id} className="bg-white border border-gray-200 rounded-xl p-5 flex items-center gap-4">
                  <div className="w-9 h-9 rounded-full bg-[#2D1FB1] text-white flex items-center justify-center font-bold text-sm flex-shrink-0">
                    {(s.full_name || s.email || '?')[0].toUpperCase()}
                  </div>
                  <div className="flex-1">
                    <div className="font-semibold text-[#0F1631] text-sm">{s.full_name || s.email}</div>
                    <div className="text-xs text-gray-400">{s.email} · {s.role}</div>
                  </div>
                  <div className="text-xs text-gray-400">{new Date(s.created_at).toLocaleDateString()}</div>
                </div>
              ))}
            </div>
          )}
          {tab === 'review' && (
            <div className="space-y-3">
              {draftLessons.length === 0 && <div className="text-center py-12 text-gray-400">No lessons pending review.</div>}
              {draftLessons.map(lesson => (
                <div key={lesson.id} className="bg-white border border-amber-200 rounded-xl p-5 flex items-center gap-4">
                  <div className="flex-1">
                    <div className="font-semibold text-[#0F1631] text-sm">{lesson.title}</div>
                    <div className="text-xs text-gray-400 mt-0.5">
                      {lesson.modules?.certifications?.title} › {lesson.modules?.title}
                    </div>
                  </div>
                  <span className="text-xs px-2.5 py-1 rounded-full bg-amber-50 text-amber-700 font-semibold capitalize">{lesson.status}</span>
                  <button onClick={() => approveLesson(lesson)} disabled={approving[lesson.id]}
                    className="text-xs px-3 py-1.5 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700 disabled:opacity-50 transition-colors">
                    {approving[lesson.id] ? 'Approving…' : 'Approve'}
                  </button>
                </div>
              ))}
            </div>
          )}
          {tab === 'autopilot' && <AutopilotDashboard />}
          {tab === 'commerce' && <AdminOffersManager />}
          {tab === 'crm'      && <CRMDashboard />}
          {tab === 'content'  && <ContentEngine />}
        </>)}
      </main>
    );
  }

  // ─── Application Workspace ───────────────────────────────────────────────
  const PROGRAM_LABELS = {
    rmap: 'USDA RMAP — Rural Microentrepreneur Assistance',
    rbdg: 'USDA RBDG — Rural Business Development Grant',
    irp:  'IRP — Intermediary Relending Program',
    rlf_ops: 'RLF Operational Readiness Review',
    full_binder: 'Full Application Binder Gap Analysis',
  };

  const READINESS_COLORS = {
    not_ready:        { bg: 'bg-red-50',    text: 'text-red-700',    border: 'border-red-200',    label: 'Not Ready' },
    emerging:         { bg: 'bg-orange-50', text: 'text-orange-700', border: 'border-orange-200', label: 'Emerging' },
    competitive:      { bg: 'bg-yellow-50', text: 'text-yellow-700', border: 'border-yellow-200', label: 'Competitive' },
    strong:           { bg: 'bg-blue-50',   text: 'text-blue-700',   border: 'border-blue-200',   label: 'Strong' },
    submission_ready: { bg: 'bg-green-50',  text: 'text-green-700',  border: 'border-green-200',  label: 'Submission Ready' },
  };

  function ApplicationWorkspace({ user, profile, onBack }) {
    const [step, setStep] = useState('list'); // list | create | workspace | scoring | results
    const [workspaces, setWorkspaces] = useState([]);
    const [activeWS, setActiveWS]     = useState(null);
    const [criteria, setCriteria]     = useState([]);
    const [answers, setAnswers]       = useState({});
    const [evidence, setEvidence]     = useState([]);
    const [scoringResult, setScoringResult] = useState(null);
    const [priorResults, setPriorResults]   = useState([]);
    const [loading, setLoading]   = useState(true);
    const [scoring, setScoring]   = useState(false);
    const [scoreError, setScoreError] = useState('');
    const [context, setContext]   = useState('');
    const [uploading, setUploading] = useState(false);
    const [newWS, setNewWS] = useState({ program_type: 'rmap', title: '', applicant_name: '', fiscal_year: new Date().getFullYear() });

    useEffect(() => {
      loadWorkspaces();
    }, []);

    const loadWorkspaces = async () => {
      setLoading(true);
      const sb = await getSupabase();
      if (!sb) { setLoading(false); return; }
      const { data } = await sb.from('application_workspaces').select('*').order('updated_at', { ascending: false });
      setWorkspaces(data || []);
      setLoading(false);
    };

    const createWorkspace = async () => {
      if (!newWS.title.trim()) return;
      const sb = await getSupabase();
      if (!sb) return;
      const { data } = await sb.from('application_workspaces').insert({
        user_id: user.id, ...newWS, title: newWS.title.trim()
      }).select().single();
      if (data) { await openWorkspace(data); }
    };

    const openWorkspace = async (ws) => {
      setActiveWS(ws);
      setLoading(true);
      const sb = await getSupabase();
      if (!sb) { setLoading(false); return; }
      const [{ data: rubric }, { data: ans }, { data: ev }, { data: results }] = await Promise.all([
        sb.from('scoring_rubrics').select('id').eq('program_type', ws.program_type).eq('is_active', true).order('version', { ascending: false }).limit(1).maybeSingle(),
        sb.from('application_answers').select('*').eq('workspace_id', ws.id),
        sb.from('evidence_files').select('*').eq('workspace_id', ws.id),
        sb.from('scoring_results').select('*, scoring_runs(started_at, model_used)').eq('workspace_id', ws.id).order('created_at', { ascending: false }).limit(5)
      ]);
      if (rubric) {
        const { data: crit } = await sb.from('scoring_criteria').select('*').eq('rubric_id', rubric.id).order('sort_order');
        setCriteria(crit || []);
      }
      const amap = {}; (ans || []).forEach(a => { amap[a.criterion_id] = a.answer_text || ''; });
      setAnswers(amap);
      setEvidence(ev || []);
      setPriorResults(results || []);
      setScoringResult(results?.[0] || null);
      setLoading(false);
      setStep('workspace');
    };

    const saveAnswer = async (criterionId, text) => {
      setAnswers(a => ({ ...a, [criterionId]: text }));
      const sb = await getSupabase();
      if (!sb) return;
      await sb.from('application_answers').upsert({
        workspace_id: activeWS.id, criterion_id: criterionId, answer_text: text, updated_at: new Date().toISOString()
      }, { onConflict: 'workspace_id,criterion_id' });
    };

    const uploadEvidence = async (file, criterionId) => {
      setUploading(true);
      const sb = await getSupabase();
      if (!sb) { setUploading(false); return; }
      try {
        const { data: { session } } = await sb.auth.getSession();
        const res = await fetch('/.netlify/functions/sign-upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
          body: JSON.stringify({ workspace_id: activeWS.id, file_name: file.name, mime_type: file.type, file_size: file.size })
        });
        const { signed_url, path } = await res.json();
        await fetch(signed_url, { method: 'PUT', body: file, headers: { 'Content-Type': file.type } });
        const { data: ef } = await sb.from('evidence_files').insert({
          workspace_id: activeWS.id, user_id: user.id, file_name: file.name,
          file_path: path, file_size: file.size, mime_type: file.type,
          label: file.name, criterion_id: criterionId || null
        }).select().single();
        if (ef) setEvidence(prev => [...prev, ef]);
      } catch (e) { alert('Upload failed: ' + e.message); }
      setUploading(false);
    };

    const runScoring = async () => {
      setScoring(true); setScoreError('');
      const sb = await getSupabase();
      if (!sb) { setScoring(false); return; }
      try {
        const { data: { session } } = await sb.auth.getSession();
        const res = await fetch('/.netlify/functions/ai-scoring', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
          body: JSON.stringify({ workspace_id: activeWS.id, context })
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
        setScoringResult({ ...json.result, created_at: new Date().toISOString() });
        setPriorResults(prev => [{ ...json.result, created_at: new Date().toISOString() }, ...prev]);
        setStep('results');
      } catch (e) { setScoreError(e.message); }
      setScoring(false);
    };

    // Group criteria by section
    const sections = criteria.reduce((acc, c) => {
      if (!acc[c.section_code]) acc[c.section_code] = { label: c.section_label, items: [] };
      acc[c.section_code].items.push(c);
      return acc;
    }, {});

    if (loading && step !== 'list') return <div className="text-center py-20 text-gray-400">Loading workspace…</div>;

    // LIST view
    if (step === 'list') return (
      <main className="max-w-4xl mx-auto px-4 py-10 fade-in">
        <button onClick={onBack} className="text-sm text-gray-500 hover:text-[#2D1FB1] mb-6 flex items-center gap-1">← Dashboard</button>
        <div className="flex items-center justify-between mb-6">
          <div>
            <h1 className="text-3xl font-bold text-[#0F1631] mb-1">AI Scoring Engine</h1>
            <p className="text-gray-500 text-sm">Score your RMAP, RBDG, or IRP application readiness against the exact federal criteria.</p>
          </div>
          <button onClick={() => setStep('create')} className="px-5 py-2.5 bg-[#F97316] text-white font-bold rounded-xl hover:bg-orange-600 transition-colors text-sm">+ New Workspace</button>
        </div>
        <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 mb-6 text-xs text-amber-800 leading-relaxed">
          <strong>Advisory tool only.</strong> AI scoring estimates are based on publicly available federal criteria. Results do not represent USDA's review or determination and do not guarantee funding, eligibility, or approval.
        </div>
        {loading ? <div className="text-center py-12 text-gray-400">Loading…</div> : workspaces.length === 0 ? (
          <div className="bg-white border border-gray-200 rounded-2xl p-12 text-center">
            <div className="text-4xl mb-4">📋</div>
            <div className="font-bold text-[#0F1631] mb-2">No workspaces yet</div>
            <p className="text-gray-500 text-sm mb-5">Create a workspace for each application you're preparing.</p>
            <button onClick={() => setStep('create')} className="px-6 py-2.5 bg-[#2D1FB1] text-white font-bold rounded-xl hover:bg-indigo-700 transition-colors text-sm">Create First Workspace</button>
          </div>
        ) : (
          <div className="space-y-3">
            {workspaces.map(ws => (
              <div key={ws.id} className="bg-white border border-gray-200 rounded-xl p-5 hover:shadow-md transition-shadow cursor-pointer flex items-center gap-4" onClick={() => openWorkspace(ws)}>
                <div className="w-10 h-10 rounded-lg bg-[#2D1FB1] text-white flex items-center justify-center text-xs font-black flex-shrink-0">{ws.program_type.toUpperCase().slice(0,4)}</div>
                <div className="flex-1">
                  <div className="font-bold text-[#0F1631]">{ws.title}</div>
                  <div className="text-xs text-gray-400 mt-0.5">{PROGRAM_LABELS[ws.program_type]} · FY {ws.fiscal_year}</div>
                </div>
                <span className="text-[#2D1FB1] text-sm font-semibold">Open →</span>
              </div>
            ))}
          </div>
        )}
      </main>
    );

    // CREATE view
    if (step === 'create') return (
      <main className="max-w-2xl mx-auto px-4 py-10 fade-in">
        <button onClick={() => setStep('list')} className="text-sm text-gray-500 hover:text-[#2D1FB1] mb-6 flex items-center gap-1">← Back</button>
        <h2 className="text-2xl font-bold text-[#0F1631] mb-6">New Application Workspace</h2>
        <div className="bg-white border border-gray-200 rounded-2xl p-6 space-y-4">
          <div>
            <label className="block text-xs font-semibold text-gray-600 mb-1">Program Type</label>
            <select value={newWS.program_type} onChange={e => setNewWS(w => ({ ...w, program_type: e.target.value }))}
              className="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#2D1FB1]">
              {Object.entries(PROGRAM_LABELS).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
            </select>
          </div>
          <div>
            <label className="block text-xs font-semibold text-gray-600 mb-1">Workspace Title</label>
            <input value={newWS.title} onChange={e => setNewWS(w => ({ ...w, title: e.target.value }))}
              className="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#2D1FB1]"
              placeholder="e.g. Our Organization RMAP 2026 Application" />
          </div>
          <div>
            <label className="block text-xs font-semibold text-gray-600 mb-1">Applicant Organization Name</label>
            <input value={newWS.applicant_name} onChange={e => setNewWS(w => ({ ...w, applicant_name: e.target.value }))}
              className="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#2D1FB1]"
              placeholder="Legal name of your organization" />
          </div>
          <div>
            <label className="block text-xs font-semibold text-gray-600 mb-1">Federal Fiscal Year</label>
            <input type="number" value={newWS.fiscal_year} onChange={e => setNewWS(w => ({ ...w, fiscal_year: parseInt(e.target.value) }))}
              className="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-[#2D1FB1]" />
          </div>
          <div className="flex gap-3 pt-2">
            <button onClick={() => setStep('list')} className="flex-1 py-2.5 border border-gray-200 text-gray-600 rounded-xl text-sm hover:bg-gray-50 transition-colors">Cancel</button>
            <button onClick={createWorkspace} disabled={!newWS.title.trim()}
              className="flex-1 py-2.5 bg-[#2D1FB1] text-white font-bold rounded-xl text-sm hover:bg-indigo-700 disabled:opacity-40 transition-colors">Create Workspace</button>
          </div>
        </div>
      </main>
    );

    // WORKSPACE view
    if (step === 'workspace' || step === 'scoring') return (
      <main className="max-w-5xl mx-auto px-4 py-10 fade-in">
        <button onClick={() => { setStep('list'); setActiveWS(null); }} className="text-sm text-gray-500 hover:text-[#2D1FB1] mb-4 flex items-center gap-1">← All Workspaces</button>
        <div className="flex items-start justify-between gap-4 mb-6">
          <div>
            <h1 className="text-2xl font-bold text-[#0F1631]">{activeWS?.title}</h1>
            <p className="text-sm text-gray-500">{PROGRAM_LABELS[activeWS?.program_type]} · FY {activeWS?.fiscal_year}</p>
          </div>
          <div className="flex gap-2">
            {scoringResult && <button onClick={() => setStep('results')} className="px-4 py-2 border border-[#2D1FB1] text-[#2D1FB1] text-sm font-semibold rounded-lg hover:bg-blue-50 transition-colors">View Last Score</button>}
            <button onClick={runScoring} disabled={scoring}
              className="px-5 py-2 bg-[#F97316] text-white text-sm font-bold rounded-lg hover:bg-orange-600 disabled:opacity-50 transition-colors flex items-center gap-2">
              {scoring ? '⏳ Scoring…' : '🤖 Run AI Score'}
            </button>
          </div>
        </div>
        {scoreError && <div className="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700">{scoreError}</div>}

          </label>
          {evidence.length > 0 && (
            <div className="mt-3 space-y-1">
              {evidence.map(ef => (
                <div key={ef.id} className="flex items-center gap-2 text-xs text-gray-600">
                  <span>📄</span><span>{ef.label || ef.file_name}</span>
                  <span className="text-gray-400">({ef.file_size ? (ef.file_size/1024).toFixed(0)+'KB' : ''})</span>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Criteria by section */}
        {Object.entries(sections).map(([sectionCode, section]) => (
          <div key={sectionCode} className="mb-6">
            <div className="bg-[#2D1FB1] text-white px-5 py-3 rounded-t-xl">
              <div className="text-xs font-mono opacity-70">{sectionCode}</div>
              <div className="font-bold">{section.label}</div>

            <div className="bg-white border border-t-0 border-gray-200 rounded-b-xl divide-y divide-gray-100">
              {section.items.map(criterion => (
                <div key={criterion.id} className="p-5">
                  <div className="flex items-start justify-between gap-4 mb-2">
                    <div>
                      <span className="text-xs font-mono bg-gray-100 px-1.5 py-0.5 rounded mr-2">{criterion.criterion_code}</span>

      </main>
    );

    // RESULTS view
    if (step === 'results' && scoringResult) {
      const r = scoringResult;
      const rl = READINESS_COLORS[r.readiness_level] || READINESS_COLORS.emerging;

            <button onClick={() => window.print()} className="px-4 py-2 border border-gray-200 text-gray-600 text-sm rounded-lg hover:bg-gray-50 transition-colors">🖨 Print Report</button>

          {/* Score header */}
          <div className={`rounded-2xl p-8 mb-6 text-center border ${rl.bg} ${rl.border}`}>
            <div className={`text-6xl font-black mb-1 ${rl.text}`}>{r.total_score_estimate}<span className="text-2xl font-bold opacity-60">/{r.max_possible_score}</span></div>
            <div className={`text-xl font-bold mb-2 ${rl.text}`}>{rl.label}</div>
            <div className="w-full bg-white/60 rounded-full h-3 max-w-sm mx-auto mb-3">
              <div className={`h-3 rounded-full ${rl.text.replace('text-','bg-')}`} style={{ width: `${pct}%` }}/>
            </div>
            {r.readiness_level_explanation && <p className="text-sm text-gray-600">{r.readiness_level_explanation}</p>}
          </div>

          {/* Section scores */}
          {Object.keys(r.section_scores || {}).length > 0 && (
            <div className="bg-white border border-gray-200 rounded-xl p-5 mb-5">
              <div className="font-bold text-[#0F1631] mb-3">Section Scores</div>
              <div className="space-y-3">
                {Object.entries(r.section_scores).map(([code, s]) => (
                  <div key={code}>
                    <div className="flex justify-between text-sm mb-1">
                      <span className="font-medium text-gray-700">{s.label || code}</span>
                      <span className="font-bold text-[#0F1631]">{s.score}/{s.max}</span>
                    </div>
                    <div className="h-2 bg-gray-100 rounded-full">
                      <div className="h-2 bg-[#2D1FB1] rounded-full" style={{ width: `${s.pct || (s.score/s.max*100)}%` }}/>

                  <button key={i} onClick={() => setScoringResult(pr)}

                    <span className="text-gray-600">{new Date(pr.created_at).toLocaleDateString()}</span>

    return null;

  // ─── RLF Readiness Quiz Funnel ───────────────────────────────────────────
  const RESULT_CONFIG = {
    beginner:   { label: 'Building the Foundations', color: '#F97316', bg: 'bg-orange-50', border: 'border-orange-200', pctRange: '0–34%',
      description: 'Your organization is in the early stages of building the capacity needed for USDA rural capital programs. The right training can accelerate your readiness significantly.',
      nextStep: 'Start with Cert 1 (Microfinance Foundations) to build your foundational vocabulary and framework.',
      cert: 1 },
    developing: { label: 'Developing Capacity', color: '#FFD23F', bg: 'bg-yellow-50', border: 'border-yellow-200', pctRange: '35–59%',
      description: 'You have meaningful foundational capacity but key gaps remain. Focus on policy documentation and financial management before submitting a competitive application.',
      nextStep: 'Cert 3 (RMAP Eligibility, Application & Scoring) will map your gaps directly to the federal scoring criteria.',
      cert: 3 },
    ready:      { label: 'Ready to Apply', color: '#2D1FB1', bg: 'bg-blue-50', border: 'border-blue-200', pctRange: '60–79%',

    advanced:   { label: 'Advanced Practitioner', color: '#1F7A4A', bg: 'bg-green-50', border: 'border-green-200', pctRange: '80–100%',

  function RLFReadinessQuiz({ onComplete }) {
    const [questions, setQuestions]   = useState([]);
    const [loading, setLoading]       = useState(true);
    const [idx, setIdx]               = useState(0);
    const [answers, setAnswers]       = useState({});
    const [stage, setStage]           = useState('quiz'); // quiz | capture | result
    const [name, setName]             = useState('');
    const [email, setEmail]           = useState('');
    const [org, setOrg]               = useState('');
    const [submitting, setSubmitting] = useState(false);
    const [result, setResult]         = useState(null);

    useEffect(() => {
      (async () => {
        const sb = await getSupabase();
        if (!sb) { setLoading(false); return; }
        const { data } = await sb.from('public_quiz_questions').select('*').eq('is_active', true).order('sort_order');
        setQuestions(data || []);
        setLoading(false);
      })();
    }, []);

    const total = questions.length;
    const q = questions[idx];
    const pct = total ? Math.round(((idx) / total) * 100) : 0;

    const calcScore = () => {
      let score = 0, max = 0;
      questions.forEach(q => {
        const opts = q.options || [];
        const maxPts = Math.max(...opts.map(o => o.points || 0));
        max += maxPts;
        const chosen = opts.find(o => o.id === answers[q.id]);
        score += chosen?.points || 0;
      });
      return { score, max };
    };

    const submitResult = async () => {
      if (!email.trim()) return;
      setSubmitting(true);
      const { score, max } = calcScore();
      const pctScore = Math.round((score / max) * 100);
      const tag = pctScore >= 80 ? 'advanced' : pctScore >= 60 ? 'ready' : pctScore >= 35 ? 'developing' : 'beginner';
      try {
        await fetch('/.netlify/functions/lead-capture', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, organization: org, source: 'quiz', answers, score, max_score: max })
        });
      } catch {}
      setResult({ score: pctScore, tag, config: RESULT_CONFIG[tag] });
      setStage('result');
      setSubmitting(false);
    };

    if (loading) return <div className="text-center py-20 text-gray-400">Loading quiz…</div>;

    return (
      <div className="max-w-2xl mx-auto px-4 py-12 fade-in">
        <div className="text-center mb-8">
          <div className="inline-block bg-[#2D1FB1] text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-4">Free Assessment</div>
          <h2 className="text-3xl font-black text-[#0F1631] mb-2">RLF Readiness Quiz</h2>
          <p className="text-gray-500">12 questions · 3 minutes · Get your personalized score</p>
        </div>

        {stage === 'quiz' && q && (
          <div className="bg-white rounded-2xl border border-gray-200 shadow-sm p-8">
            <div className="mb-6">
              <div className="flex justify-between text-xs text-gray-400 mb-2"><span>Question {idx + 1} of {total}</span><span>{pct}% complete</span></div>
              <div className="h-2 bg-gray-100 rounded-full"><div className="h-2 bg-[#2D1FB1] rounded-full transition-all" style={{ width: `${pct}%` }}/></div>
            </div>
            <h3 className="text-lg font-bold text-[#0F1631] mb-5 leading-snug">{q.question_text}</h3>
            <div className="space-y-3">
              {(q.options || []).map(opt => (
                <button key={opt.id} onClick={() => setAnswers(a => ({ ...a, [q.id]: opt.id }))}
                  className={`w-full text-left px-4 py-3.5 rounded-xl border text-sm font-medium transition-all ${answers[q.id] === opt.id ? 'bg-[#2D1FB1] border-[#2D1FB1] text-white' : 'border-gray-200 text-gray-700 hover:border-[#2D1FB1] bg-white'}`}>
                  {opt.text}
                </button>
              ))}
            </div>
            <div className="flex justify-between mt-6">
              <button onClick={() => setIdx(i => Math.max(0, i - 1))} disabled={idx === 0}
                className="px-4 py-2 text-sm text-gray-500 border border-gray-200 rounded-lg hover:bg-gray-50 disabled:opacity-30 transition-colors">← Back</button>
              {idx < total - 1 ? (
                <button onClick={() => setIdx(i => i + 1)} disabled={!answers[q.id]}
                  className="px-6 py-2 bg-[#2D1FB1] text-white text-sm font-bold rounded-lg hover:bg-indigo-700 disabled:opacity-30 transition-colors">Next →</button>
              ) : (
                <button onClick={() => setStage('capture')} disabled={!answers[q.id]}
                  className="px-6 py-2 bg-[#F97316] text-white text-sm font-bold rounded-lg hover:bg-orange-600 disabled:opacity-30 transition-colors">Get My Score →</button>
              )}
            </div>
          </div>
        )}

        {stage === 'capture' && (
          <div className="bg-white rounded-2xl border border-gray-200 shadow-sm p-8 text-center">
            <div className="text-4xl mb-4">🎯</div>
            <h3 className="text-2xl font-black text-[#0F1631] mb-2">Almost there!</h3>
            <p className="text-gray-500 mb-6">Enter your info to see your personalized score and action plan.</p>
            <div className="space-y-3 text-left mb-5">
              {/* Honeypot */}
              <input type="text" name="website" style={{ display: 'none' }} tabIndex={-1} autoComplete="off" />
              <input value={name} onChange={e => setName(e.target.value)}
                className="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-[#2D1FB1]"
                placeholder="Your name" />
              <input value={email} onChange={e => setEmail(e.target.value)}
                className="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-[#2D1FB1]"
                placeholder="Your email address *" type="email" required />
              <input value={org} onChange={e => setOrg(e.target.value)}
                className="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-[#2D1FB1]"
                placeholder="Organization name" />
            </div>
            <button onClick={submitResult} disabled={!email.trim() || submitting}
              className="w-full py-3.5 bg-[#F97316] text-white font-black rounded-xl hover:bg-orange-600 disabled:opacity-50 transition-colors">
              {submitting ? 'Calculating…' : 'See My Score →'}
            </button>
            <p className="text-xs text-gray-400 mt-3">No spam. Unsubscribe anytime.</p>
          </div>
        )}

        {stage === 'result' && result && (
          <div>
            <div className={`rounded-2xl border-2 p-8 text-center mb-6 ${result.config.bg} ${result.config.border}`}>
              <div className="text-6xl font-black mb-2" style={{ color: result.config.color }}>{result.score}%</div>
              <div className="text-2xl font-black mb-2" style={{ color: result.config.color }}>{result.config.label}</div>
              <div className="text-sm text-gray-600 mb-1">{result.config.pctRange} readiness range</div>
            </div>
            <div className="bg-white border border-gray-200 rounded-2xl p-6 mb-5">
              <h4 className="font-bold text-[#0F1631] mb-2">What this means</h4>
              <p className="text-sm text-gray-600 leading-relaxed mb-4">{result.config.description}</p>
              <div className="bg-[#F8FAFC] rounded-xl p-4">
                <div className="text-xs font-bold text-[#2D1FB1] mb-1 uppercase tracking-wider">Recommended next step</div>
                <p className="text-sm text-gray-700">{result.config.nextStep}</p>
              </div>
            </div>
            <div className="bg-[#2D1FB1] rounded-2xl p-6 text-center">
              <div className="text-white font-bold text-lg mb-2">Ready to close the gaps?</div>
              <p className="text-indigo-200 text-sm mb-5">Cap Fund Academy has the exact training, templates, and AI scoring tools you need.</p>
              <button onClick={onComplete} className="px-8 py-3 bg-[#F97316] text-white font-black rounded-xl hover:bg-orange-600 transition-colors">
                Explore Certifications →
              </button>
            </div>
            <p className="text-xs text-gray-400 text-center mt-4">Results sent to your email. Check your inbox.</p>
          </div>
        )}
      </div>
    );
  }

  // ─── RMAP Checklist Lead Magnet ───────────────────────────────────────────
  const RMAP_CHECKLIST = [
    { section: 'Required for All Applicants — 4280.316(a)', items: [
      { item: 'SF-424 Application for Federal Assistance', points: null, critical: true },
      { item: 'UEI number (from SAM.gov)', points: null, critical: true },

  function RMAPChecklist({ onCapture }) {
    const [captured, setCaptured] = useState(false);
    const [name, setName]         = useState('');
    const [email, setEmail]       = useState('');
    const [org, setOrg]           = useState('');
    const [submitting, setSubmitting] = useState(false);
    const [checked, setChecked]   = useState({});

    const submit = async () => {
      if (!email.trim()) return;
      setSubmitting(true);
      try {
        await fetch('/.netlify/functions/lead-capture', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, organization: org, source: 'checklist' })
        });
      } catch {}
      setCaptured(true);
      setSubmitting(false);
    };

    const totalPoints = RMAP_CHECKLIST.flatMap(s => s.items).reduce((sum, i) => sum + (i.points || 0), 0);

  // ─── Pricing Page ────────────────────────────────────────────────────────
  function PricingPage({ onCheckout, user }) {
    const [offers, setOffers] = useState([]);
    const [loading, setLoading] = useState(true);
    const [coupon, setCoupon] = useState('');
    const [checkingOut, setCheckingOut] = useState(null);
    const [checkoutError, setCheckoutError] = useState('');

    useEffect(() => {
      (async () => {
        const sb = await getSupabase();
        if (!sb) { setLoading(false); return; }
        const { data } = await sb.from('offers').select('*').eq('is_active', true).order('sort_order');
        setOffers(data || []);
        setLoading(false);
      })();
    }, []);

    const startCheckout = async (offer) => {
      if (!user) { setCheckoutError('Please log in to purchase.'); return; }
      setCheckingOut(offer.id);
      setCheckoutError('');
      const sb = await getSupabase();
      if (!sb) { setCheckingOut(null); return; }
      try {
        const { data: { session } } = await sb.auth.getSession();
        const res = await fetch('/.netlify/functions/stripe-checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
          body: JSON.stringify({ offer_id: offer.id, coupon_code: coupon || undefined })
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Checkout failed');
        window.location.href = json.url;
      } catch (e) { setCheckoutError(e.message); setCheckingOut(null); }
    };

    const fmt = (cents) => '$' + (cents / 100).toLocaleString('en-US', { minimumFractionDigits: 0 });

      <main className="max-w-6xl mx-auto px-4 py-16 fade-in">

          <p className="text-gray-500 text-lg max-w-2xl mx-auto">Choose the path that fits your organization's goals and budget. All certifications include lifetime access and artifact templates.</p>

        {checkoutError && (
          <div className="max-w-lg mx-auto mb-6 p-4 bg-red-50 border border-red-200 rounded-xl text-sm text-red-700">{checkoutError}</div>
        )}

        {/* Coupon input */}
        <div className="max-w-sm mx-auto mb-10 flex gap-2">
          <input value={coupon} onChange={e => setCoupon(e.target.value.toUpperCase())}
            className="flex-1 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#2D1FB1]"
            placeholder="Coupon code (optional)" />
        </div>

        {loading ? <div className="text-center py-12 text-gray-400">Loading offers…</div> : (
          <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
            {offers.map(offer => (
              <div key={offer.id} className={`bg-white rounded-2xl border-2 p-6 flex flex-col ${offer.is_featured ? 'border-[#F97316] shadow-xl' : 'border-gray-200'}`}>
                {offer.is_featured && (
                  <div className="text-xs font-black text-[#F97316] uppercase tracking-wider mb-3">Most Popular</div>
                )}
                <div className="text-2xl mb-2">{typeIcon[offer.offer_type] || '📋'}</div>
                <h3 className="text-xl font-black text-[#0F1631] mb-2">{offer.title}</h3>
                <p className="text-gray-500 text-sm mb-4 leading-relaxed flex-1">{offer.description}</p>
                {offer.features?.length > 0 && (
                  <ul className="space-y-1.5 mb-6">
                    {offer.features.map((f, i) => (
                      <li key={i} className="flex items-start gap-2 text-sm text-gray-700">
                        <span className="text-green-500 font-bold flex-shrink-0">✓</span>{f}
                      </li>
                    ))}
                  </ul>
                )}
                <div className="mt-auto">
                  <div className="text-3xl font-black text-[#0F1631] mb-1">
                    {fmt(offer.price_cents)}
                    {offer.offer_type === 'subscription' && <span className="text-base font-normal text-gray-400">/mo</span>}
                  </div>
                  {offer.seat_limit > 1 && <div className="text-xs text-gray-400 mb-3">Up to {offer.seat_limit} seats</div>}
                  {offer.offer_type === 'dwu' ? (
                    <a href="mailto:support@capfundacademy.com?subject=Done-With-You Application Support Inquiry"
                      className="block w-full py-3 text-center bg-[#0F1631] text-white font-bold rounded-xl hover:bg-gray-800 transition-colors text-sm">
                      Contact Us →
                    </a>
                  ) : (
                    <button onClick={() => startCheckout(offer)} disabled={!!checkingOut}
                      className={`w-full py-3 font-bold rounded-xl transition-colors text-sm ${offer.is_featured ? 'bg-[#F97316] hover:bg-orange-600 text-white' : 'bg-[#2D1FB1] hover:bg-indigo-700 text-white'} disabled:opacity-50`}>
                      {checkingOut === offer.id ? 'Redirecting…' : 'Get Started'}
                    </button>
                  )}
                </div>
              </div>
            ))}
          </div>
        )}

        <div className="mt-12 text-center text-xs text-gray-400 max-w-2xl mx-auto leading-relaxed">
          {DISCLAIMER}
        </div>
      </main>
    );
  }

  // ─── Autopilot Health Dashboard ──────────────────────────────────────────
  function AutopilotDashboard() {
    const [metrics, setMetrics]         = useState(null);
    const [exceptions, setExceptions]   = useState([]);
    const [runs, setRuns]               = useState([]);
    const [loading, setLoading]         = useState(true);
    const [resolving, setResolving]     = useState({});

    useEffect(() => { loadDashboard(); }, []);

    const loadDashboard = async () => {
      setLoading(true);
      const sb = await getSupabase();
      if (!sb) { setLoading(false); return; }

      const sevenDaysAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();

      const [
        { count: leads7d },
        { count: students },
        { data: orders7d },
        { count: completions7d },
        { count: scoringRuns7d },
        { count: postsGenerated7d },
        { count: pendingApprovals },
        { count: pendingContent },
        { count: pendingWaivers },
        { data: recentExceptions },
        { data: recentRuns }
      ] = await Promise.all([
        sb.from('leads').select('*', { count: 'exact', head: true }).gte('created_at', sevenDaysAgo),
        sb.from('profiles').select('*', { count: 'exact', head: true }).eq('role', 'student'),
        sb.from('orders').select('amount_cents').eq('status', 'paid').gte('created_at', sevenDaysAgo),
        sb.from('certification_completions').select('*', { count: 'exact', head: true }).gte('completed_at', sevenDaysAgo),
        sb.from('scoring_runs').select('*', { count: 'exact', head: true }).eq('status', 'complete').gte('started_at', sevenDaysAgo),
        sb.from('social_posts').select('*', { count: 'exact', head: true }).gte('created_at', sevenDaysAgo),
        sb.from('quiz_responses').select('*', { count: 'exact', head: true }).gte('created_at', sevenDaysAgo),
        sb.from('social_posts').select('*', { count: 'exact', head: true }).eq('status', 'review'),
        sb.from('prerequisite_waivers').select('*', { count: 'exact', head: true }).eq('status', 'pending'),
        sb.from('exception_events').select('*').eq('resolved', false).order('created_at', { ascending: false }).limit(20),
        sb.from('autopilot_runs').select('*').order('started_at', { ascending: false }).limit(15),
      ]);

      const revenue7d = (orders7d || []).reduce((s, o) => s + (o.amount_cents || 0), 0);
      setMetrics({ leads7d, students, revenue7d, completions7d, scoringRuns7d, postsGenerated7d, pendingApprovals, pendingContent, pendingWaivers });
      setExceptions(recentExceptions || []);
      setRuns(recentRuns || []);
      setLoading(false);
    };

    const resolveException = async (ex) => {
      setResolving(r => ({ ...r, [ex.id]: true }));
      const sb = await getSupabase();
      if (!sb) { setResolving(r => ({ ...r, [ex.id]: false })); return; }
      const { data: { user } } = await sb.auth.getUser();
      await sb.from('exception_events').update({ resolved: true, resolved_at: new Date().toISOString(), resolved_by: user.id }).eq('id', ex.id);
      setExceptions(prev => prev.filter(e => e.id !== ex.id));
      setResolving(r => ({ ...r, [ex.id]: false }));
    };

    const SEV_COLORS = { info: 'text-blue-600 bg-blue-50', warning: 'text-amber-700 bg-amber-50', error: 'text-red-700 bg-red-50', critical: 'text-red-900 bg-red-100' };
    const SEV_ICONS  = { info: 'ℹ️', warning: '⚠️', error: '🚨', critical: '🔴' };
    const RUN_COLORS = { success: 'text-green-700 bg-green-50', failed: 'text-red-700 bg-red-50', partial: 'text-amber-700 bg-amber-50', running: 'text-blue-700 bg-blue-50' };
    const fmtRelative = (d) => {
      if (!d) return '—';
      const diff = Date.now() - new Date(d).getTime();
      if (diff < 3600000) return Math.floor(diff/60000) + 'm ago';
      if (diff < 86400000) return Math.floor(diff/3600000) + 'h ago';
      return Math.floor(diff/86400000) + 'd ago';
    };
    const fmt = (cents) => '$' + ((cents || 0) / 100).toLocaleString('en-US', { minimumFractionDigits: 0 });

    if (loading) return <div className="text-center py-16 text-gray-400">Loading autopilot dashboard…</div>;

    const pendingTotal = (metrics?.pendingContent || 0) + (metrics?.pendingWaivers || 0);

    return (
      <div className="fade-in space-y-6">
        {/* Header */}
        <div className="flex items-center justify-between">
          <div>
            <h2 className="text-xl font-bold text-[#0F1631]">Autopilot Health</h2>
            <p className="text-sm text-gray-500">Live metrics · last 7 days · {new Date().toLocaleDateString()}</p>
          </div>
          <button onClick={loadDashboard} className="px-4 py-2 border border-gray-200 text-sm font-semibold rounded-lg hover:bg-gray-50 transition-colors">↻ Refresh</button>
        </div>

        {/* KPI grid */}
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
          {[
            { label: 'New Leads (7d)',       value: metrics?.leads7d || 0,        color: '#2D1FB1', icon: '👥' },
            { label: 'Revenue (7d)',          value: fmt(metrics?.revenue7d),      color: '#16A34A', icon: '💰' },
            { label: 'Total Students',        value: metrics?.students || 0,       color: '#F97316', icon: '🎓' },
            { label: 'Certs Completed (7d)',  value: metrics?.completions7d || 0,  color: '#7C3AED', icon: '🏆' },
            { label: 'AI Scores Run (7d)',    value: metrics?.scoringRuns7d || 0,  color: '#0891B2', icon: '🤖' },
            { label: 'Content Generated (7d)',value: metrics?.postsGenerated7d||0, color: '#2D1FB1', icon: '✍️' },
            { label: 'Quiz Completions (7d)', value: metrics?.pendingApprovals||0, color: '#D97706', icon: '📊' },
            { label: 'Pending Approvals',     value: pendingTotal,                 color: pendingTotal > 0 ? '#DC2626' : '#16A34A', icon: pendingTotal > 0 ? '🔔' : '✅' },
          ].map(({ label, value, color, icon }) => (
            <div key={label} className="bg-white border border-gray-200 rounded-xl p-4">
              <div className="text-lg mb-1">{icon}</div>
              <div className="text-2xl font-black" style={{ color }}>{value}</div>
              <div className="text-xs text-gray-500 mt-0.5 leading-tight">{label}</div>
            </div>
          ))}
        </div>

        {/* Scheduled functions */}
        <div className="bg-white border border-gray-200 rounded-xl overflow-hidden">
          <div className="px-5 py-3 border-b border-gray-100 flex items-center justify-between">
            <div className="font-bold text-[#0F1631] text-sm">Scheduled Functions</div>
            <div className="text-xs text-gray-400">{runs.length} recent runs</div>
          </div>
          <div className="divide-y divide-gray-100">
            {[
              { name: 'daily-nurture',     label: 'Daily Lead Nurture',      schedule: 'Daily 9am UTC' },
              { name: 'weekly-digest',     label: 'Weekly Digest Email',     schedule: 'Mondays 8am UTC' },
              { name: 'abandoned-checkout',label: 'Abandoned Checkout',      schedule: 'Every 2 hours' },
              { name: 'renewal-reminder',  label: 'Renewal Reminders',       schedule: 'Daily 10am UTC' },
              { name: 'exception-detect',  label: 'Exception Detection',     schedule: 'Every hour' },
            ].map(fn => {
              const lastRun = runs.find(r => r.function_name === fn.name);
              return (
                <div key={fn.name} className="px-5 py-3 flex items-center gap-4">
                  <div className="flex-1">
                    <div className="text-sm font-medium text-[#0F1631]">{fn.label}</div>
                    <div className="text-xs text-gray-400">{fn.schedule}</div>
                  </div>
                  {lastRun ? (
                    <div className="flex items-center gap-2">
                      <span className={`text-xs px-2 py-0.5 rounded-full font-semibold ${RUN_COLORS[lastRun.status] || 'bg-gray-100 text-gray-500'}`}>{lastRun.status}</span>
                      <span className="text-xs text-gray-400">{fmtRelative(lastRun.started_at)}</span>
                      {lastRun.records_processed > 0 && <span className="text-xs text-gray-400">{lastRun.records_processed} processed</span>}
                    </div>
                  ) : (
                    <span className="text-xs text-gray-300">No runs yet</span>
                  )}
                </div>
              );
            })}
          </div>
        </div>

        {/* Exceptions */}
        <div className="bg-white border border-gray-200 rounded-xl overflow-hidden">
          <div className="px-5 py-3 border-b border-gray-100 flex items-center justify-between">
            <div className="font-bold text-[#0F1631] text-sm">Active Exceptions {exceptions.length > 0 && <span className="ml-2 bg-red-100 text-red-700 text-xs px-1.5 py-0.5 rounded-full">{exceptions.length}</span>}</div>
          </div>
          {exceptions.length === 0 ? (
            <div className="px-5 py-8 text-center text-green-600 text-sm font-semibold">✅ No active exceptions</div>
          ) : (
            <div className="divide-y divide-gray-100">
              {exceptions.map(ex => (
                <div key={ex.id} className="px-5 py-4 flex items-start gap-3">
                  <span className="text-lg flex-shrink-0">{SEV_ICONS[ex.severity] || '⚠️'}</span>
                  <div className="flex-1">
                    <div className="flex items-center gap-2 mb-0.5">
                      <span className="font-semibold text-sm text-[#0F1631]">{ex.title}</span>
                      <span className={`text-xs px-2 py-0.5 rounded-full font-semibold ${SEV_COLORS[ex.severity] || 'bg-gray-100 text-gray-500'}`}>{ex.severity}</span>
                    </div>
                    {ex.description && <div className="text-xs text-gray-500 mb-1">{ex.description}</div>}
                    <div className="text-xs text-gray-400">{fmtRelative(ex.created_at)}</div>
                  </div>
                  <button onClick={() => resolveException(ex)} disabled={!!resolving[ex.id]}
                    className="text-xs px-3 py-1.5 border border-gray-200 rounded-lg hover:bg-gray-50 disabled:opacity-40 transition-colors flex-shrink-0">
                    {resolving[ex.id] ? '…' : 'Resolve'}
                  </button>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    );
  }

  // ─── Content Engine ──────────────────────────────────────────────────────
  const PLATFORMS = [
    { id: 'linkedin',         label: 'LinkedIn',       icon: '💼' },
    { id: 'facebook',         label: 'Facebook',       icon: '📘' },
    { id: 'instagram',        label: 'Instagram',      icon: '📸' },
    { id: 'tiktok_script',    label: 'TikTok/Reels',   icon: '🎬' },
    { id: 'email_newsletter', label: 'Newsletter',     icon: '📧' },
    { id: 'blog',             label: 'Blog Post',      icon: '✍️' },
    { id: 'ad_copy',          label: 'Ad Copy',        icon: '📣' },
    { id: 'seo_meta',         label: 'SEO Meta',       icon: '🔍' },
  ];

  const TOPIC_SUGGESTIONS = [
    'Why rural nonprofits struggle to access USDA RMAP funding',
    'The 7 documents USDA reviewers look at first in every RMAP application',
    'What is a revolving loan fund and why does your rural community need one',
    'RBDG vs RMAP: which USDA program is right for your organization',
    'How to build a competitive RMAP work plan from scratch',
    '3 reasons most RMAP applications get scored low on the service area criterion',
    'The borrower-centered lending principles every microlender should know',
    'How to use AI to score your RMAP application before you submit',
    'IRP intermediary relending: the underused federal capital tool for rural CDFIs',
    '2 CFR 200 compliance basics for new federal grantees',
  ];

  function ContentEngine() {
    const [tab, setTab]               = useState('generate'); // generate | calendar | queue | settings
    const [platform, setPlatform]     = useState('linkedin');
    const [topic, setTopic]           = useState('');
    const [context, setContext]       = useState('');
    const [generating, setGenerating] = useState(false);
    const [result, setResult]         = useState(null);
    const [error, setError]           = useState('');
    const [posts, setPosts]           = useState([]);
    const [loadingPosts, setLoadingPosts] = useState(false);
    const [bvs, setBvs]               = useState(null);
    const [savingBvs, setSavingBvs]   = useState(false);
    const [approving, setApproving]   = useState({});
    const [csvExporting, setCsvExporting] = useState(false);

    useEffect(() => {
      if (tab === 'queue' || tab === 'calendar') loadPosts();
      if (tab === 'settings') loadBVS();
    }, [tab]);

    const loadPosts = async () => {
      setLoadingPosts(true);
      const sb = await getSupabase();
      if (!sb) { setLoadingPosts(false); return; }
      const { data } = await sb.from('social_posts').select('*').order('created_at', { ascending: false }).limit(100);
      setPosts(data || []);
      setLoadingPosts(false);
    };

    const loadBVS = async () => {
      const sb = await getSupabase();
      if (!sb) return;
      const { data } = await sb.from('brand_voice_settings').select('*').limit(1).maybeSingle();
      setBvs(data);
    };

    const saveBVS = async () => {
      if (!bvs) return;
      setSavingBvs(true);
      const sb = await getSupabase();
      if (!sb) { setSavingBvs(false); return; }
      await sb.from('brand_voice_settings').update({ ...bvs, updated_at: new Date().toISOString() }).eq('id', bvs.id);
      setSavingBvs(false);
    };

    const generate = async () => {
      if (!topic.trim()) return;
      setGenerating(true); setError(''); setResult(null);
      const sb = await getSupabase();
      if (!sb) { setGenerating(false); return; }
      try {
        const { data: { session } } = await sb.auth.getSession();
        const res = await fetch('/.netlify/functions/content-generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
          body: JSON.stringify({ platform, topic: topic.trim(), additional_context: context.trim() || undefined, save: true })
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Generation failed');
        setResult(json);
      } catch (e) { setError(e.message); }
      setGenerating(false);
    };

    const approvePost = async (post) => {
      setApproving(a => ({ ...a, [post.id]: true }));
      const sb = await getSupabase();
      if (!sb) { setApproving(a => ({ ...a, [post.id]: false })); return; }
      const { data: { user } } = await sb.auth.getUser();
      await sb.from('social_posts').update({ status: 'approved', approved_by: user.id, approved_at: new Date().toISOString() }).eq('id', post.id);
      setPosts(prev => prev.map(p => p.id === post.id ? { ...p, status: 'approved' } : p));
      setApproving(a => ({ ...a, [post.id]: false }));
    };

    const rejectPost = async (post) => {
      const note = prompt('Reason for rejection (optional):');
      const sb = await getSupabase();
      if (!sb) return;
      await sb.from('social_posts').update({ status: 'rejected', rejection_note: note || null }).eq('id', post.id);
      setPosts(prev => prev.map(p => p.id === post.id ? { ...p, status: 'rejected' } : p));
    };

    const exportCSV = () => {
      setCsvExporting(true);
      const approved = posts.filter(p => p.status === 'approved');
      if (!approved.length) { alert('No approved posts to export.'); setCsvExporting(false); return; }
      const rows = [['Platform','Type','Content','Hashtags','UTM URL','Status','Approved At']];
      approved.forEach(p => {
        rows.push([
          p.platform, p.content_type,
          `"${(p.body || '').replace(/"/g,'""')}"`,
          (p.hashtags || []).join(' '),
          p.utm_url || '',
          p.status,
          p.approved_at ? new Date(p.approved_at).toLocaleDateString() : ''
        ]);
      });
      const csv = rows.map(r => r.join(',')).join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
