[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  included_files = ["netlify/functions/**"]

[[scheduled-functions]]
  name = "abandoned-checkout"
  cron = "0 */2 * * *"

[[scheduled-functions]]
  name = "daily-nurture"
  cron = "0 9 * * *"

[[scheduled-functions]]
  name = "weekly-digest"
  cron = "0 8 * * 1"

[[scheduled-functions]]
  name = "renewal-reminder"
  cron = "0 10 * * *"

[[scheduled-functions]]
  name = "exception-detect"
  cron = "0 * * * *"

[[scheduled-functions]]
  name = "daily-content"
  cron = "0 8 * * *"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
